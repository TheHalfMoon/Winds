name: t166-windows-diagnostic

on:
  push:
    branches:
      - probe/t166-windows-diagnostic
    paths:
      - .github/workflows/t166-windows-diagnostic.yml

permissions:
  contents: write

jobs:
  repair-and-qualify:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: 7fb5905d0d18867b9786d946d748517e6b429656
      TARGET_BRANCH: impl/spec-012-t166-protocol-v2
    steps:
      - name: Checkout exact T166 candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
      - name: Guard live target head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD"
      - name: Apply platform-contract repair
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("src/t166_multiplexer_protocol_v2_tests.rs")
          text = path.read_text(encoding="utf-8")
          old = '''            for result in [
                          client
                              .send_input(target, b"printf ready\\n".to_vec())
                              .unwrap(),
                          client.resize(target, 100, 30).unwrap(),
                          client.interrupt(target).unwrap(),
                      ] {
                          assert!(matches!(
                              result,
                              ClientResponseProjection::ControlState {
                                  authority: ClientAuthority::Controller,
                                  ..
                              }
                          ));
                      }
          '''
          new = '''            for result in [
                          client
                              .send_input(target, b"printf ready\\n".to_vec())
                              .unwrap(),
                          client.resize(target, 100, 30).unwrap(),
                      ] {
                          assert!(matches!(
                              result,
                              ClientResponseProjection::ControlState {
                                  authority: ClientAuthority::Controller,
                                  ..
                              }
                          ));
                      }

                      // Spec 011 deliberately keeps native-Windows interrupt unsupported and
                      // fail-closed. T152 qualifies that platform contract directly, so this
                      // real-endpoint integration must not require a successful Windows interrupt.
                      #[cfg(not(windows))]
                      assert!(matches!(
                          client.interrupt(target).unwrap(),
                          ClientResponseProjection::ControlState {
                              authority: ClientAuthority::Controller,
                              ..
                          }
                      ));
          '''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one repair target, found {count}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          '@ | python -
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Format and run exact Windows T166 endpoint test
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --bin winds persistent_runtime::client::t166_multiplexer_protocol_v2_tests::real_endpoint_tests::t166_real_private_endpoint_preserves_spec011_and_v2_then_allows_next_client -- --exact --test-threads=1 --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit repair only after exact test passes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD"
          git config user.name "Winds Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/t166_multiplexer_protocol_v2_tests.rs
          test -n "$(git diff --cached --name-only)"
          test "$(git diff --cached --name-only)" = "src/t166_multiplexer_protocol_v2_tests.rs"
          git commit -m "test(t166): preserve native Windows interrupt contract"
          git push origin HEAD:"$TARGET_BRANCH"
