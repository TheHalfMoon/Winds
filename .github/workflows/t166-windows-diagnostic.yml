name: t166-windows-diagnostic

on:
  push:
    branches:
      - probe/t166-windows-diagnostic
    paths:
      - .github/workflows/t166-windows-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout diagnostic candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Run exact failing Windows suite and persist log
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          New-Item -ItemType Directory -Force -Path ci-diagnostics | Out-Null
          cargo test --locked --all-targets --all-features -- --test-threads=1 2>&1 | Tee-Object -FilePath ci-diagnostics/t166-windows-full-suite.log
          $testExit = $LASTEXITCODE
          "TEST_EXIT_CODE=$testExit" | Add-Content ci-diagnostics/t166-windows-full-suite.log
          git config user.name "Winds Diagnostic"
          git config user.email "actions@users.noreply.github.com"
          git add ci-diagnostics/t166-windows-full-suite.log
          if (-not (git diff --cached --quiet)) {
            git commit -m "diagnostic: capture T166 Windows full-suite failure"
            git push origin HEAD:probe/t166-windows-diagnostic
          }
          exit $testExit
