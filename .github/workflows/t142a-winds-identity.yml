name: t142a-winds-identity

on:
  pull_request:
    paths:
      - "PRODUCT.md"
      - "DESIGN.md"
      - "desktop/src/**"
      - "desktop/index.html"
      - "desktop/tests/**"
      - "docs/provenance/010-t142a-winds-identity.md"
      - ".github/workflows/t142a-winds-identity.yml"
  push:
    branches: [main]
    paths:
      - "PRODUCT.md"
      - "DESIGN.md"
      - "desktop/src/**"
      - "desktop/index.html"
      - "desktop/tests/**"
      - "docs/provenance/010-t142a-winds-identity.md"
      - ".github/workflows/t142a-winds-identity.yml"

concurrency:
  group: t142a-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  renderer-identity:
    name: renderer identity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Verify checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Verify closed T142A historical scope and merge identity
        shell: python
        run: |
          import subprocess
          import sys

          canonical_base = "54880f256551659be5fb4b4456754c7c9f69d9d9"
          canonical_head = "521787cdad46ef89325b3d97b43be397e4673b01"
          canonical_merge = "8d75cab455f11afddeaa6fbe6244dbb1021d1467"
          first_parent = subprocess.check_output(["git", "rev-parse", f"{canonical_merge}^1"], text=True).strip()
          second_parent = subprocess.check_output(["git", "rev-parse", f"{canonical_merge}^2"], text=True).strip()
          merge_tree = subprocess.check_output(["git", "rev-parse", f"{canonical_merge}^{{tree}}"], text=True).strip()
          head_tree = subprocess.check_output(["git", "rev-parse", f"{canonical_head}^{{tree}}"], text=True).strip()
          if (first_parent, second_parent, merge_tree) != (canonical_base, canonical_head, head_tree):
              raise SystemExit("canonical T142A merge identity no longer matches its accepted base/head/tree")
          ancestry = subprocess.run(
              ["git", "merge-base", "--is-ancestor", canonical_merge, "HEAD"],
              check=False,
          )
          if ancestry.returncode != 0:
              raise SystemExit("current candidate does not descend from the canonical T142A merge")

          changed = subprocess.check_output(["git", "diff", "--name-only", canonical_base, canonical_head], text=True).splitlines()
          allowed_exact = {
              "PRODUCT.md",
              "DESIGN.md",
              ".github/workflows/t142a-winds-identity.yml",
              "docs/provenance/010-t142a-winds-identity.md",
          }
          allowed_prefixes = ("desktop/src/", "desktop/tests/")
          denied = [
              path for path in changed
              if path not in allowed_exact
              and path != "desktop/index.html"
              and not path.startswith(allowed_prefixes)
          ]
          print("Canonical T142A implementation paths:")
          print("\n".join(changed))
          if denied:
              print(f"canonical T142A history contains unauthorized paths: {denied}", file=sys.stderr)
              raise SystemExit(1)
          for forbidden in ("desktop/package.json", "desktop/package-lock.json", "desktop/src-tauri/Cargo.toml", "desktop/src-tauri/Cargo.lock"):
              if forbidden in changed:
                  raise SystemExit(f"canonical T142A history changed forbidden dependency/host path: {forbidden}")
      - name: Install exact Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install and verify exact npm
        shell: bash
        run: |
          npm install --global npm@10.9.8
          test "$(npm --version)" = "10.9.8"
      - name: Install renderer dependencies
        working-directory: desktop
        run: npm ci --ignore-scripts
      - name: Current Spectrum deterministic gates
        working-directory: desktop
        run: npm run format:check && npm run typecheck && npm run lint && npm test && npm run frontend:build
