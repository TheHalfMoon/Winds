name: t142a-winds-identity

on:
  pull_request:
    paths:
      - "PRODUCT.md"
      - "DESIGN.md"
      - "desktop/src/**"
      - "desktop/index.html"
      - "desktop/tests/**"
      - "docs/provenance/010-t142a-winds-identity.md"
      - ".github/workflows/t142a-winds-identity.yml"
  push:
    branches: [main]
    paths:
      - "PRODUCT.md"
      - "DESIGN.md"
      - "desktop/src/**"
      - "desktop/index.html"
      - "desktop/tests/**"
      - "docs/provenance/010-t142a-winds-identity.md"
      - ".github/workflows/t142a-winds-identity.yml"

concurrency:
  group: t142a-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  renderer-identity:
    name: renderer identity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Verify checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Enforce T142A file authority
        shell: python
        run: |
          import os
          import subprocess
          import sys

          base = os.environ["BASE_SHA"]
          head = os.environ["CANDIDATE_SHA"]
          if not base or set(base) == {"0"}:
              raise SystemExit("T142A scope gate requires a concrete comparison base")
          changed = subprocess.check_output(["git", "diff", "--name-only", base, head], text=True).splitlines()
          allowed_exact = {
              "PRODUCT.md",
              "DESIGN.md",
              ".github/workflows/t142a-winds-identity.yml",
              "docs/provenance/010-t142a-winds-identity.md",
          }
          allowed_prefixes = ("desktop/src/", "desktop/tests/")
          allowed = []
          denied = []
          for path in changed:
              if path in allowed_exact or path == "desktop/index.html" or path.startswith(allowed_prefixes):
                  allowed.append(path)
              else:
                  denied.append(path)
          print("T142A changed files:")
          print("\n".join(allowed + denied))
          if denied:
              print(f"unauthorized T142A paths: {denied}", file=sys.stderr)
              raise SystemExit(1)
          for forbidden in ("desktop/package.json", "desktop/package-lock.json", "desktop/src-tauri/Cargo.toml", "desktop/src-tauri/Cargo.lock"):
              if forbidden in changed:
                  raise SystemExit(f"forbidden dependency/host path changed: {forbidden}")
      - name: Install exact Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install and verify exact npm
        shell: bash
        run: |
          npm install --global npm@10.9.8
          test "$(npm --version)" = "10.9.8"
      - name: Install renderer dependencies
        working-directory: desktop
        run: npm ci --ignore-scripts
      - name: Current Spectrum deterministic gates
        working-directory: desktop
        run: npm run format:check && npm run typecheck && npm run lint && npm test && npm run frontend:build
