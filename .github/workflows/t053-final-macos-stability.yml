name: t053-final-macos-stability

on:
  push:
    branches: [ci/t053-obsolete-run-cleanup]
    paths:
      - ".github/workflows/t053-final-macos-stability.yml"

permissions:
  contents: read

jobs:
  stability:
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 79717dd226254086d529ac3401ec57c878cf422a
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Serial full suite control
        run: cargo test --locked --all-targets --all-features -- --test-threads=1
      - name: Repeat default-parallel full suite with bounded cycles
        shell: python
        run: |
          import subprocess
          import sys

          command = [
              "cargo", "test", "--locked", "--all-targets", "--all-features", "--", "--nocapture"
          ]
          for cycle in range(1, 6):
              print(f"=== default-parallel cycle {cycle}/5 ===", flush=True)
              try:
                  result = subprocess.run(command, timeout=45)
              except subprocess.TimeoutExpired:
                  print(f"cycle {cycle} exceeded 45 seconds", flush=True)
                  sys.exit(124)
              if result.returncode != 0:
                  sys.exit(result.returncode)
