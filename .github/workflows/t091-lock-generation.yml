name: t091-lock-generation

on:
  push:
    branches:
      - impl/007-t091-workbench-input
    paths:
      - Cargo.toml
      - .github/workflows/t091-lock-generation.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.sha }}

jobs:
  generate-lock-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Verify exact candidate and T091 predecessor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git show -s --format=%H aa57b7a7d6272ea19080f86a5bb8e545c1187b0c)" = "aa57b7a7d6272ea19080f86a5bb8e545c1187b0c"
          grep -Fqx 'ratatui-textarea = { version = "=0.9.2", default-features = false, features = ["crossterm"] }' Cargo.toml

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1

      - name: Generate T091 lock and dependency evidence
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          sha256sum Cargo.lock | tee /tmp/t091-cargo-lock.sha256
          cargo tree --locked -e features | tee /tmp/t091-cargo-tree-features.txt
          cargo metadata --locked --format-version 1 > /tmp/t091-metadata.json
          python3 - <<'PY' > /tmp/t091-metadata-summary.txt
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/t091-metadata.json').read_text())
          resolve = data['resolve']
          packages = {package['id']: package for package in data['packages']}
          nodes = {node['id']: node for node in resolve['nodes']}
          root = resolve['root']

          print('root=', root, sep='')
          for package_id in sorted(packages):
              package = packages[package_id]
              node = nodes.get(package_id, {})
              print(
                  'package=', package['name'],
                  ' version=', package['version'],
                  ' source=', package.get('source'),
                  ' license=', package.get('license'),
                  ' rust_version=', package.get('rust_version'),
                  ' features=', ','.join(sorted(node.get('features', []))),
                  sep='',
              )
          PY
          grep -F 'package=ratatui-textarea version=0.9.2 ' /tmp/t091-metadata-summary.txt
          if grep -Eiq '(^|[^[:alnum:]_-])(tokio|regex|tui-term|termion|termwiz)([^[:alnum:]_-]|$)' /tmp/t091-cargo-tree-features.txt; then
            echo 'unauthorized T091 dependency or feature detected' >&2
            exit 1
          fi
          if grep -Eiq 'ratatui-textarea[^\n]*(search|serde|arbitrary|portable-atomic)' /tmp/t091-cargo-tree-features.txt; then
            echo 'unauthorized ratatui-textarea feature detected' >&2
            exit 1
          fi

      - name: Upload T091 lock evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: t091-lock-evidence-${{ github.sha }}
          path: |
            Cargo.lock
            /tmp/t091-cargo-lock.sha256
            /tmp/t091-cargo-tree-features.txt
            /tmp/t091-metadata.json
            /tmp/t091-metadata-summary.txt
          if-no-files-found: error
