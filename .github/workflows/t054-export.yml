name: t054-export

on:
  push:
    branches: [ci/t053-obsolete-run-cleanup]
    paths:
      - ".github/workflows/t054-export.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout validation tools
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ci/t053-obsolete-run-cleanup
          path: tools
          persist-credentials: false
      - name: Checkout exact feature base
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/003-t054-command-records
          path: target
          persist-credentials: false
      - name: Verify exact source base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = "1a26fbf2f1d34690d615432e2dba7095a4b6955f"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Reproduce exact validated source tree
        shell: bash
        run: |
          set -euo pipefail
          python tools/.github/t054_patch.py target
          python tools/.github/t054_postpatch.py target
          cargo fmt --manifest-path target/Cargo.toml --all
          cargo fmt --manifest-path target/Cargo.toml --all -- --check
          cargo clippy --manifest-path target/Cargo.toml --locked --all-targets --all-features -- -D warnings
          cargo test --manifest-path target/Cargo.toml --locked --all-targets --all-features
      - name: Verify and package exact six-file source tree
        shell: bash
        run: |
          set -euo pipefail
          expected=$(cat <<'EOF'
          .github/workflows/windows-terminal.yml
          migrations/0004_shell_commands.sql
          src/command.rs
          src/domain.rs
          src/main.rs
          src/store.rs
          EOF
          )
          actual=$(git -C target status --short | awk '{print $2}' | sort)
          test "$actual" = "$(printf '%s\n' "$expected" | sort)"
          git -C target diff --check
          mkdir -p export
          tar -C target -cf export/t054-exact-source.tar \
            .github/workflows/windows-terminal.yml \
            migrations/0004_shell_commands.sql \
            src/command.rs \
            src/domain.rs \
            src/main.rs \
            src/store.rs
          sha256sum export/t054-exact-source.tar > export/t054-exact-source.tar.sha256
      - name: Upload exact source artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: t054-exact-source
          path: |
            export/t054-exact-source.tar
            export/t054-exact-source.tar.sha256
          if-no-files-found: error
          retention-days: 1
