name: t052-owned-error-cleanup2-temporary

on:
  push:
    branches: [feat/003-t052-wsl-launch]
    paths:
      - ".github/workflows/t052-owned-error-cleanup2-temporary.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Replace WSL helper with owned-error cleanup
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/wsl_launch.rs')
          text = path.read_text(encoding='utf-8')
          start_marker = '#[cfg(windows)]\nfn run_wsl_exec(\n'
          end_marker = '#[cfg(windows)]\nfn require_same_canonical_windows_path(\n'
          start = text.find(start_marker)
          end = text.find(end_marker, start + 1)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit(f'run_wsl_exec bounds invalid: start={start}, end={end}')

          replacement = r'''#[cfg(windows)]
          fn run_wsl_exec(
              launcher: &Path,
              distribution: &str,
              cwd: Option<&str>,
              command: &str,
              command_args: &[std::ffi::OsString],
          ) -> Result<Vec<u8>> {
              use super::wsl::decode_wsl_text;
              use std::ffi::c_void;
              use std::io::{Read, Result as IoResult};
              use std::os::windows::io::AsRawHandle;
              use std::process::{Child, ChildStderr, ChildStdout, Command, Stdio};
              use std::ptr;
              use std::thread;
              use std::time::{Duration, Instant};

              const CAP: usize = 256 * 1024;
              const TIMEOUT: Duration = Duration::from_secs(30);
              const ERROR_BROKEN_PIPE: i32 = 109;
              const ERROR_NO_DATA: i32 = 232;
              const ERROR_PIPE_NOT_CONNECTED: i32 = 233;

              #[link(name = "kernel32")]
              unsafe extern "system" {
                  #[link_name = "PeekNamedPipe"]
                  fn peek_named_pipe(
                      named_pipe: *mut c_void,
                      buffer: *mut c_void,
                      buffer_size: u32,
                      bytes_read: *mut u32,
                      total_bytes_available: *mut u32,
                      bytes_left_this_message: *mut u32,
                  ) -> i32;
              }

              fn read_available<R: Read + AsRawHandle>(
                  reader: &mut R,
                  captured: &mut Vec<u8>,
                  truncated: &mut bool,
              ) -> IoResult<bool> {
                  let mut available = 0_u32;
                  // SAFETY: `reader` owns a valid pipe handle for this call. No output buffer is
                  // supplied; PeekNamedPipe only reports the number of bytes immediately readable.
                  let peeked = unsafe {
                      peek_named_pipe(
                          reader.as_raw_handle(),
                          ptr::null_mut(),
                          0,
                          ptr::null_mut(),
                          &mut available,
                          ptr::null_mut(),
                      )
                  };
                  if peeked == 0 {
                      let error = std::io::Error::last_os_error();
                      if matches!(
                          error.raw_os_error(),
                          Some(ERROR_BROKEN_PIPE | ERROR_NO_DATA | ERROR_PIPE_NOT_CONNECTED)
                      ) {
                          return Ok(false);
                      }
                      return Err(error);
                  }
                  if available == 0 {
                      return Ok(false);
                  }

                  let mut buffer = [0_u8; 8192];
                  let read_len = buffer.len().min(available as usize);
                  let count = reader.read(&mut buffer[..read_len])?;
                  if count == 0 {
                      return Ok(false);
                  }
                  let remaining = CAP.saturating_sub(captured.len());
                  let keep = remaining.min(count);
                  captured.extend_from_slice(&buffer[..keep]);
                  if keep < count {
                      *truncated = true;
                  }
                  Ok(true)
              }

              fn drain_pair(
                  stdout: &mut ChildStdout,
                  stderr: &mut ChildStderr,
                  stdout_bytes: &mut Vec<u8>,
                  stderr_bytes: &mut Vec<u8>,
                  stdout_truncated: &mut bool,
                  stderr_truncated: &mut bool,
              ) -> IoResult<bool> {
                  let stdout_progress =
                      read_available(stdout, stdout_bytes, stdout_truncated)?;
                  let stderr_progress =
                      read_available(stderr, stderr_bytes, stderr_truncated)?;
                  Ok(stdout_progress || stderr_progress)
              }

              fn diagnostic_text(bytes: &[u8]) -> String {
                  let decoded = decode_wsl_text(bytes)
                      .unwrap_or_else(|_| String::from_utf8_lossy(bytes).into_owned());
                  let trimmed = decoded.trim();
                  let mut chars = trimmed.chars();
                  let mut diagnostic: String = chars.by_ref().take(2048).collect();
                  if chars.next().is_some() {
                      diagnostic.push_str("...");
                  }
                  diagnostic
              }

              fn truncation_suffix(stdout_truncated: bool, stderr_truncated: bool) -> &'static str {
                  match (stdout_truncated, stderr_truncated) {
                      (true, true) => " [stdout truncated] [stderr truncated]",
                      (true, false) => " [stdout truncated]",
                      (false, true) => " [stderr truncated]",
                      (false, false) => "",
                  }
              }

              fn cleanup_owned_launcher(child: &mut Child) -> String {
                  match child.try_wait() {
                      Ok(Some(_)) => "Windows WSL launcher had already exited".to_owned(),
                      Ok(None) | Err(_) => match child.kill() {
                          Ok(()) => match child.wait() {
                              Ok(_) => "Windows WSL launcher process terminated".to_owned(),
                              Err(error) => format!(
                                  "Windows WSL launcher termination wait could not be proven: {error}"
                              ),
                          },
                          Err(kill_error) => match child.try_wait() {
                              Ok(Some(_)) => "Windows WSL launcher had already exited".to_owned(),
                              Ok(None) => format!(
                                  "Windows WSL launcher termination could not be proven: {kill_error}"
                              ),
                              Err(wait_error) => format!(
                                  "Windows WSL launcher termination could not be proven: {kill_error}; status check failed: {wait_error}"
                              ),
                          },
                      },
                  }
              }

              fn fail_owned_launcher(
                  child: &mut Child,
                  reason: impl std::fmt::Display,
              ) -> Result<Vec<u8>> {
                  let cleanup = cleanup_owned_launcher(child);
                  Err(format!("{reason}; {cleanup}").into())
              }

              let mut process = Command::new(launcher);
              for key in GIT_CONTEXT_ENV_VARS {
                  process.env_remove(key);
              }
              process.arg("--distribution").arg(distribution);
              if let Some(cwd) = cwd {
                  process.arg("--cd").arg(cwd);
              }
              process.arg("--exec").arg(command).args(command_args);
              let mut child = process
                  .stdin(Stdio::null())
                  .stdout(Stdio::piped())
                  .stderr(Stdio::piped())
                  .spawn()
                  .map_err(|error| format!("failed to execute selected WSL distribution: {error}"))?;

              let mut stdout = match child.stdout.take() {
                  Some(stdout) => stdout,
                  None => {
                      return fail_owned_launcher(&mut child, "failed to capture WSL command stdout");
                  }
              };
              let mut stderr = match child.stderr.take() {
                  Some(stderr) => stderr,
                  None => {
                      return fail_owned_launcher(&mut child, "failed to capture WSL command stderr");
                  }
              };
              let mut stdout_bytes = Vec::new();
              let mut stderr_bytes = Vec::new();
              let mut stdout_truncated = false;
              let mut stderr_truncated = false;

              let started = Instant::now();
              let status = loop {
                  let progressed = match drain_pair(
                      &mut stdout,
                      &mut stderr,
                      &mut stdout_bytes,
                      &mut stderr_bytes,
                      &mut stdout_truncated,
                      &mut stderr_truncated,
                  ) {
                      Ok(progressed) => progressed,
                      Err(error) => {
                          return fail_owned_launcher(
                              &mut child,
                              format!("failed reading selected WSL command output: {error}"),
                          );
                      }
                  };
                  let observed_exit = match child.try_wait() {
                      Ok(observed_exit) => observed_exit,
                      Err(error) => {
                          return fail_owned_launcher(
                              &mut child,
                              format!("failed observing selected WSL command exit: {error}"),
                          );
                      }
                  };
                  if let Some(status) = observed_exit {
                      while drain_pair(
                          &mut stdout,
                          &mut stderr,
                          &mut stdout_bytes,
                          &mut stderr_bytes,
                          &mut stdout_truncated,
                          &mut stderr_truncated,
                      )
                      .map_err(|error| format!(
                          "failed draining selected WSL command output after observed exit: {error}"
                      ))? {}
                      break status;
                  }
                  if started.elapsed() >= TIMEOUT {
                      return fail_owned_launcher(
                          &mut child,
                          "selected WSL command exceeded the 30 second safety timeout",
                      );
                  }
                  if !progressed {
                      thread::sleep(Duration::from_millis(10));
                  }
              };

              let stderr_diagnostic = diagnostic_text(&stderr_bytes);
              let suffix = truncation_suffix(stdout_truncated, stderr_truncated);
              if !status.success() {
                  return Err(format!(
                      "selected WSL command failed with status {status}: {stderr_diagnostic}{suffix}"
                  )
                  .into());
              }
              if stdout_truncated || stderr_truncated {
                  let diagnostic = if stderr_diagnostic.is_empty() {
                      suffix.to_owned()
                  } else {
                      format!("{suffix}; stderr: {stderr_diagnostic}")
                  };
                  return Err(format!(
                      "selected WSL command exceeded the 256 KiB per-stream safety bound{diagnostic}"
                  )
                  .into());
              }
              Ok(stdout_bytes)
          }

          '''

          updated = text[:start] + replacement + text[end:]
          if updated == text:
              raise SystemExit('run_wsl_exec replacement produced no change')
          path.write_text(updated, encoding='utf-8')

      - name: Validate on official Windows runner
        shell: pwsh
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --locked --all-targets --all-features
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --bin winds terminal::windows_tests -- --test-threads=1
          cargo test --locked --bin winds wsl_launch::tests -- --test-threads=1
          git diff --check
          $changed = @(git diff --name-only)
          if ($changed.Count -ne 1 -or $changed[0] -ne "src/wsl_launch.rs") {
            throw "unexpected changed paths: $($changed -join ', ')"
          }
      - name: Commit cleanup repair
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/wsl_launch.rs
          git diff --cached --check
          git commit -m "fix(winds): clean up WSL helper on owned errors"
          git push origin "HEAD:$env:GITHUB_REF_NAME"
