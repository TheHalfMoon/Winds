name: t143-performance

on:
  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      - "src/workbench/**"
      - "src/workbench.rs"
      - "src/t097_workbench_performance_tests.rs"
      - "docs/provenance/010-t143-performance.md"
      - ".github/workflows/t143-performance.yml"
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "src/workbench/**"
      - "src/workbench.rs"
      - "src/t097_workbench_performance_tests.rs"
      - "docs/provenance/010-t143-performance.md"
      - ".github/workflows/t143-performance.yml"

concurrency:
  group: t143-performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  qualify:
    name: ubuntu-24.04-webkitgtk-tauri
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Verify checkout and reference environment identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -n "$(git rev-parse 'HEAD^{tree}')"
          test "${RUNNER_OS:-}" = "Linux"
          test "${RUNNER_ARCH:-}" = "X64"
          test "${ImageOS:-}" = "ubuntu24"
          printf 'runner_os=%s\nrunner_arch=%s\nimage_os=%s\nimage_version=%s\n' \
            "$RUNNER_OS" "$RUNNER_ARCH" "$ImageOS" "${ImageVersion:-UNAVAILABLE}"

      - name: Install Linux Tauri and WebKitGTK qualification prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev \
            libwebkit2gtk-4.1-dev webkit2gtk-driver epiphany-browser xvfb dbus-x11 xdotool
          command -v WebKitWebDriver
          command -v epiphany
          command -v Xvfb
          command -v xdotool
          pkg-config --modversion webkit2gtk-4.1
          dpkg-query -W -f='${Package}=${Version}\n' libwebkit2gtk-4.1-0 webkit2gtk-driver epiphany-browser

      - name: Install exact Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install and verify exact npm
        shell: bash
        run: |
          npm install --global npm@10.9.8
          test "$(npm --version)" = "10.9.8"

      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1

      - name: Install renderer dependencies
        working-directory: desktop
        shell: bash
        run: npm ci --ignore-scripts

      - name: Prove production dependency and privileged-command boundaries remain unchanged
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BASE_SHA"
          git diff --exit-code "$BASE_SHA" "$CANDIDATE_SHA" -- \
            Cargo.toml Cargo.lock desktop/package.json desktop/package-lock.json \
            desktop/src-tauri/Cargo.toml desktop/src-tauri/Cargo.lock
          test "$(grep -c '#\[tauri::command\]' desktop/src-tauri/src/main.rs)" -eq 22

      - name: Production deterministic gates
        working-directory: desktop
        shell: bash
        run: npm run format:check && npm run typecheck && npm run lint && npm test && npm run frontend:build

      - name: Production Rust host gates
        shell: bash
        run: |
          cargo fmt --manifest-path desktop/src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --locked -- -D warnings

      - name: Build native qualification host and separate benchmark renderer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p t143-evidence
          (cd desktop && VITE_WINDS_T143_NATIVE_READY=1 npm run frontend:build)
          TAURI_CONFIG='{"app":{"security":{"capabilities":[{"identifier":"t143-native-ready","windows":["main"],"permissions":["core:window:allow-set-title"]}]}}}' \
            cargo build --release --locked --manifest-path desktop/src-tauri/Cargo.toml
          test -x desktop/src-tauri/target/release/winds-desktop-host
          rm -rf t143-evidence/native-renderer-dist
          cp -a desktop/dist t143-evidence/native-renderer-dist
          (cd desktop && VITE_WINDS_T143_BENCHMARK=1 npm run frontend:build)
          rm -rf t143-evidence/benchmark-renderer-dist
          cp -a desktop/dist t143-evidence/benchmark-renderer-dist

      - name: Run native Tauri and WebKitGTK renderer campaigns
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p t143-evidence
          dbus-run-session -- desktop/tests/performance/t143_run_linux.sh \
            desktop/src-tauri/target/release/winds-desktop-host \
            t143-evidence

      - name: Run inherited huge-output and resize stress on exact candidate
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release --locked --bin winds \
            workbench::t097_workbench_performance_tests::t097_release_benchmark_campaign \
            -- --ignored --exact --nocapture --test-threads=1 | tee t143-evidence/backend.log
          grep -q 'T097_CORE_JSON=' t143-evidence/backend.log

      - name: Assemble exact-candidate T143 evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 desktop/tests/performance/t143_assemble.py \
            --native t143-evidence/native.json \
            --renderer t143-evidence/renderer.json \
            --backend-log t143-evidence/backend.log \
            --binary desktop/src-tauri/target/release/winds-desktop-host \
            --native-dist t143-evidence/native-renderer-dist \
            --benchmark-dist t143-evidence/benchmark-renderer-dist \
            --output t143-evidence/combined.json
          python3 - <<'PY'
          import json, os
          e=json.load(open('t143-evidence/combined.json'))
          assert e['candidate_commit'] == os.environ['CANDIDATE_SHA']
          assert e['all_checks_pass'] is True
          assert e['campaigns']['cold_launch_samples'] >= 20
          assert e['campaigns']['selection_samples'] >= 1000
          assert e['campaigns']['composer_samples'] >= 1000
          assert e['campaigns']['large_fixture_projects'] >= 100
          assert e['campaigns']['large_fixture_sessions'] >= 1000
          PY

      - name: Upload raw and combined exact-candidate performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: t143-performance-${{ env.CANDIDATE_SHA }}
          path: t143-evidence/
          if-no-files-found: warn
          retention-days: 30
