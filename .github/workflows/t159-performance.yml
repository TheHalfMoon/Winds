name: t159-performance

on:
  pull_request:
    branches: [main]
    paths:
      - "src/persistent_runtime/**"
      - "src/t159_persistent_runtime_performance_tests.rs"
      - "docs/provenance/011-t159-performance.md"
      - ".github/workflows/t159-performance.yml"
  push:
    branches: [main]
    paths:
      - "src/persistent_runtime/**"
      - "src/t159_persistent_runtime_performance_tests.rs"
      - "docs/provenance/011-t159-performance.md"
      - ".github/workflows/t159-performance.yml"

concurrency:
  group: t159-performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  qualify:
    name: ubuntu-24.04-persistent-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Verify exact candidate and reference environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -n "$(git rev-parse 'HEAD^{tree}')"
          test "${RUNNER_OS:-}" = "Linux"
          test "${RUNNER_ARCH:-}" = "X64"
          test "${ImageOS:-}" = "ubuntu24"
          printf 'candidate=%s\ntree=%s\nrunner_os=%s\nrunner_arch=%s\nimage_os=%s\nimage_version=%s\n' \
            "$CANDIDATE_SHA" "$(git rev-parse 'HEAD^{tree}')" \
            "$RUNNER_OS" "$RUNNER_ARCH" "$ImageOS" "${ImageVersion:-UNAVAILABLE}"

      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Preserve correctness and security gates
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked --bin winds --tests -- -D warnings
          cargo test --locked --bin winds persistent_runtime:: -- --test-threads=1

      - name: Run exact-candidate T159 core campaign
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p t159-evidence
          cargo test --release --locked --bin winds \
            persistent_runtime::t159_persistent_runtime_performance_tests::t159_release_resource_and_latency_campaign \
            -- --ignored --exact --nocapture --test-threads=1 | tee t159-evidence/core.log
          grep -q 'T159_CORE_JSON=' t159-evidence/core.log

      - name: Build exact release owner binary
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --bin winds
          test -x target/release/winds
          sha256sum target/release/winds | tee t159-evidence/winds.sha256

      - name: Measure independent idle owner CPU RSS FD and storage
        shell: bash
        env:
          T159_OWNER_BINARY: target/release/winds
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import math
          import os
          import pathlib
          import shutil
          import subprocess
          import time

          evidence = pathlib.Path("t159-evidence")
          root = (evidence / "idle-owner").resolve()
          shutil.rmtree(root, ignore_errors=True)
          home = root / "home"
          xdg = root / "xdg"
          home.mkdir(parents=True)
          xdg.mkdir(parents=True)
          xdg.chmod(0o700)

          env = os.environ.copy()
          env["XDG_RUNTIME_DIR"] = str(xdg)
          binary = pathlib.Path(os.environ["T159_OWNER_BINARY"]).resolve()
          proc = subprocess.Popen(
              [str(binary), "__winds-internal-owner-v1", "--home", str(home)],
              env=env,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
          )

          def ensure_alive():
              code = proc.poll()
              if code is not None:
                  output = (proc.stdout.read() if proc.stdout else b"")[-4000:]
                  raise SystemExit(f"idle owner exited early with {code}: {output!r}")

          def ticks():
              raw = pathlib.Path(f"/proc/{proc.pid}/stat").read_text()
              end = raw.rfind(")")
              fields = raw[end + 1:].split()
              return int(fields[11]) + int(fields[12])

          page_size = os.sysconf("SC_PAGE_SIZE")
          clock_ticks = os.sysconf("SC_CLK_TCK")

          def rss_bytes():
              fields = pathlib.Path(f"/proc/{proc.pid}/statm").read_text().split()
              return int(fields[1]) * page_size

          def fd_count():
              return len(list(pathlib.Path(f"/proc/{proc.pid}/fd").iterdir()))

          def storage_bytes():
              total = 0
              for path in home.rglob("*"):
                  if path.is_file() and not path.is_symlink():
                      total += path.stat().st_size
              return total

          def percentile(values, p):
              ordered = sorted(values)
              rank = max(1, math.ceil(len(ordered) * p / 100.0))
              return ordered[min(rank - 1, len(ordered) - 1)]

          try:
              deadline = time.monotonic() + 10.0
              while time.monotonic() < deadline:
                  ensure_alive()
                  runtime_dirs = list(xdg.glob("winds-runtime-*"))
                  if runtime_dirs and any(path.is_socket() for path in runtime_dirs[0].iterdir()):
                      break
                  time.sleep(0.05)
              else:
                  raise SystemExit("idle owner endpoint did not become ready")

              time.sleep(2.0)
              ensure_alive()
              baseline_storage = storage_bytes()
              start_fd = fd_count()
              previous_ticks = ticks()
              previous_time = time.monotonic()
              samples = []
              end_time = previous_time + 60.0
              while time.monotonic() < end_time:
                  time.sleep(0.25)
                  ensure_alive()
                  now = time.monotonic()
                  current_ticks = ticks()
                  elapsed = now - previous_time
                  cpu = ((current_ticks - previous_ticks) / clock_ticks) / elapsed * 100.0
                  sample = {
                      "elapsed_ms": int((now - (end_time - 60.0)) * 1000),
                      "cpu_percent_one_logical_core": cpu,
                      "rss_bytes": rss_bytes(),
                      "fd_count": fd_count(),
                      "home_storage_bytes": storage_bytes(),
                  }
                  samples.append(sample)
                  previous_ticks = current_ticks
                  previous_time = now

              cpu_values = [sample["cpu_percent_one_logical_core"] for sample in samples]
              rss_values = [sample["rss_bytes"] for sample in samples]
              fd_values = [sample["fd_count"] for sample in samples]
              storage_values = [sample["home_storage_bytes"] for sample in samples]
              result = {
                  "schema": "WINDS_SPEC_011_T159_IDLE_OWNER_V1",
                  "duration_seconds": 60,
                  "sample_interval_ms": 250,
                  "sample_count": len(samples),
                  "raw_samples": samples,
                  "cpu_p95_percent_one_logical_core": percentile(cpu_values, 95),
                  "cpu_max_percent_one_logical_core": max(cpu_values),
                  "rss_max_bytes": max(rss_values),
                  "rss_last_bytes": rss_values[-1],
                  "fd_start": start_fd,
                  "fd_max": max(fd_values),
                  "fd_end": fd_values[-1],
                  "storage_baseline_bytes": baseline_storage,
                  "storage_max_bytes": max(storage_values),
                  "storage_end_bytes": storage_values[-1],
                  "zero_live_runtimes": True,
                  "zero_connected_clients": True,
                  "thresholds_relaxed": False,
              }
              if result["cpu_p95_percent_one_logical_core"] > 1.0:
                  raise SystemExit(
                      f"idle owner CPU p95 exceeded 1%: {result['cpu_p95_percent_one_logical_core']:.4f}%"
                  )
              if result["rss_max_bytes"] > 64 * 1024 * 1024:
                  raise SystemExit(
                      f"idle owner RSS exceeded 64 MiB: {result['rss_max_bytes']} bytes"
                  )
              if result["fd_end"] > result["fd_start"] or result["fd_max"] > result["fd_start"] + 1:
                  raise SystemExit(
                      f"idle owner FD growth detected: start={result['fd_start']} "
                      f"max={result['fd_max']} end={result['fd_end']}"
                  )
              if result["storage_end_bytes"] > baseline_storage + 4096:
                  raise SystemExit(
                      f"idle owner storage grew unexpectedly: baseline={baseline_storage} "
                      f"end={result['storage_end_bytes']}"
                  )
              path = evidence / "idle-owner.json"
              path.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
              print("T159_IDLE_JSON=" + json.dumps(result, sort_keys=True))
          finally:
              if proc.poll() is None:
                  proc.terminate()
                  try:
                      proc.wait(timeout=5)
                  except subprocess.TimeoutExpired:
                      proc.kill()
                      proc.wait(timeout=5)
          PY

      - name: Assemble exact-candidate T159 evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import platform
          import subprocess
          from pathlib import Path

          def marker(path, prefix):
              for line in Path(path).read_text().splitlines():
                  offset = line.find(prefix)
                  if offset >= 0:
                      return json.loads(line[offset + len(prefix):])
              raise SystemExit(f"missing marker {prefix} in {path}")

          core = marker("t159-evidence/core.log", "T159_CORE_JSON=")
          idle = json.loads(Path("t159-evidence/idle-owner.json").read_text())
          candidate = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          tree = subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip()
          if candidate != os.environ["CANDIDATE_SHA"]:
              raise SystemExit("candidate moved before T159 evidence assembly")

          cpu = next(
              (
                  line.split(":", 1)[1].strip()
                  for line in Path("/proc/cpuinfo").read_text().splitlines()
                  if line.lower().startswith("model name")
              ),
              "UNAVAILABLE",
          )
          memory = next(
              (
                  line.split(":", 1)[1].strip()
                  for line in Path("/proc/meminfo").read_text().splitlines()
                  if line.startswith("MemTotal:")
              ),
              "UNAVAILABLE",
          )
          rust_version = subprocess.check_output(
              ["rustc", "--version", "--verbose"], text=True
          ).strip()
          binary_sha = Path("t159-evidence/winds.sha256").read_text().split()[0]

          assert core["reconnect_cycles"] >= 500
          assert core["concurrent_observers"] >= 8
          assert core["idle_runtime_namespaces"] >= 32
          assert core["output_observed_bytes"] >= 10 * 1024 * 1024
          assert core["output_observed_lines"] >= 100_000
          assert core["reattach_snapshot"]["p95_us"] <= 100_000
          assert core["cached_observer_attach"]["p95_us"] <= 100_000
          assert core["controller_input_dispatch"]["p95_us"] <= 10_000
          assert core["resize_dispatch"]["p95_us"] <= 25_000
          assert idle["cpu_p95_percent_one_logical_core"] <= 1.0
          assert idle["rss_max_bytes"] <= 64 * 1024 * 1024
          assert core["thresholds_relaxed"] is False
          assert core["correctness_or_security_checks_disabled"] is False
          assert idle["thresholds_relaxed"] is False

          combined = {
              "schema": "WINDS_SPEC_011_T159_PERFORMANCE_EVIDENCE_V1",
              "candidate_commit": candidate,
              "candidate_tree": tree,
              "binary_sha256": binary_sha,
              "os": "linux",
              "os_version_or_image": {
                  "runner_label": "ubuntu-24.04",
                  "image_os": os.environ["ImageOS"],
                  "image_version": os.environ["ImageVersion"],
                  "distribution": platform.platform(),
              },
              "arch": platform.machine(),
              "rust_version": rust_version,
              "build_profile": "release",
              "cpu_description_or_runner_class": cpu,
              "logical_cpu_count": os.cpu_count(),
              "memory": memory,
              "fixture_shell": "/bin/sh",
              "core_campaign": core,
              "idle_owner_campaign": idle,
              "correctness_security_gates_preserved": True,
              "thresholds_relaxed": False,
              "all_checks_pass": True,
          }
          Path("t159-evidence/combined.json").write_text(
              json.dumps(combined, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(combined, indent=2, sort_keys=True))
          PY

      - name: Upload raw and combined exact-candidate T159 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: t159-performance-${{ env.CANDIDATE_SHA }}
          path: t159-evidence/
          if-no-files-found: warn
          retention-days: 30
