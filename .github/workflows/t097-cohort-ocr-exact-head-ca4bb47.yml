name: T097 Cohort Alibaba OCR Exact Head ca4bb47

on:
  push:
    branches:
      - review/t097-cohort-ocr-ca4bb47

permissions:
  contents: read

env:
  BASE_SHA: 409329ec7cba46ac39f31405c9fd8b9daec5b0c9
  HEAD_SHA: ca4bb475534032aee4679aa193ee0882d5864cc6
  OCR_VERSION: 1.12.9

jobs:
  ocr-review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact maintenance candidate
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$BASE_SHA^{commit}"
          git fetch --no-tags origin refs/heads/maintenance/t097-runner-cohort-20260927
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"
          test "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" = "$BASE_SHA"
          test "$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")" = ".github/workflows/t097-performance.yml"
          git diff --check "$BASE_SHA" "$HEAD_SHA"
          test "$(git rev-parse HEAD)" != "$HEAD_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Install exact Alibaba Open Code Review
        run: |
          npm install -g "@alibaba-group/open-code-review@$OCR_VERSION"
          ocr version | tee ocr-version.txt
          grep -F "$OCR_VERSION" ocr-version.txt
      - name: Review exact maintenance range
        run: ocr delegate preview --format json --from "$BASE_SHA" --to "$HEAD_SHA" | tee ocr-preview.json
      - name: Resolve rule for changed workflow
        run: ocr delegate rule --format json .github/workflows/t097-performance.yml | tee ocr-rules.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: t097-cohort-alibaba-ocr-ca4bb47
          path: |
            ocr-version.txt
            ocr-preview.json
            ocr-rules.json
          if-no-files-found: warn
          retention-days: 14
