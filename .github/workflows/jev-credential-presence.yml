name: jev-credential-presence

on:
  push:
    branches:
      - probe/jev-credential-presence

permissions:
  contents: read

jobs:
  presence-only:
    runs-on: ubuntu-24.04
    env:
      HAS_TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY != '' }}
      HAS_JEV_API_KEY: ${{ secrets.JEV_API_KEY != '' }}
    steps:
      - name: Report credential presence only
        shell: bash
        run: |
          set -euo pipefail
          echo "HAS_TYPESAFE_API_KEY=$HAS_TYPESAFE_API_KEY"
          echo "HAS_JEV_API_KEY=$HAS_JEV_API_KEY"
          if [ "$HAS_TYPESAFE_API_KEY" != "true" ] && [ "$HAS_JEV_API_KEY" != "true" ]; then
            echo "No Jev credential is configured in repository Actions secrets."
          fi
