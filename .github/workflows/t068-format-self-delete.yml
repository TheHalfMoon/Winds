name: t068-format-self-delete

on:
  push:
    branches:
      - fix/003-t068-independent-review-findings

permissions:
  contents: write

jobs:
  format-and-remove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout formatting candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Format only the T068 history repair and self-delete
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          mapfile -t changed < <(git diff --name-only)
          if [ "${#changed[@]}" -ne 1 ] || [ "${changed[0]}" != "src/command/history.rs" ]; then
            printf 'Unexpected formatter diff:\n' >&2
            printf '  %s\n' "${changed[@]}" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/command/history.rs
          git rm .github/workflows/t068-format-self-delete.yml
          git commit -m 'style(003): format history pruning repair'
          git push origin HEAD:fix/003-t068-independent-review-findings
