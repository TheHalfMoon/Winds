name: t053-validated-source-commit-temporary

on:
  push:
    branches: [feat/003-t053-terminal-ledger]
    paths:
      - ".github/workflows/t053-validated-source-commit-temporary.yml"

permissions:
  contents: write

jobs:
  commit-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Reapply exact macOS-validated source repair
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/t053-macos-repair3-temporary.yml').read_text(encoding='utf-8')
          step = '      - name: Apply typed bounded cleanup using function boundaries\n        shell: python\n        run: |\n'
          next_step = '      - name: Validate typed bounded cleanup on macOS\n'
          start = workflow.find(step)
          end = workflow.find(next_step, start + len(step))
          if start < 0 or end < 0:
              raise SystemExit(f'validated source repair bounds invalid: start={start}, end={end}')
          block = workflow[start + len(step):end]
          script_lines = []
          for line in block.splitlines():
              if line.startswith('          '):
                  script_lines.append(line[10:])
              elif line.strip():
                  raise SystemExit(f'unexpected source repair indentation: {line!r}')
              else:
                  script_lines.append('')
          Path('/tmp/t053-validated-source-repair.py').write_text(
              '\n'.join(script_lines) + '\n',
              encoding='utf-8',
          )
          subprocess.run(['python', '/tmp/t053-validated-source-repair.py'], check=True)
      - name: Revalidate source on Ubuntu
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --locked --all-targets --all-features
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --bin winds terminal::tests::dropping_live_terminal_session_is_bounded -- --exact --test-threads=1
          cargo test --locked --bin winds execution::tests -- --test-threads=1
          cargo test --locked --all-targets --all-features
          git diff --check -- src/terminal.rs src/execution.rs
      - name: Commit source only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/terminal.rs src/execution.rs
          git diff --cached --check
          git commit -m "fix(winds): bound terminal destructor cleanup"
          git push origin "HEAD:$GITHUB_REF_NAME"
