name: t054-review-repair-committer

on:
  push:
    branches: [ci/t053-obsolete-run-cleanup]
    paths:
      - ".github/workflows/t054-review-repair-committer.yml"

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/003-t054-command-records
          fetch-depth: 2
      - name: Verify exact reviewed head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "7c03b769d8b1e9ddd906f9afe976e58a352239e6"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Apply exact validated review repair
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/t054-review-repair.patch.gz.b64 <<'EOF'
          
          EOF
          tr -d '[:space:]' < /tmp/t054-review-repair.patch.gz.b64 | base64 --decode | gzip -d > /tmp/t054-review-repair.patch
          test "$(sha256sum /tmp/t054-review-repair.patch | awk '{print $1}')" = "b213db69e07a6647a790627099ae647c8a0c7f6b3da7c3a0cee76cbd652899d6"
          git apply --check /tmp/t054-review-repair.patch
          git apply /tmp/t054-review-repair.patch
      - name: Validate repaired source
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --locked --all-targets --all-features
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features
          expected=$(cat <<'EOF'
          migrations/0004_shell_commands.sql
          src/command.rs
          src/domain.rs
          src/store.rs
          EOF
          )
          actual=$(git status --short | awk '{print $2}' | sort)
          test "$actual" = "$(printf '%s\n' "$expected" | sort)"
          git diff --check
      - name: Commit and push if feature head is unchanged
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/003-t054-command-records
          test "$(git rev-parse FETCH_HEAD)" = "7c03b769d8b1e9ddd906f9afe976e58a352239e6"
          git config user.name "winds-ci"
          git config user.email "winds-ci@users.noreply.github.com"
          git add migrations/0004_shell_commands.sql src/command.rs src/domain.rs src/store.rs
          git commit -m "fix(winds): make command completion durable"
          git push origin HEAD:feat/003-t054-command-records
