name: t051-portability-patch-temporary

on:
  push:
    branches: [feat/003-t051-windows-conpty]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - name: Apply narrow T051 portability fixes
        shell: python
        run: |
          from pathlib import Path

          git = Path('src/git.rs')
          text = git.read_text(encoding='utf-8')
          text = text.replace(
              'use std::os::unix::ffi::OsStringExt;\n',
              '#[cfg(unix)]\nuse std::os::unix::ffi::OsStringExt;\n',
              1,
          )
          old = '''            if let Some(path) = field.strip_prefix(b"worktree ") {\n                paths.push(PathBuf::from(OsString::from_vec(path.to_vec())));\n            }'''
          new = '''            if let Some(path) = field.strip_prefix(b"worktree ") {\n                paths.push(git_path_from_bytes(path)?);\n            }'''
          if text.count(old) != 1:
              raise SystemExit(f'git worktree path block count={text.count(old)}')
          text = text.replace(old, new)
          insert = '''\n#[cfg(unix)]\nfn git_path_from_bytes(path: &[u8]) -> Result<PathBuf> {\n    Ok(PathBuf::from(OsString::from_vec(path.to_vec())))\n}\n\n#[cfg(windows)]\nfn git_path_from_bytes(path: &[u8]) -> Result<PathBuf> {\n    let path = std::str::from_utf8(path)\n        .map_err(|error| format!("Git returned a non-UTF-8 Windows worktree path: {error}"))?;\n    Ok(PathBuf::from(path))\n}\n'''
          marker = '\nfn git_command(cwd: &Path) -> Command {'
          if text.count(marker) != 1:
              raise SystemExit('git command marker not unique')
          text = text.replace(marker, insert + marker, 1)
          git.write_text(text, encoding='utf-8')

          workspace = Path('src/workspace.rs')
          text = workspace.read_text(encoding='utf-8')
          old = '''        let symlinked_repo = root.join("repo-link");\n        std::os::unix::fs::symlink(&repo, &symlinked_repo).unwrap();\n        let via_symlink = open_existing_workspace(&symlinked_repo, &canonical_home, 150).unwrap();\n        assert_eq!(via_symlink.workspace_id, first.workspace_id);\n        assert_eq!(\n            via_symlink.canonical_worktree_root,\n            first.canonical_worktree_root\n        );\n        assert_eq!(via_symlink.git_common_dir, first.git_common_dir);\n        assert_eq!(via_symlink.head_oid, first.head_oid);'''
          new = '''        #[cfg(unix)]\n        {\n            let symlinked_repo = root.join("repo-link");\n            std::os::unix::fs::symlink(&repo, &symlinked_repo).unwrap();\n            let via_symlink =\n                open_existing_workspace(&symlinked_repo, &canonical_home, 150).unwrap();\n            assert_eq!(via_symlink.workspace_id, first.workspace_id);\n            assert_eq!(\n                via_symlink.canonical_worktree_root,\n                first.canonical_worktree_root\n            );\n            assert_eq!(via_symlink.git_common_dir, first.git_common_dir);\n            assert_eq!(via_symlink.head_oid, first.head_oid);\n        }'''
          if text.count(old) != 1:
              raise SystemExit(f'workspace symlink block count={text.count(old)}')
          workspace.write_text(text.replace(old, new), encoding='utf-8')

          shell = Path('src/shell_profiles.rs')
          text = shell.read_text(encoding='utf-8')
          old = '''    use super::{\n        ShellCwdStrategy, ShellExecutionDomain, discover_native_shell_profiles,\n        validate_shell_profile_for_launch,\n    };'''
          new = '''    use super::discover_native_shell_profiles;\n    #[cfg(unix)]\n    use super::{ShellCwdStrategy, ShellExecutionDomain, validate_shell_profile_for_launch};'''
          if text.count(old) != 1:
              raise SystemExit(f'shell test import block count={text.count(old)}')
          shell.write_text(text.replace(old, new), encoding='utf-8')
      - name: Commit portability fixes
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "feat/003-t051-windows-conpty"
          cargo fmt --all -- --check || cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/git.rs src/workspace.rs src/shell_profiles.rs
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "3"
          git commit -m "fix(winds): make pre-T051 surfaces compile on Windows"
          git push origin "HEAD:$GITHUB_REF_NAME"
