name: T168 Workbench Bridge Repair

on:
  push:
    branches:
      - impl/spec-012-t168-tui-topology

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: impl/spec-012-t168-tui-topology
          fetch-depth: 0
          persist-credentials: true

      - name: Verify expected branch and canonical base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "impl/spec-012-t168-tui-topology"
          git fetch origin main
          test "$(git merge-base origin/main HEAD)" = "$(git rev-parse origin/main)"

      - name: Add trusted-client workbench projection seam
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          projection = Path('src/multiplexer/projection.rs')
          text = projection.read_text()
          marker = '\n#[cfg(test)]\n#[path = "../t168_multiplexer_tui_tests.rs"]\nmod t168_multiplexer_tui_tests;\n'
          if 'fn tui_topology_render_lines(' not in text:
              bridge = dedent(r'''
                  impl super::RustLocalControlClient {
                      pub(crate) fn tui_topology_render_lines(
                          &self,
                          reduced_motion: bool,
                          high_contrast: bool,
                          scaled_text: bool,
                      ) -> Option<Vec<String>> {
                          let snapshot = self.trusted_topology_snapshot()?;
                          let projection = TuiTopologyProjection::from_snapshot(snapshot).ok()?;
                          Some(projection.render_lines(TuiTopologyAccessibility {
                              reduced_motion,
                              high_contrast,
                              scaled_text,
                          }))
                      }

                      pub(crate) fn tui_topology_find_focus_intent(
                          &self,
                          query: &str,
                      ) -> Option<ApplyTopologyOperationV2> {
                          let snapshot = self.trusted_topology_snapshot()?;
                          let projection = TuiTopologyProjection::from_snapshot(snapshot).ok()?;
                          let TuiTopologyFindResolution::Unique(target) = projection.find(query) else {
                              return None;
                          };
                          projection
                              .keyboard_intent(TuiTopologyCommand::Focus(target))
                              .ok()
                      }

                      pub(crate) fn tui_topology_focus_pane_intent(
                          &self,
                          multiplexer_workspace_id: MultiplexerWorkspaceId,
                          tab_id: TabId,
                          pane_id: PaneId,
                      ) -> Option<ApplyTopologyOperationV2> {
                          let snapshot = self.trusted_topology_snapshot()?;
                          let projection = TuiTopologyProjection::from_snapshot(snapshot).ok()?;
                          projection
                              .keyboard_intent(TuiTopologyCommand::Focus(TuiTopologyTarget::Pane {
                                  multiplexer_workspace_id,
                                  tab_id,
                                  pane_id,
                              }))
                              .ok()
                      }
                  }
              ''')
              if marker not in text:
                  raise SystemExit('T168 test marker missing from projection.rs')
              text = text.replace(marker, '\n' + bridge + marker)
              projection.write_text(text)

          ui = Path('src/workbench_ui.rs')
          text = ui.read_text()
          marker = '\n#[cfg(test)]\n#[path = "t092_workbench_navigation_tests.rs"]\nmod t092_workbench_navigation_tests;\n'
          if 'struct CanonicalTopologyPaneHitRegion' not in text:
              bridge = dedent(r'''
                  #[derive(Debug, Clone, Copy, PartialEq, Eq)]
                  pub(crate) struct CanonicalTopologyPaneHitRegion {
                      pub(crate) multiplexer_workspace_id: crate::multiplexer::domain::MultiplexerWorkspaceId,
                      pub(crate) tab_id: crate::multiplexer::domain::TabId,
                      pub(crate) pane_id: crate::multiplexer::domain::PaneId,
                      pub(crate) column: u16,
                      pub(crate) row: u16,
                      pub(crate) width: u16,
                      pub(crate) height: u16,
                  }

                  impl CanonicalTopologyPaneHitRegion {
                      fn contains(self, column: u16, row: u16) -> bool {
                          column >= self.column
                              && row >= self.row
                              && column < self.column.saturating_add(self.width)
                              && row < self.row.saturating_add(self.height)
                      }
                  }

                  pub(crate) fn canonical_topology_text(
                      client: &crate::persistent_runtime::client::RustLocalControlClient,
                      reduced_motion: bool,
                      high_contrast: bool,
                      scaled_text: bool,
                  ) -> Option<String> {
                      client
                          .tui_topology_render_lines(reduced_motion, high_contrast, scaled_text)
                          .map(|lines| lines.join("\n"))
                  }

                  pub(crate) fn canonical_topology_search_focus_intent(
                      client: &crate::persistent_runtime::client::RustLocalControlClient,
                      query: &str,
                  ) -> Option<crate::persistent_runtime::protocol::ApplyTopologyOperationV2> {
                      client.tui_topology_find_focus_intent(query)
                  }

                  pub(crate) fn canonical_topology_pointer_focus_intent(
                      client: &crate::persistent_runtime::client::RustLocalControlClient,
                      hit_regions: &[CanonicalTopologyPaneHitRegion],
                      column: u16,
                      row: u16,
                  ) -> Option<crate::persistent_runtime::protocol::ApplyTopologyOperationV2> {
                      let mut matches = hit_regions
                          .iter()
                          .copied()
                          .filter(|region| region.contains(column, row));
                      let target = matches.next()?;
                      if matches.next().is_some() {
                          return None;
                      }
                      client.tui_topology_focus_pane_intent(
                          target.multiplexer_workspace_id,
                          target.tab_id,
                          target.pane_id,
                      )
                  }
              ''')
              if marker not in text:
                  raise SystemExit('T092 test marker missing from workbench_ui.rs')
              text = text.replace(marker, '\n' + bridge + marker)
              ui.write_text(text)
          PY

      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Format and constrain source scope
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          git diff --name-only -- src | sort > /tmp/changed.txt
          cat /tmp/changed.txt
          while IFS= read -r path; do
            case "$path" in
              src/multiplexer/projection.rs|src/workbench_ui.rs) ;;
              "") ;;
              *) echo "unexpected bridge path: $path" >&2; exit 1 ;;
            esac
          done < /tmp/changed.txt

      - name: Clippy exact bridge candidate
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run focused T168 tests
        run: cargo test --locked t168_

      - name: Preserve predecessor workbench navigation tests
        run: cargo test --locked t092_

      - name: Commit bridge only after all gates pass
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/multiplexer/projection.rs src/workbench_ui.rs; then
            echo "No bridge changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/multiplexer/projection.rs src/workbench_ui.rs
          git commit -m "feat: bridge trusted topology into the workbench"
          git push origin HEAD:impl/spec-012-t168-tui-topology
