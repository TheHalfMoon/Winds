name: T169 Desktop Exact-Head Diagnostic Probe

on:
  push:
    branches:
      - probe/t169-desktop-c0726eb

permissions:
  contents: read

env:
  HEAD_SHA: c0726eb5fa7436c2be3c52a0ea11f6ebff88b318

jobs:
  desktop-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Checkout and verify exact candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/impl/spec-012-t169-desktop-topology
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"
          git checkout --detach "$HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install exact npm
        shell: bash
        run: |
          npm install --global npm@10.9.8
          test "$(npm --version)" = "10.9.8"
      - name: Install renderer dependencies
        working-directory: desktop
        run: npm ci --ignore-scripts
      - name: Frontend format
        working-directory: desktop
        run: npm run format:check
      - name: Frontend typecheck and lint
        working-directory: desktop
        run: npm run typecheck && npm run lint
      - name: Frontend tests and build
        working-directory: desktop
        run: npm test && npm run frontend:build
