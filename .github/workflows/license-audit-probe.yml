name: license-audit-probe

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/license-audit-probe.yml
      - Cargo.toml
      - Cargo.lock
      - specs/002-public-release-readiness/**

permissions:
  contents: read

jobs:
  cargo-license-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1

      - name: Inventory locked dependency licenses
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/cargo-metadata.json"
          python3 - "$RUNNER_TEMP/cargo-metadata.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              metadata = json.load(handle)

          workspace = set(metadata["workspace_members"])
          packages = sorted(
              (package for package in metadata["packages"] if package["id"] not in workspace),
              key=lambda package: (package["name"], package["version"]),
          )

          print("name\tversion\tlicense\tlicense_file\tsource")
          missing = []
          for package in packages:
              license_expr = package.get("license") or "<NONE>"
              license_file = package.get("license_file") or "<NONE>"
              source = package.get("source") or "<NONE>"
              print(
                  f"{package['name']}\t{package['version']}\t{license_expr}\t{license_file}\t{source}"
              )
              if license_expr == "<NONE>" and license_file == "<NONE>":
                  missing.append(f"{package['name']} {package['version']}")

          print(f"LOCKED_DEPENDENCY_COUNT={len(packages)}")
          if missing:
              print("MISSING_LICENSE_METADATA=" + ", ".join(missing), file=sys.stderr)
              raise SystemExit(1)
          print("LICENSE_METADATA_COMPLETE=YES")
          PY
