name: t052-integrity-fix-temporary

on:
  push:
    branches: [feat/003-t052-wsl-launch]
    paths:
      - ".github/workflows/t052-integrity-fix-temporary.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - name: Keep visibility minimal and cleanup claims truthful
        shell: python
        run: |
          from pathlib import Path

          git_rs = Path('src/git.rs')
          git_text = git_rs.read_text(encoding='utf-8')
          old_const = 'pub(super) const GIT_CONTEXT_ENV_VARS: &[&str] = &['
          if git_text.count(old_const) != 1:
              raise SystemExit(f'expected one broadened Git context constant, found {git_text.count(old_const)}')
          git_rs.write_text(
              git_text.replace(old_const, 'const GIT_CONTEXT_ENV_VARS: &[&str] = &[', 1),
              encoding='utf-8',
          )

          launch = Path('src/wsl_launch.rs')
          text = launch.read_text(encoding='utf-8')
          old_session = '    let mut session = TerminalSession::start_exact_launch(\n'
          if text.count(old_session) != 1:
              raise SystemExit(f'expected one mutable launched session, found {text.count(old_session)}')
          text = text.replace(old_session, '    let session = TerminalSession::start_exact_launch(\n', 1)

          start_marker = '        let repo = Repo::open(Path::new(windows_workspace_root))?;\n'
          outer_close_marker = '    }\n\n    Ok(WslLaunchedTerminal {\n'
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('post-launch Repo::open marker not found')
          end = text.find(outer_close_marker, start)
          if end < 0:
              raise SystemExit('post-launch mapped block end marker not found')
          replacement = '''        let repo = match Repo::open(Path::new(windows_workspace_root)) {
              Ok(repo) => repo,
              Err(error) => {
                  return fail_after_started_wsl_session(
                      session,
                      format!(
                          "WSL mapped workspace could not be reopened after terminal launch: {error}"
                      ),
                  );
              }
          };
          match attest_workspace(&launcher, &distribution, linux_workspace_root, &repo) {
              Ok(attestation)
                  if attestation.linux_workspace_root == *linux_workspace_root
                      && attestation.linux_git_common_dir == *linux_git_common_dir
                      && attestation.git_head_oid == *git_head_oid => {}
              Ok(_) => {
                  return fail_after_started_wsl_session(
                      session,
                      "WSL mapped workspace identity changed after terminal launch".to_owned(),
                  );
              }
              Err(error) => {
                  return fail_after_started_wsl_session(
                      session,
                      format!(
                          "WSL mapped workspace could not be revalidated after terminal launch: {error}"
                      ),
                  );
              }
          }
          '''
          text = text[:start] + replacement + text[end:]

          helper_marker = '#[cfg(not(windows))]\npub fn launch_wsl_terminal(\n'
          if text.count(helper_marker) != 1:
              raise SystemExit(f'expected one non-Windows launch marker, found {text.count(helper_marker)}')
          helper = '''#[cfg(windows)]
          fn fail_after_started_wsl_session(
              mut session: TerminalSession,
              reason: String,
          ) -> Result<WslLaunchedTerminal> {
              match session.terminate() {
                  Ok(_) => Err(format!("{reason}; owned session terminated").into()),
                  Err(cleanup_error) => Err(format!(
                      "{reason}; owned session termination could not be proven: {cleanup_error}"
                  )
                  .into()),
              }
          }

          '''
          text = text.replace(helper_marker, helper + helper_marker, 1)
          launch.write_text(text, encoding='utf-8')

      - name: Validate exact source delta
        shell: bash
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' src/git.rs src/wsl_launch.rs | sort)"
          test "$changed" = "$expected"
      - name: Commit truthfulness repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/git.rs src/wsl_launch.rs
          git diff --cached --check
          git commit -m "fix(winds): keep WSL cleanup evidence truthful"
          git push origin "HEAD:$GITHUB_REF_NAME"
