name: t052-integrity-fix-temporary

on:
  push:
    branches: [feat/003-t052-wsl-launch]
    paths:
      - ".github/workflows/t052-integrity-fix-temporary.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - name: Keep visibility minimal and cleanup claims truthful
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}: {old[:100]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          git_rs = Path('src/git.rs')
          replace_once(
              git_rs,
              'pub(super) const GIT_CONTEXT_ENV_VARS: &[&str] = &[',
              'const GIT_CONTEXT_ENV_VARS: &[&str] = &[',
          )

          launch = Path('src/wsl_launch.rs')
          replace_once(
              launch,
              '    let mut session = TerminalSession::start_exact_launch(\n',
              '    let session = TerminalSession::start_exact_launch(\n',
          )
          replace_once(
              launch,
              '''        let repo = Repo::open(Path::new(windows_workspace_root))?;
              match attest_workspace(&launcher, &distribution, linux_workspace_root, &repo) {
                  Ok(attestation)
                      if attestation.linux_workspace_root == *linux_workspace_root
                          && attestation.linux_git_common_dir == *linux_git_common_dir
                          && attestation.git_head_oid == *git_head_oid => {}
                  Ok(_) => {
                      let _ = session.terminate();
                      return Err(
                          "WSL mapped workspace identity changed after terminal launch; session terminated"
                              .into(),
                      );
                  }
                  Err(error) => {
                      let _ = session.terminate();
                      return Err(format!(
                          "WSL mapped workspace could not be revalidated after terminal launch; session terminated: {error}"
                      )
                      .into());
                  }
              }
          ''',
              '''        let repo = match Repo::open(Path::new(windows_workspace_root)) {
                  Ok(repo) => repo,
                  Err(error) => {
                      return fail_after_started_wsl_session(
                          session,
                          format!(
                              "WSL mapped workspace could not be reopened after terminal launch: {error}"
                          ),
                      );
                  }
              };
              match attest_workspace(&launcher, &distribution, linux_workspace_root, &repo) {
                  Ok(attestation)
                      if attestation.linux_workspace_root == *linux_workspace_root
                          && attestation.linux_git_common_dir == *linux_git_common_dir
                          && attestation.git_head_oid == *git_head_oid => {}
                  Ok(_) => {
                      return fail_after_started_wsl_session(
                          session,
                          "WSL mapped workspace identity changed after terminal launch".to_owned(),
                      );
                  }
                  Err(error) => {
                      return fail_after_started_wsl_session(
                          session,
                          format!(
                              "WSL mapped workspace could not be revalidated after terminal launch: {error}"
                          ),
                      );
                  }
              }
          ''',
          )
          marker = '''#[cfg(not(windows))]
          pub fn launch_wsl_terminal(
          '''
          helper = '''#[cfg(windows)]
          fn fail_after_started_wsl_session(
              mut session: TerminalSession,
              reason: String,
          ) -> Result<WslLaunchedTerminal> {
              match session.terminate() {
                  Ok(_) => Err(format!("{reason}; owned session terminated").into()),
                  Err(cleanup_error) => Err(format!(
                      "{reason}; owned session termination could not be proven: {cleanup_error}"
                  )
                  .into()),
              }
          }

          #[cfg(not(windows))]
          pub fn launch_wsl_terminal(
          '''
          replace_once(launch, marker, helper)

      - name: Validate exact source delta
        shell: bash
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' src/git.rs src/wsl_launch.rs | sort)"
          test "$changed" = "$expected"
      - name: Commit truthfulness repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/git.rs src/wsl_launch.rs
          git diff --cached --check
          git commit -m "fix(winds): keep WSL cleanup evidence truthful"
          git push origin "HEAD:$GITHUB_REF_NAME"
