name: t051-closeout-helper-temporary

on:
  push:
    branches: [docs/003-t051-closeout]

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - name: Record canonical T051 evidence only
        shell: python
        run: |
          from pathlib import Path
          path = Path('specs/003-workspace-execution-spine/tasks.md')
          text = path.read_text(encoding='utf-8')
          old = '- [ ] **T051** Extend the terminal controller to native Windows using the accepted pseudoconsole/ConPTY path without weakening existing Unix process/check safety. Add compile/test gates on an official Windows runner before claiming native Windows workspace/terminal support.'
          new = '- [x] **T051** Extend the terminal controller to native Windows using the accepted pseudoconsole/ConPTY path without weakening existing Unix process/check safety. Add compile/test gates on an official Windows runner before claiming native Windows workspace/terminal support. **Canonical evidence:** PR #25 exact implementation head `9b8d416886727b046d6a589f705f7a3c41fa29f0` passed quality #239, windows-terminal #27 on official `windows-latest`, release-candidate #102, Ubuntu/macOS format+Clippy+tests, SC-001 100-cycle soak, Linux x86-64 and macOS arm64 release bundles, final exact-head correctness/safety and Ponytail review, Qodo final exact-head review with no new actionable correctness/safety/rule issues, and zero unresolved review threads after repairing CodeRabbit\'s valid unowned-descendant test finding. PR #25 was squash-merged with expected-head guard as canonical main `6b9e5b87e645f029a2ba14460eb946e3b33ec7d4`; post-merge quality #240 and windows-terminal #28 passed on that exact canonical main. The accepted slice reuses exact-pinned `portable-pty 0.9.0`/ConPTY for native-Windows PTY start, canonical cwd, single output-reader ownership, input/output, resize/current-size, exit observation, and directly-owned-child terminate/close/reap; keeps Unix T050 foreground-process-group SIGINT behavior unchanged; rejects unsupported native-Windows required-check execution before verify/promote mutation; and adds a bounded focused Windows CI gate. Official-Windows experiments could not prove a safe ownership-scoped ConPTY foreground interrupt, so FR-012/SC-003 and `research.md` were reconciled to require explicit fail-closed native-Windows `interrupt()` without false success or process-global signaling while proving the live session remains usable. The terminate fixture uses blocking `cmd.exe` built-in `set /p` rather than an unowned long-lived descendant. This slice does not implement WSL launch/path mapping (T052), persistence/restart ownership (T053), telemetry (T054+), CLI expansion (T057), broad touched-surface Windows CI (T061), real Windows+WSL2 integration (T062), daemon/public protocol/plugin/MCP/ACP, or Agent Fleet behavior.'
          if text.count(old) != 1:
              raise SystemExit(f'T051 unchecked line count={text.count(old)}')
          text = text.replace(old, new, 1)
          if '- [ ] **T052**' not in text:
              raise SystemExit('T052 must remain unchecked')
          path.write_text(text, encoding='utf-8')
      - name: Commit closeout
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add specs/003-workspace-execution-spine/tasks.md
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "specs/003-workspace-execution-spine/tasks.md"
          git commit -m "docs(winds): close T051 native Windows ConPTY lifecycle"
          git push origin "HEAD:$GITHUB_REF_NAME"
