name: t138-human-attention

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "src/desktop.rs"
      - "src/store.rs"
      - "src/t138_desktop_attention_tests.rs"
      - "src/lib.rs"
      - "desktop/**"
      - ".github/workflows/t138-human-attention.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "src/desktop.rs"
      - "src/store.rs"
      - "src/t138_desktop_attention_tests.rs"
      - "src/lib.rs"
      - "desktop/**"
      - ".github/workflows/t138-human-attention.yml"

concurrency:
  group: t138-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  attention:
    name: attention (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Verify Unix checkout identity
        if: runner.os != 'Windows'
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Verify Windows checkout identity
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -cne $env:CANDIDATE_SHA) {
            throw "checkout identity mismatch: actual=$actual expected=$env:CANDIDATE_SHA"
          }
      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install exact Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install and verify exact npm
        shell: bash
        run: |
          npm install --global npm@10.9.8
          test "$(npm --version)" = "10.9.8"
      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Install renderer dependencies
        working-directory: desktop
        run: npm ci --ignore-scripts
      - name: Frontend deterministic gates
        working-directory: desktop
        run: npm run format:check && npm run typecheck && npm run lint && npm test && npm run frontend:build
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Focused T138 attention tests
        run: cargo test --locked t138_desktop_attention_tests -- --test-threads=1
      - name: Root clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Desktop host clippy
        run: >-
          cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --locked
          --all-targets --all-features -- -D warnings
      - name: Locked Tauri host build
        working-directory: desktop
        run: npm run desktop:build
