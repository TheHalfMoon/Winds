name: T168 Format Repair

on:
  push:
    branches:
      - impl/spec-012-t168-tui-topology

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: impl/spec-012-t168-tui-topology
          fetch-depth: 0
          persist-credentials: true

      - name: Verify expected branch and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "impl/spec-012-t168-tui-topology"
          git fetch origin main
          test "$(git merge-base origin/main HEAD)" = "$(git rev-parse origin/main)"

      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Apply rustfmt
        run: cargo fmt --all

      - name: Verify formatting changes stay in T168 Rust scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only -- src | sort > /tmp/changed.txt
          cat /tmp/changed.txt
          while IFS= read -r path; do
            case "$path" in
              src/multiplexer/projection.rs|src/t168_multiplexer_tui_tests.rs) ;;
              "") ;;
              *) echo "unexpected formatted path: $path" >&2; exit 1 ;;
            esac
          done < /tmp/changed.txt

      - name: Clippy exact formatted candidate
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run focused T168 tests
        run: cargo test --locked t168_

      - name: Commit formatting only after compile and focused tests pass
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/multiplexer/projection.rs src/t168_multiplexer_tui_tests.rs; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/multiplexer/projection.rs src/t168_multiplexer_tui_tests.rs
          git commit -m "style: apply rustfmt to T168 candidate"
          git push origin HEAD:impl/spec-012-t168-tui-topology
