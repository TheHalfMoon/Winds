name: t052-qodo-fix3-temporary

on:
  push:
    branches: [feat/003-t052-wsl-launch]
    paths:
      - ".github/workflows/t052-qodo-fix3-temporary.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - name: Apply line-based exact-profile repair
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/wsl_launch.rs')
          lines = path.read_text(encoding='utf-8').splitlines()

          def one_index(predicate, label, start=0):
              hits = [i for i, line in enumerate(lines[start:], start) if predicate(line)]
              if len(hits) != 1:
                  raise SystemExit(f'{label}: expected one hit, found {len(hits)}')
              return hits[0]

          profile_start = one_index(
              lambda line: 'if plan.profile.shell_executable != WSL_SHELL_EXECUTABLE' in line,
              'profile-start',
          )
          profile_end = one_index(
              lambda line: 'let (windows_workspace_root, linux_cwd) = match &plan.cwd_resolution' in line,
              'profile-end',
              profile_start,
          )
          lines[profile_start:profile_end] = [
              '    let expected_profile = build_profile(launcher_text, &distribution);',
              '    validate_profile_for_launch(&plan.profile, &expected_profile)?;',
              '',
          ]

          launch_start = one_index(
              lambda line: line.strip() == 'let arguments = build_launch_arguments(',
              'launch-start',
          )
          launch_end = one_index(
              lambda line: line.strip().startswith('if let WslCwdResolution::MappedWorkspace'),
              'launch-end',
              launch_start,
          )
          lines[launch_start:launch_end] = [
              '    let arguments = build_launch_arguments(',
              '        &distribution.name,',
              '        linux_cwd,',
              '        &expected_profile.shell_executable,',
              '        &expected_profile.shell_arguments,',
              '    )?;',
              '    let session = TerminalSession::start_exact_launch(',
              '        &expected_profile.profile_id,',
              '        &launcher,',
              '        &arguments,',
              '        Path::new(windows_workspace_root),',
              '        size,',
              '    )?;',
              '',
          ]

          return_start = one_index(
              lambda line: line.strip() == 'Ok(WslLaunchedTerminal {',
              'return-start',
          )
          fail_cfg = one_index(
              lambda line: line.strip() == '#[cfg(windows)]' and line == '#[cfg(windows)]',
              'fail-cfg',
              return_start,
          )
          # Ensure this is the cfg immediately preceding the cleanup helper.
          if fail_cfg + 1 >= len(lines) or lines[fail_cfg + 1].strip() != 'fn fail_after_started_wsl_session(':
              later = [
                  i for i in range(return_start, len(lines) - 1)
                  if lines[i].strip() == '#[cfg(windows)]'
                  and lines[i + 1].strip() == 'fn fail_after_started_wsl_session('
              ]
              if len(later) != 1:
                  raise SystemExit(f'cleanup helper cfg: expected one hit, found {len(later)}')
              fail_cfg = later[0]
          lines[return_start:fail_cfg] = [
              '    Ok(WslLaunchedTerminal {',
              '        session,',
              '        profile: expected_profile,',
              '        cwd_resolution: plan.cwd_resolution.clone(),',
              '    })',
              '}',
              '',
              'fn validate_profile_for_launch(',
              '    profile: &WslTerminalProfile,',
              '    expected: &WslTerminalProfile,',
              ') -> Result<()> {',
              '    if profile.execution_domain != expected.execution_domain {',
              '        return Err("WSL terminal profile execution domain is unsupported or stale".into());',
              '    }',
              '    if profile.launcher_executable != expected.launcher_executable {',
              '        return Err("WSL terminal profile launcher executable is unsupported or stale".into());',
              '    }',
              '    if profile.shell_executable != expected.shell_executable {',
              '        return Err("WSL terminal profile shell executable is unsupported or stale".into());',
              '    }',
              '    if profile.shell_arguments != expected.shell_arguments {',
              '        return Err("WSL terminal profile shell arguments are unsupported or stale".into());',
              '    }',
              '    if profile.cwd_strategy != expected.cwd_strategy {',
              '        return Err("WSL terminal profile cwd strategy is unsupported or stale".into());',
              '    }',
              '    if profile.profile_id != expected.profile_id {',
              '        return Err("WSL terminal profile identity does not match its launch data".into());',
              '    }',
              '    Ok(())',
              '}',
              '',
          ]

          tests_mod = one_index(lambda line: line.strip() == 'mod tests {', 'tests-mod')
          import_start = one_index(lambda line: line.strip() == 'use super::{', 'test-import-start', tests_mod)
          import_end_candidates = [
              i for i in range(import_start + 1, len(lines)) if lines[i].strip() == '};'
          ]
          if not import_end_candidates:
              raise SystemExit('test import end not found')
          import_end = import_end_candidates[0] + 1
          lines[import_start:import_end] = [
              '    use super::{',
              '        WslCwdStrategy, WslExecutionDomain, WslTerminalProfile, build_launch_arguments,',
              '        parse_single_linux_path, stable_profile_id, validate_profile_for_launch,',
              '    };',
          ]

          # Insert the regression immediately before the final brace of the test module.
          final_close = len(lines) - 1
          while final_close >= 0 and lines[final_close].strip() == '':
              final_close -= 1
          if final_close < 0 or lines[final_close].strip() != '}':
              raise SystemExit('final test module close not found')
          regression = [
              '',
              '    #[test]',
              '    fn launch_validation_rejects_tampered_host_domain_but_ignores_ux_label() {',
              '        let domain = WslExecutionDomain {',
              '            host_os: "windows".to_owned(),',
              '            host_arch: "x86_64".to_owned(),',
              '            distribution: "Ubuntu Dev".to_owned(),',
              '            version: 2,',
              '        };',
              '        let strategy = WslCwdStrategy::MappedWorkspaceOrHomeFallback;',
              '        let profile_id = stable_profile_id(',
              '            &domain,',
              '            r"C:\\Windows\\System32\\wsl.exe",',
              '            "/bin/sh",',
              '            &[],',
              '            strategy,',
              '        );',
              '        let expected = WslTerminalProfile {',
              '            profile_id,',
              '            display_name: "WSL: Ubuntu Dev / /bin/sh".to_owned(),',
              '            execution_domain: domain,',
              '            launcher_executable: r"C:\\Windows\\System32\\wsl.exe".to_owned(),',
              '            shell_executable: "/bin/sh".to_owned(),',
              '            shell_arguments: Vec::new(),',
              '            cwd_strategy: strategy,',
              '        };',
              '',
              '        let mut ux_only = expected.clone();',
              '        ux_only.display_name = "UX label only".to_owned();',
              '        validate_profile_for_launch(&ux_only, &expected).unwrap();',
              '',
              '        let mut tampered_os = expected.clone();',
              '        tampered_os.execution_domain.host_os = "linux".to_owned();',
              '        let error = validate_profile_for_launch(&tampered_os, &expected).unwrap_err();',
              '        assert!(error.to_string().contains("execution domain"));',
              '',
              '        let mut tampered_arch = expected.clone();',
              '        tampered_arch.execution_domain.host_arch = "aarch64".to_owned();',
              '        let error = validate_profile_for_launch(&tampered_arch, &expected).unwrap_err();',
              '        assert!(error.to_string().contains("execution domain"));',
              '    }',
          ]
          lines[final_close:final_close] = regression
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')

      - name: Validate repair
        shell: bash
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features
          git diff --check
          test "$(git diff --name-only)" = "src/wsl_launch.rs"
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/wsl_launch.rs
          git diff --cached --check
          git commit -m "fix(winds): reject stale WSL execution domain"
          git push origin "HEAD:$GITHUB_REF_NAME"
