name: T083 Git identity precheck relay

on:
  push:
    branches:
      - impl/006-t083-candidate-evidence
    paths:
      - .github/workflows/t083-precheck-relay.yml
      - .github/t083_precheck_patch.py

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact relay head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Apply and qualify exact T083 precheck repair
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/t083_precheck_patch.py
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --locked t083_agentic_candidate_evidence_tests
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = "src/store.rs"
      - name: Commit exact repaired head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin impl/006-t083-candidate-evidence
          test "$(git rev-parse origin/impl/006-t083-candidate-evidence)" = "$GITHUB_SHA"
          git rm .github/workflows/t083-precheck-relay.yml .github/t083_precheck_patch.py
          git add src/store.rs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(006): verify T083 candidate Git identity before checks'
          git push origin HEAD:impl/006-t083-candidate-evidence
