name: t052-fixture-fix-temporary

on:
  push:
    branches: [feat/003-t052-wsl-launch]
    paths:
      - ".github/workflows/t052-fixture-fix-temporary.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - name: Repair fixture escape only
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/wsl_launch.rs')
          text = path.read_text(encoding='utf-8')
          old = 'b"/mnt/c/work space/trailing \\\\r\\\\n"'
          new = 'b"/mnt/c/work space/trailing \\r\\n"'
          if text.count(old) != 1:
              raise SystemExit(f'expected one escaped fixture, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Validate and commit
        shell: bash
        run: |
          cargo fmt --all -- --check
          git diff --check
          test "$(git diff --name-only)" = "src/wsl_launch.rs"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/wsl_launch.rs
          git commit -m "test(winds): use real CRLF in WSL path fixture"
          git push origin "HEAD:$GITHUB_REF_NAME"
