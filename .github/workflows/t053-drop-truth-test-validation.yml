name: t053-closeout-committer

on:
  push:
    branches: [ci/t053-obsolete-run-cleanup]
    paths:
      - ".github/workflows/t053-drop-truth-test-validation.yml"

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: docs/003-t053-closeout
          fetch-depth: 2
      - name: Verify exact closeout base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "aebf35057f5d5c5133961b008d0cb7c12b8d1ea7"
      - name: Record T053 canonical evidence only
        shell: python
        run: |
          from pathlib import Path

          path = Path("specs/003-workspace-execution-spine/tasks.md")
          text = path.read_text(encoding="utf-8")
          old = "- [ ] **T053** Persist terminal lifecycle transitions into the execution ledger, including start/final state/timing/domain/profile/cwd and explicit failed/interrupted states. After restart, any session whose continuing process ownership cannot be proven MUST reconcile to `OWNERSHIP_LOST` with process state unknown. A persisted PID alone is not process identity; recovery MUST NOT blindly signal/kill it. No daemon or cross-restart process attachment is allowed in this slice."
          new = "- [x] **T053** Persist terminal lifecycle transitions into the execution ledger, including start/final state/timing/domain/profile/cwd and explicit failed/interrupted states. After restart, any session whose continuing process ownership cannot be proven MUST reconcile to `OWNERSHIP_LOST` with process state unknown. A persisted PID alone is not process identity; recovery MUST NOT blindly signal/kill it. No daemon or cross-restart process attachment is allowed in this slice. **Canonical evidence:** PR #29 final exact implementation head `e2121b70b37839a95be8352c55ac63e86ae5052a` passed quality #310, windows-terminal #94 on official `windows-latest`, release-candidate #167, Ubuntu/macOS format+Clippy+tests, SC-001 100-cycle soak, Linux x86-64 and macOS arm64 release builds/artifacts, final correctness/safety and Ponytail review, Qodo final exact-head review with no actionable correctness/safety/active-spec findings, and zero unresolved review threads. The final source tree also passed five repeated default-parallel full macOS test cycles after reconciling PTY lifecycle test races. PR #29 merged with expected-head and unchanged-main guards as canonical main `aebf35057f5d5c5133961b008d0cb7c12b8d1ea7`; post-merge quality #311 passed on that exact canonical main. The accepted slice reuses the existing execution/terminal-session schema without migration, atomically records request/session identity and guarded lifecycle transitions, persists typed close reasons and timing only when proven, keeps Drop cleanup ledger-aware and bounded through directly owned child handles, retains Drop-time SQLite finalization failures in a Store-owned in-process retry queue, and reconciles unowned `REQUESTED`/`RUNNING` terminal executions after restart to conservative `OWNERSHIP_LOST` with unknown end/duration. It persists no PID and performs no PID lookup, blind signaling, cross-restart process attachment, daemon behavior, command telemetry/history (T054-T056), CLI proof surface (T057), broad Windows claim (T061), real Windows+WSL2 claim (T062), public protocol/plugin/MCP/ACP, or Agent Fleet behavior."
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one open T053 line, found {text.count(old)}")
          text = text.replace(old, new, 1)
          if "- [ ] **T054**" not in text:
              raise SystemExit("T054 must remain open")
          path.write_text(text, encoding="utf-8")
      - name: Verify docs-only delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git status --short | wc -l | tr -d ' ')" = "1"
          test "$(git status --short | awk '{print $2}')" = "specs/003-workspace-execution-spine/tasks.md"
          git diff --check
          git diff -- specs/003-workspace-execution-spine/tasks.md
      - name: Commit and push only if closeout head is unchanged
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin docs/003-t053-closeout
          test "$(git rev-parse FETCH_HEAD)" = "aebf35057f5d5c5133961b008d0cb7c12b8d1ea7"
          git config user.name "winds-ci"
          git config user.email "winds-ci@users.noreply.github.com"
          git add specs/003-workspace-execution-spine/tasks.md
          git commit -m "docs(winds): close T053 terminal lifecycle persistence"
          git push origin HEAD:docs/003-t053-closeout
