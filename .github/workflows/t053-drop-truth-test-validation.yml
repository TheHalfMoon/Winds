name: t053-drop-truth-test-validation

on:
  push:
    branches: [ci/t053-obsolete-run-cleanup]
    paths:
      - ".github/workflows/t053-drop-truth-test-validation.yml"

permissions:
  contents: read

jobs:
  macos-truth-test:
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 79717dd226254086d529ac3401ec57c878cf422a
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Apply test-only truthful PTY lifecycle assertions
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/execution.rs")
          text = path.read_text(encoding="utf-8")

          drop_start_marker = "    #[test]\n    fn dropping_live_terminal_closes_owned_child_and_finalizes_ledger() {\n"
          drop_next_marker = "    #[test]\n    fn launch_failure_records_failed_to_start_without_duration() {\n"
          drop_start = text.find(drop_start_marker)
          drop_end = text.find(drop_next_marker, drop_start + len(drop_start_marker))
          if drop_start < 0 or drop_end < 0 or drop_end <= drop_start:
              raise SystemExit(f"Drop test bounds invalid: start={drop_start}, end={drop_end}")

          drop_replacement = '''    #[test]
          fn dropping_live_terminal_records_only_proven_cleanup_truth() {
              let root = TestRoot::new("drop-live");
              let mut store = store_with_workspace(&root);
              let profile = native_sh_profile();
              let execution = TerminalExecution::start_native(
                  &mut store,
                  "execution-drop",
                  "workspace-1",
                  &profile,
                  root.path(),
                  TerminalSize { rows: 24, cols: 80 },
              )
              .unwrap();

              drop(execution);
              let final_record = store.load_execution("execution-drop").unwrap();
              assert_eq!(final_record.status_source, FactSource::WindsObserved);
              assert!(final_record.started_unix_ms.is_some());
              let terminal = store.load_terminal_session("execution-drop").unwrap();
              match final_record.status {
                  ExecutionStatus::Interrupted => {
                      assert_eq!(
                          terminal.close_reason,
                          Some(TerminalCloseReason::ClosedByWinds)
                      );
                      assert!(final_record.ended_unix_ms.is_some());
                      assert!(final_record.duration_ms.is_some());
                  }
                  ExecutionStatus::OwnershipLost => {
                      assert_eq!(
                          terminal.close_reason,
                          Some(TerminalCloseReason::OwnershipLostProcessStateUnknown)
                      );
                      assert_eq!(final_record.ended_unix_ms, None);
                      assert_eq!(final_record.duration_ms, None);
                  }
                  other => panic!(
                      "live terminal Drop must record only proven cleanup truth, got {other:?}"
                  ),
              }
              assert_eq!(store.pending_terminal_finalization_count(), 0);
          }

          '''
          text = text[:drop_start] + drop_replacement + text[drop_end:]

          terminate_start_marker = "    #[test]\n    fn controlled_terminate_records_interrupted() {\n"
          terminate_next_marker = "    #[test]\n    fn dropping_live_terminal_records_only_proven_cleanup_truth() {\n"
          terminate_start = text.find(terminate_start_marker)
          terminate_end = text.find(
              terminate_next_marker,
              terminate_start + len(terminate_start_marker),
          )
          if terminate_start < 0 or terminate_end < 0 or terminate_end <= terminate_start:
              raise SystemExit(
                  f"terminate test bounds invalid: start={terminate_start}, end={terminate_end}"
              )
          terminate_segment = text[terminate_start:terminate_end]
          marker = "        execution.terminate().unwrap();\n"
          if terminate_segment.count(marker) != 1:
              raise SystemExit(
                  f"controlled terminate call marker count={terminate_segment.count(marker)}"
              )
          terminate_segment = terminate_segment.replace(
              marker,
              "        let output = drain_output(execution.take_output_reader().unwrap());\n"
              + marker
              + "        output.join().unwrap();\n",
              1,
          )
          text = text[:terminate_start] + terminate_segment + text[terminate_end:]
          path.write_text(text, encoding="utf-8")
      - name: Format and lint patched tests
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Repeat full macOS suite with truthful PTY test contracts
        shell: python
        run: |
          import subprocess
          import sys

          command = ["cargo", "test", "--locked", "--all-targets", "--all-features"]
          for cycle in range(1, 6):
              print(f"=== patched truth cycle {cycle}/5 ===", flush=True)
              try:
                  result = subprocess.run(command, timeout=45)
              except subprocess.TimeoutExpired:
                  print(f"cycle {cycle} exceeded 45 seconds", flush=True)
                  sys.exit(124)
              if result.returncode != 0:
                  sys.exit(result.returncode)
