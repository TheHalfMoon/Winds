name: t139-runtime-authority

on:
  pull_request:
    paths:
      - "desktop/**"
      - "docs/provenance/010-t139-desktop-runtime-authority.md"
      - ".github/workflows/t139-runtime-authority.yml"
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "docs/provenance/010-t139-desktop-runtime-authority.md"
      - ".github/workflows/t139-runtime-authority.yml"

concurrency:
  group: t139-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  authority-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Verify checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Install exact Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install and verify exact npm
        shell: bash
        run: |
          npm install --global npm@10.9.8
          test "$(npm --version)" = "10.9.8"
      - name: Install renderer dependencies
        working-directory: desktop
        run: npm ci --ignore-scripts
      - name: Deterministic desktop gates
        working-directory: desktop
        run: npm run format:check && npm run typecheck && npm run lint && npm test && npm run frontend:build
      - name: Prove canonical authority decisions
        shell: bash
        run: |
          grep -F 'DESKTOP_DIRECT_CODEX_LAUNCH=UNAUTHORIZED' docs/provenance/010-t139-desktop-runtime-authority.md
          grep -F 'DESKTOP_DIRECT_CLAUDE_LAUNCH=UNAUTHORIZED' docs/provenance/010-t139-desktop-runtime-authority.md
