name: t053-ci-backlog-cleanup3-temporary

on:
  push:
    branches: [feat/003-t053-terminal-ledger]
    paths:
      - ".github/workflows/t053-ci-backlog-cleanup3-temporary.yml"

permissions:
  actions: write
  contents: read

jobs:
  cancel-obsolete-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Preserve final repair and cancel other active branch runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json
          import os
          import urllib.parse
          import urllib.request
          import urllib.error

          repo = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ["GITHUB_REF_NAME"]
          current_run = int(os.environ["GITHUB_RUN_ID"])
          repair_run = 31970063839
          token = os.environ["GH_TOKEN"]
          active = {"queued", "in_progress", "waiting", "pending", "requested"}
          preserve = {current_run, repair_run}

          query = urllib.parse.urlencode({"branch": branch, "per_page": 100})
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/runs?{query}",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)

          targets = [
              run for run in payload.get("workflow_runs", [])
              if run.get("id") not in preserve and run.get("status") in active
          ]
          print(f"preserving {preserve}; cancelling {len(targets)} run(s)")
          for run in targets:
              cancel = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/runs/{run['id']}/cancel",
                  method="POST",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(cancel, timeout=30) as response:
                      if response.status != 202:
                          raise SystemExit(
                              f"unexpected cancellation status {response.status} for run {run['id']}"
                          )
              except urllib.error.HTTPError as error:
                  if error.code != 409:
                      raise
