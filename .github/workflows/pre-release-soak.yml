name: pre-release-soak

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/pre-release-soak.yml
      - tests/pre_release_soak.rs
      - specs/001-verification-walking-skeleton/tasks.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sc-001-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1

      - name: Run SC-001 100-cycle soak
        run: cargo test --locked --test pre_release_soak -- --ignored --nocapture
