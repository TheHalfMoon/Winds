name: t052-qodo-final-temporary

on:
  push:
    branches: [feat/003-t052-wsl-launch]
    paths:
      - ".github/workflows/t052-qodo-final-temporary.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - name: Apply reviewed exact-profile repair
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/wsl_launch.rs')
          original = path.read_text(encoding='utf-8')
          lines = original.splitlines()

          def hits(predicate, start=0):
              return [i for i, line in enumerate(lines[start:], start) if predicate(line)]

          profile_starts = hits(lambda line: 'if plan.profile.shell_executable != WSL_SHELL_EXECUTABLE' in line)
          profile_ends = hits(lambda line: 'let (windows_workspace_root, linux_cwd) = match &plan.cwd_resolution' in line)
          launch_starts = hits(lambda line: line.strip() == 'let arguments = build_launch_arguments(')
          mapped_starts = hits(lambda line: line.strip().startswith('if let WslCwdResolution::MappedWorkspace'))
          return_starts = hits(lambda line: line.strip() == 'Ok(WslLaunchedTerminal {')
          cleanup_fns = hits(lambda line: line.strip() == 'fn fail_after_started_wsl_session(')
          tests_mods = hits(lambda line: line.strip() == 'mod tests {')

          cardinalities = {
              'profile-start': profile_starts,
              'profile-end': profile_ends,
              'launch-start': launch_starts,
              'mapped-start': mapped_starts,
              'return-start': return_starts,
              'cleanup-fn': cleanup_fns,
              'tests-mod': tests_mods,
          }
          for label, values in cardinalities.items():
              if len(values) != 1:
                  raise SystemExit(f'{label}: expected one hit, found {len(values)}')

          profile_start = profile_starts[0]
          profile_end = profile_ends[0]
          if not profile_start < profile_end:
              raise SystemExit('profile block ordering invalid')
          lines[profile_start:profile_end] = [
              '    let expected_profile = build_profile(launcher_text, &distribution);',
              '    validate_profile_for_launch(&plan.profile, &expected_profile)?;',
              '',
          ]

          # Recompute after the first splice.
          launch_start = [i for i, line in enumerate(lines) if line.strip() == 'let arguments = build_launch_arguments(']
          mapped_start = [i for i, line in enumerate(lines) if line.strip().startswith('if let WslCwdResolution::MappedWorkspace')]
          if len(launch_start) != 1 or len(mapped_start) != 1 or not launch_start[0] < mapped_start[0]:
              raise SystemExit('launch block bounds invalid after profile splice')
          lines[launch_start[0]:mapped_start[0]] = [
              '    let arguments = build_launch_arguments(',
              '        &distribution.name,',
              '        linux_cwd,',
              '        &expected_profile.shell_executable,',
              '        &expected_profile.shell_arguments,',
              '    )?;',
              '    let session = TerminalSession::start_exact_launch(',
              '        &expected_profile.profile_id,',
              '        &launcher,',
              '        &arguments,',
              '        Path::new(windows_workspace_root),',
              '        size,',
              '    )?;',
              '',
          ]

          # Find the exact cleanup function, then its immediately preceding cfg line.
          return_start = [i for i, line in enumerate(lines) if line.strip() == 'Ok(WslLaunchedTerminal {']
          cleanup_fn = [i for i, line in enumerate(lines) if line.strip() == 'fn fail_after_started_wsl_session(']
          if len(return_start) != 1 or len(cleanup_fn) != 1:
              raise SystemExit('return/cleanup function cardinality changed unexpectedly')
          cleanup_idx = cleanup_fn[0]
          if cleanup_idx == 0 or lines[cleanup_idx - 1].strip() != '#[cfg(windows)]':
              raise SystemExit('cleanup function is not guarded by cfg(windows)')
          cleanup_cfg = cleanup_idx - 1
          if not return_start[0] < cleanup_cfg:
              raise SystemExit('return/cleanup block ordering invalid')
          lines[return_start[0]:cleanup_cfg] = [
              '    Ok(WslLaunchedTerminal {',
              '        session,',
              '        profile: expected_profile,',
              '        cwd_resolution: plan.cwd_resolution.clone(),',
              '    })',
              '}',
              '',
              'fn validate_profile_for_launch(',
              '    profile: &WslTerminalProfile,',
              '    expected: &WslTerminalProfile,',
              ') -> Result<()> {',
              '    if profile.execution_domain != expected.execution_domain {',
              '        return Err("WSL terminal profile execution domain is unsupported or stale".into());',
              '    }',
              '    if profile.launcher_executable != expected.launcher_executable {',
              '        return Err("WSL terminal profile launcher executable is unsupported or stale".into());',
              '    }',
              '    if profile.shell_executable != expected.shell_executable {',
              '        return Err("WSL terminal profile shell executable is unsupported or stale".into());',
              '    }',
              '    if profile.shell_arguments != expected.shell_arguments {',
              '        return Err("WSL terminal profile shell arguments are unsupported or stale".into());',
              '    }',
              '    if profile.cwd_strategy != expected.cwd_strategy {',
              '        return Err("WSL terminal profile cwd strategy is unsupported or stale".into());',
              '    }',
              '    if profile.profile_id != expected.profile_id {',
              '        return Err("WSL terminal profile identity does not match its launch data".into());',
              '    }',
              '    Ok(())',
              '}',
              '',
          ]

          tests_mod = [i for i, line in enumerate(lines) if line.strip() == 'mod tests {']
          if len(tests_mod) != 1:
              raise SystemExit('tests module cardinality changed unexpectedly')
          test_start = tests_mod[0]
          import_starts = [i for i in range(test_start + 1, len(lines)) if lines[i].strip() == 'use super::{']
          if len(import_starts) != 1:
              raise SystemExit(f'test import: expected one hit, found {len(import_starts)}')
          import_start = import_starts[0]
          import_ends = [i for i in range(import_start + 1, len(lines)) if lines[i].strip() == '};']
          if not import_ends:
              raise SystemExit('test import end missing')
          import_end = import_ends[0] + 1
          lines[import_start:import_end] = [
              '    use super::{',
              '        WslCwdStrategy, WslExecutionDomain, WslTerminalProfile, build_launch_arguments,',
              '        parse_single_linux_path, stable_profile_id, validate_profile_for_launch,',
              '    };',
          ]

          final_close = len(lines) - 1
          while final_close >= 0 and not lines[final_close].strip():
              final_close -= 1
          if final_close < 0 or lines[final_close].strip() != '}':
              raise SystemExit('final test-module close missing')
          lines[final_close:final_close] = [
              '',
              '    #[test]',
              '    fn launch_validation_rejects_tampered_host_domain_but_ignores_ux_label() {',
              '        let domain = WslExecutionDomain {',
              '            host_os: "windows".to_owned(),',
              '            host_arch: "x86_64".to_owned(),',
              '            distribution: "Ubuntu Dev".to_owned(),',
              '            version: 2,',
              '        };',
              '        let strategy = WslCwdStrategy::MappedWorkspaceOrHomeFallback;',
              '        let profile_id = stable_profile_id(',
              '            &domain,',
              '            r"C:\\Windows\\System32\\wsl.exe",',
              '            "/bin/sh",',
              '            &[],',
              '            strategy,',
              '        );',
              '        let expected = WslTerminalProfile {',
              '            profile_id,',
              '            display_name: "WSL: Ubuntu Dev / /bin/sh".to_owned(),',
              '            execution_domain: domain,',
              '            launcher_executable: r"C:\\Windows\\System32\\wsl.exe".to_owned(),',
              '            shell_executable: "/bin/sh".to_owned(),',
              '            shell_arguments: Vec::new(),',
              '            cwd_strategy: strategy,',
              '        };',
              '',
              '        let mut ux_only = expected.clone();',
              '        ux_only.display_name = "UX label only".to_owned();',
              '        validate_profile_for_launch(&ux_only, &expected).unwrap();',
              '',
              '        let mut tampered_os = expected.clone();',
              '        tampered_os.execution_domain.host_os = "linux".to_owned();',
              '        let error = validate_profile_for_launch(&tampered_os, &expected).unwrap_err();',
              '        assert!(error.to_string().contains("execution domain"));',
              '',
              '        let mut tampered_arch = expected.clone();',
              '        tampered_arch.execution_domain.host_arch = "aarch64".to_owned();',
              '        let error = validate_profile_for_launch(&tampered_arch, &expected).unwrap_err();',
              '        assert!(error.to_string().contains("execution domain"));',
              '    }',
          ]

          updated = '\n'.join(lines) + '\n'
          if updated == original:
              raise SystemExit('repair produced no source change')
          path.write_text(updated, encoding='utf-8')

      - name: Validate repair
        shell: bash
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features
          git diff --check
          test "$(git diff --name-only)" = "src/wsl_launch.rs"
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/wsl_launch.rs
          git diff --cached --check
          git commit -m "fix(winds): reject stale WSL execution domain"
          git push origin "HEAD:$GITHUB_REF_NAME"
