name: t053-source-commit-temporary

on:
  push:
    branches: [feat/003-t053-terminal-ledger]
    paths:
      - ".github/workflows/t053-source-commit-temporary.yml"

permissions:
  contents: write

jobs:
  commit-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Reapply already validated T053 patch
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/t053-bootstrap2-temporary.yml').read_text(encoding='utf-8')
          start_marker = '''      - name: Apply T053 persistence wiring
                  shell: python
                  run: |
          '''
          end_marker = '''      - name: Validate T053 on Ubuntu
          '''
          start = workflow.find(start_marker)
          end = workflow.find(end_marker, start + len(start_marker))
          if start < 0 or end < 0:
              raise SystemExit(f'validated patch block bounds invalid: start={start} end={end}')
          block = workflow[start + len(start_marker):end]
          lines = block.splitlines()
          script_lines = []
          for line in lines:
              if line.startswith('          '):
                  script_lines.append(line[10:])
              elif line.strip():
                  raise SystemExit(f'unexpected indentation in validated patch: {line!r}')
              else:
                  script_lines.append('')
          script = '\n'.join(script_lines) + '\n'
          Path('/tmp/t053-validated-patch.py').write_text(script, encoding='utf-8')
          subprocess.run(['python', '/tmp/t053-validated-patch.py'], check=True)
      - name: Revalidate source on Ubuntu
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --locked --all-targets --all-features
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --bin winds store::persistence_tests -- --test-threads=1
          cargo test --locked --bin winds execution::tests -- --test-threads=1
          cargo test --locked --all-targets --all-features
          git diff --check -- src/domain.rs src/execution.rs src/main.rs src/store.rs
      - name: Commit validated source only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain.rs src/execution.rs src/main.rs src/store.rs
          git diff --cached --check
          git commit -m "feat(winds): persist terminal lifecycle truth"
          git push origin "HEAD:$GITHUB_REF_NAME"
