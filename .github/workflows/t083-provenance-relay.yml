name: T083 opaque evidence provenance relay

on:
  push:
    branches:
      - impl/006-t083-candidate-evidence
    paths:
      - .github/workflows/t083-provenance-relay.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact relay head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Apply bounded T083 provenance repair
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' ' ' | base64 -d > /tmp/t083_patch.py
          python3 /tmp/t083_patch.py
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --locked t083_agentic_candidate_evidence_tests
          test -z "$(git diff --name-only | grep -v -E '^(src/store.rs|src/main.rs|src/t083_agentic_candidate_evidence_tests.rs)$' || true)"
      - name: Commit exact repaired head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin impl/006-t083-candidate-evidence
          test "$(git rev-parse origin/impl/006-t083-candidate-evidence)" = "$GITHUB_SHA"
          git rm .github/workflows/t083-provenance-relay.yml
          git add src/store.rs src/main.rs src/t083_agentic_candidate_evidence_tests.rs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(006): seal T083 Winds-observed evidence persistence'
          git push origin HEAD:impl/006-t083-candidate-evidence
