name: t053-drop-repair2-temporary

on:
  push:
    branches: [feat/003-t053-terminal-ledger]
    paths:
      - ".github/workflows/t053-drop-repair2-temporary.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Reapply reviewed repair with robust constructor matcher
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/t053-drop-repair-temporary.yml').read_text(encoding='utf-8')
          step = '      - name: Apply ledger-aware drop ownership repair\n        shell: python\n        run: |\n'
          next_step = '      - name: Validate drop repair on Ubuntu\n'
          start = workflow.find(step)
          end = workflow.find(next_step, start + len(step))
          if start < 0 or end < 0:
              raise SystemExit(f'repair script bounds invalid: start={start}, end={end}')
          block = workflow[start + len(step):end]
          script_lines = []
          for line in block.splitlines():
              if line.startswith('          '):
                  script_lines.append(line[10:])
              elif line.strip():
                  raise SystemExit(f'unexpected repair indentation: {line!r}')
              else:
                  script_lines.append('')
          script = '\n'.join(script_lines) + '\n'

          constructor_start = script.find("old_open = '''")
          constructor_end = script.find("\n\nmarker = ", constructor_start)
          if constructor_start < 0 or constructor_end < 0:
              raise SystemExit(
                  f'constructor matcher block not found: start={constructor_start}, end={constructor_end}'
              )
          robust = '''open_home_marker = "            home: home.to_path_buf(),\\n"
          if text.count(open_home_marker) != 1:
              raise SystemExit(f"Store open home marker count={text.count(open_home_marker)}")
          text = text.replace(
              open_home_marker,
              open_home_marker + "            deferred_terminal_finalizations: Vec::new(),\\n",
              1,
          )'''
          script = script[:constructor_start] + robust + script[constructor_end:]
          Path('/tmp/t053-drop-repair.py').write_text(script, encoding='utf-8')
          subprocess.run(['python', '/tmp/t053-drop-repair.py'], check=True)
      - name: Validate repaired ownership on Ubuntu
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --locked --all-targets --all-features
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --bin winds store::persistence_tests -- --test-threads=1
          cargo test --locked --bin winds execution::tests -- --test-threads=1
          cargo test --locked --all-targets --all-features
          git diff --check -- src/store.rs src/execution.rs
      - name: Commit validated repair source only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/store.rs src/execution.rs
          git diff --cached --check
          git commit -m "fix(winds): keep terminal drop ledger-aware"
          git push origin "HEAD:$GITHUB_REF_NAME"
