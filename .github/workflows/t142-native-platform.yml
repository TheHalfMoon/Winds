name: t142-native-platform

on:
  pull_request:
    paths:
      - "desktop/**"
      - "src/**"
      - "scripts/ci/t142-platform-evidence.mjs"
      - "docs/provenance/010-t142-native-platform.md"
      - ".github/workflows/t142-native-platform.yml"
      - ".github/workflows/windows-terminal.yml"
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "src/**"
      - "scripts/ci/t142-platform-evidence.mjs"
      - "docs/provenance/010-t142-native-platform.md"
      - ".github/workflows/t142-native-platform.yml"
      - ".github/workflows/windows-terminal.yml"

concurrency:
  group: t142-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  native-platform:
    name: native-platform (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Verify exact checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install exact Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install and verify exact npm
        shell: bash
        run: |
          npm install --global npm@10.9.8
          test "$(npm --version)" = "10.9.8"
      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Install renderer dependencies
        working-directory: desktop
        shell: bash
        run: npm ci --ignore-scripts
      - name: Renderer and accessibility platform contracts
        working-directory: desktop
        shell: bash
        run: npm run format:check && npm run typecheck && npm run lint && npm test && npm run frontend:build
      - name: Native Workbench terminal input focus resize qualification
        shell: bash
        run: >-
          cargo test --locked --bin winds
          workbench::t096_workbench_platform_tests::t096_native_workbench_path_directly_qualifies_current_host_domain
          -- --exact --test-threads=1
      - name: Unix PTY integration
        if: runner.os != 'Windows'
        shell: bash
        run: cargo test --locked --bin winds git::terminal::tests -- --test-threads=1
      - name: Native Windows ConPTY integration
        if: runner.os == 'Windows'
        shell: bash
        run: cargo test --locked --bin winds terminal::windows_tests -- --test-threads=1
      - name: Preserve Windows WSL launch unit boundary
        if: runner.os == 'Windows'
        shell: bash
        run: cargo test --locked --bin winds wsl_launch::tests -- --test-threads=1
      - name: Release-like locked Tauri build
        working-directory: desktop
        shell: bash
        run: npm run desktop:build
      - name: Capture Linux WebKitGTK version
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version="$(pkg-config --modversion webkit2gtk-4.1)"
          test -n "$version"
          echo "WINDS_WEBVIEW_VERSION=$version" >> "$GITHUB_ENV"
          echo "WINDS_WEBVIEW_SOURCE=pkg-config webkit2gtk-4.1" >> "$GITHUB_ENV"
      - name: Capture macOS WKWebView version
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk '/CFBundleVersion/{getline;gsub(/<[^>]*>/,"");print}' /System/Library/Frameworks/WebKit.framework/Resources/Info.plist)"
          test -n "$version"
          echo "WINDS_WEBVIEW_VERSION=$version" >> "$GITHUB_ENV"
          echo "WINDS_WEBVIEW_SOURCE=macOS WebKit.framework CFBundleVersion" >> "$GITHUB_ENV"
      - name: Capture Windows WebView2 version
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $roots = @(
            "${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application",
            "${env:ProgramFiles}\Microsoft\EdgeWebView\Application"
          )
          $versions = @()
          foreach ($root in $roots) {
            if (Test-Path -LiteralPath $root -PathType Container) {
              $versions += Get-ChildItem -LiteralPath $root -Directory |
                Where-Object { $_.Name -match '^\d+(\.\d+)+$' } |
                ForEach-Object { [version]$_.Name }
            }
          }
          if ($versions.Count -eq 0) { throw "WebView2 runtime version directory not found" }
          $version = ($versions | Sort-Object -Descending | Select-Object -First 1).ToString()
          "WINDS_WEBVIEW_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDS_WEBVIEW_SOURCE=Microsoft Edge WebView2 Runtime Application directory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Assemble identity-bound platform evidence
        shell: bash
        env:
          T142_EVIDENCE_PATH: t142-platform-${{ runner.os }}.json
        run: |
          set -euo pipefail
          node scripts/ci/t142-platform-evidence.mjs
          test -s "$T142_EVIDENCE_PATH"
          node -e '
            const fs=require("fs");
            const p=process.env.T142_EVIDENCE_PATH;
            const e=JSON.parse(fs.readFileSync(p,"utf8"));
            if(e.candidate_commit!==process.env.CANDIDATE_SHA) process.exit(1);
            if(!e.build?.binary_sha256 || !e.webview?.version) process.exit(1);
          '
      - name: Upload exact platform evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: t142-native-platform-${{ runner.os }}-${{ env.CANDIDATE_SHA }}
          path: t142-platform-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 30
