name: T173 T160 Windows diagnostic 9340739

on:
  push:
    branches:
      - review/t173-t160-windows-diagnostic-9340739

permissions:
  contents: read

env:
  CANDIDATE_SHA: 93407399e588ffa62006725de1f2dedad244a305

jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Verify identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1

      - name: Enumerate and isolate persistent-runtime tests
        shell: pwsh
        run: |
          @'
          import pathlib
          import subprocess
          import sys
          import time

          candidate = "93407399e588ffa62006725de1f2dedad244a305"
          listing = subprocess.run(
              ["cargo", "test", "--locked", "--bin", "winds", "persistent_runtime::", "--", "--list"],
              text=True,
              capture_output=True,
              check=True,
          )
          tests = []
          for line in listing.stdout.splitlines():
              if line.endswith(": test"):
                  tests.append(line[:-6])

          out = pathlib.Path("t160-windows-diagnostic.txt")
          lines = [f"candidate={candidate}", f"test_count={len(tests)}"]
          print(f"Enumerated {len(tests)} tests")
          for index, test in enumerate(tests, 1):
              print(f"[{index}/{len(tests)}] {test}", flush=True)
              started = time.monotonic()
              try:
                  proc = subprocess.run(
                      ["cargo", "test", "--locked", "--bin", "winds", test, "--", "--exact", "--test-threads=1", "--nocapture"],
                      text=True,
                      capture_output=True,
                      timeout=90,
                  )
                  elapsed = time.monotonic() - started
                  status = "PASS" if proc.returncode == 0 else f"FAIL({proc.returncode})"
                  lines.append(f"{status}\t{elapsed:.1f}s\t{test}")
                  if proc.returncode != 0:
                      lines.append(proc.stdout[-4000:])
                      lines.append(proc.stderr[-4000:])
                      out.write_text("\n".join(lines), encoding="utf-8")
                      sys.exit(proc.returncode or 1)
              except subprocess.TimeoutExpired as exc:
                  elapsed = time.monotonic() - started
                  lines.append(f"TIMEOUT\t{elapsed:.1f}s\t{test}")
                  if exc.stdout:
                      lines.append(str(exc.stdout)[-4000:])
                  if exc.stderr:
                      lines.append(str(exc.stderr)[-4000:])
                  out.write_text("\n".join(lines), encoding="utf-8")
                  sys.exit(124)

          out.write_text("\n".join(lines), encoding="utf-8")
          '@ | Set-Content -Encoding utf8 diagnostic.py
          python diagnostic.py

      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t173-t160-windows-diagnostic-9340739
          path: t160-windows-diagnostic.txt
          if-no-files-found: warn
          retention-days: 14
