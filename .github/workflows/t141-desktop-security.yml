name: t141-desktop-security

on:
  pull_request:
    paths:
      - "desktop/**"
      - "src/**"
      - "docs/provenance/010-t141-desktop-security.md"
      - ".github/workflows/t141-desktop-security.yml"
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "src/**"
      - "docs/provenance/010-t141-desktop-security.md"
      - ".github/workflows/t141-desktop-security.yml"

concurrency:
  group: t141-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  desktop-boundary:
    name: desktop-boundary (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Verify checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install exact Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install and verify exact npm
        shell: bash
        run: |
          npm install --global npm@10.9.8
          test "$(npm --version)" = "10.9.8"
      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Install renderer dependencies
        working-directory: desktop
        shell: bash
        run: npm ci --ignore-scripts
      - name: Renderer adversarial gates
        working-directory: desktop
        shell: bash
        run: npm run format:check && npm run typecheck && npm run lint && npm test && npm run frontend:build
      - name: Rust format
        shell: bash
        run: cargo fmt --all -- --check
      - name: Terminal content confinement
        shell: bash
        run: cargo test --locked 'workbench::screen::t089_workbench_screen_tests' -- --test-threads=1
      - name: Host side-effect refusal
        shell: bash
        run: cargo test --locked 'workbench::screen::host_safety::t095_workbench_host_safety_tests' -- --test-threads=1
      - name: Dual-session cross-target refusal
        shell: bash
        run: cargo test --locked t134_dual_session_tests -- --test-threads=1
      - name: Files binding traversal and symlink refusal
        shell: bash
        run: cargo test --locked t136_desktop_files_tests -- --test-threads=1
      - name: Inspection stale and forged-evidence refusal
        shell: bash
        run: cargo test --locked t137_desktop_inspection_tests -- --test-threads=1
      - name: Locked Tauri host build
        working-directory: desktop
        shell: bash
        run: npm run desktop:build

  canonical-adversarial:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Verify checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Workbench adversarial campaign
        shell: bash
        run: cargo test --locked t099_workbench_adversarial_tests -- --test-threads=1
      - name: Workflow authority replay campaign
        shell: bash
        run: cargo test --locked t112_workflow_adversarial_tests -- --test-threads=1
      - name: Model-mesh identity and secret campaign
        shell: bash
        run: cargo test --locked t123_model_mesh_adversarial_tests -- --test-threads=1
      - name: Corrupt desktop presentation campaign
        shell: bash
        run: cargo test --locked 'store::t130_desktop_presentation_tests' -- --test-threads=1
      - name: Reject secret-shaped tracked desktop material
        shell: bash
        run: |
          set -euo pipefail
          pattern='(sk-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AIza[0-9A-Za-z_-]{30,}|xox[baprs]-[0-9A-Za-z-]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)'
          if git grep -nE "$pattern" -- desktop docs/provenance/010-t141-desktop-security.md; then
            echo "secret-shaped tracked material detected" >&2
            exit 1
          fi
