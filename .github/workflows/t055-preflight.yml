name: t055-preflight

on:
  push:
    branches: [ci/t053-obsolete-run-cleanup]
    paths:
      - ".github/t055_patch.py"
      - ".github/workflows/t055-preflight.yml"

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout validation tools
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ci/t053-obsolete-run-cleanup
          path: tools
          persist-credentials: false
      - name: Checkout exact T055 candidate base
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/003-t055-command-git-observations
          path: target
          persist-credentials: false
      - name: Verify exact target base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = "fc569d9779512860e551a8eea0ca1bf8d95ff30f"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Apply uncommitted T055 patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/.github/t055_patch.py")
          text = path.read_text(encoding="utf-8")

          # Repair the malformed scratch-only migration literal.
          start = text.index("    migration.write_text(\n")
          end = text.index("\n\n    domain = root / \"src/domain.rs\"", start)
          replacement = '''    migration.write_text(
              """CREATE TABLE IF NOT EXISTS shell_command_git_observations (
              execution_id TEXT PRIMARY KEY REFERENCES shell_commands(execution_id),
              before_source TEXT NOT NULL,
              before_head_known INTEGER NOT NULL CHECK (before_head_known IN (0, 1)),
              before_head_oid TEXT,
              before_dirty INTEGER CHECK (before_dirty IS NULL OR before_dirty IN (0, 1)),
              after_source TEXT,
              after_head_known INTEGER NOT NULL DEFAULT 0 CHECK (after_head_known IN (0, 1)),
              after_head_oid TEXT,
              after_dirty INTEGER CHECK (after_dirty IS NULL OR after_dirty IN (0, 1)),
              CHECK (before_head_known = 1 OR before_head_oid IS NULL),
              CHECK (after_head_known = 1 OR after_head_oid IS NULL),
              CHECK (
                  after_source IS NOT NULL
                  OR (after_head_known = 0 AND after_head_oid IS NULL AND after_dirty IS NULL)
              )
          );
          """,
              encoding="utf-8",
          )'''
          text = text[:start] + replacement + text[end:]

          # Scope the top-level command-domain import matcher; the same short import
          # also appears inside the test module and must not be treated as ambiguous.
          old = '''    text = replace_once(
              text,
              "use crate::domain::{ExecutionKind, ExecutionStatus, FactSource};\\n",
              "use crate::domain::{ExecutionKind, ExecutionStatus, FactSource, WorkspaceRecord};\\n",
              "command workspace record import",
          )'''
          new = '''    text = replace_once(
              text,
              "use crate::domain::{ExecutionKind, ExecutionStatus, FactSource};\\nuse crate::git::shell_profiles::ShellExecutionDomain;\\n",
              "use crate::domain::{ExecutionKind, ExecutionStatus, FactSource, WorkspaceRecord};\\nuse crate::git::shell_profiles::ShellExecutionDomain;\\n",
              "command workspace record import",
          )'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one command import helper block, found {text.count(old)}")
          text = text.replace(old, new, 1)

          # Remove a scratch-only no-op guard that targets the test-module import and
          # adds no product behavior or validation value.
          guard = '''    text = replace_once(
              text,
              "    use crate::domain::{ExecutionKind, ExecutionStatus, FactSource};\\n",
              "    use crate::domain::{ExecutionKind, ExecutionStatus, FactSource};\\n",
              "command test domain import guard",
          )
'''
          if text.count(guard) != 1:
              raise SystemExit(f"expected one no-op test import guard, found {text.count(guard)}")
          text = text.replace(guard, "", 1)
          path.write_text(text, encoding="utf-8")
          PY
          python tools/.github/t055_patch.py target
      - name: Verify intended patch surface
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          expected=$(cat <<'EOF'
          migrations/0005_shell_command_git_observations.sql
          src/command.rs
          src/domain.rs
          src/store.rs
          src/workspace.rs
          EOF
          )
          actual=$(git status --short | awk '{print $2}' | sort)
          test "$actual" = "$(printf '%s\n' "$expected" | sort)"
          git diff --check
      - name: Format
        working-directory: target
        run: cargo fmt --all
      - name: Format check
        working-directory: target
        run: cargo fmt --all -- --check
      - name: Compile
        working-directory: target
        run: cargo check --locked --all-targets --all-features
      - name: Clippy
        working-directory: target
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Full tests on Unix
        if: runner.os != 'Windows'
        working-directory: target
        run: cargo test --locked --all-targets --all-features
      - name: Focused command tests on Windows
        if: runner.os == 'Windows'
        working-directory: target
        run: cargo test --locked --bin winds command::tests -- --test-threads=1
      - name: Persistence tests on Windows
        if: runner.os == 'Windows'
        working-directory: target
        run: cargo test --locked --bin winds store::persistence_tests -- --test-threads=1
      - name: Re-verify patch surface after formatting
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          expected=$(cat <<'EOF'
          migrations/0005_shell_command_git_observations.sql
          src/command.rs
          src/domain.rs
          src/store.rs
          src/workspace.rs
          EOF
          )
          actual=$(git status --short | awk '{print $2}' | sort)
          test "$actual" = "$(printf '%s\n' "$expected" | sort)"
          git diff --check
