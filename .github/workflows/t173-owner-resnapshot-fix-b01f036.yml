name: T173 stale-cursor recovery repair b01f036

on:
  push:
    branches:
      - review/t173-owner-resnapshot-fix-b01f036

permissions:
  contents: write

env:
  PARENT_SHA: b01f03630453893048d3d7665dac863bf41b5f7f
  CANDIDATE_BRANCH: repair/t173-owner-resnapshot-candidate

jobs:
  repair-and-qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout executor branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Materialize exact parent and apply one narrow repair
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$PARENT_SHA^{commit}"
          git checkout --detach "$PARENT_SHA"
          test "$(git rev-parse HEAD)" = "$PARENT_SHA"
          python - <<'PY'
          from pathlib import Path
          path = Path('src/persistent_runtime/owner_agent_observation.rs')
          text = path.read_text()
          old = (
              "            if let Some(cursor) = &list.cursor {\n"
              "                if cursor.owner_generation_id != self.generation_id {\n"
              "                    return Err(LocalControlErrorKind::StaleOwnerGeneration);\n"
              "                }\n"
              "                if cursor.snapshot_revision != self.agent_observation_store.snapshot_revision() {\n"
              "                    return Err(LocalControlErrorKind::OutcomeUnknown);\n"
              "                }\n"
              "            }\n"
              "\n"
          )
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one stale-cursor precheck, found {count}')
          path.write_text(text.replace(old, '', 1))
          PY
          test "$(git diff --name-only)" = "src/persistent_runtime/owner_agent_observation.rs"
          git diff --check

      - name: Qualify repair
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --lib t173_

      - name: Commit and publish candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Winds qualification bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/persistent_runtime/owner_agent_observation.rs
          git commit -m "fix: preserve T173 stale-cursor resnapshot recovery"
          test "$(git rev-list --count "$PARENT_SHA..HEAD")" = "1"
          test "$(git diff --name-only "$PARENT_SHA" HEAD)" = "src/persistent_runtime/owner_agent_observation.rs"
          git push origin "HEAD:refs/heads/$CANDIDATE_BRANCH" --force-with-lease
          git rev-parse HEAD | tee candidate-sha.txt

      - name: Upload candidate identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t173-owner-resnapshot-candidate
          path: candidate-sha.txt
          retention-days: 14
