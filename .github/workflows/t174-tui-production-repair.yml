name: T174 TUI production repair

on:
  push:
    branches:
      - repair/t174-tui-production-43ec415
    paths:
      - ".github/workflows/t174-tui-production-repair.yml"
      - ".github/t174_tui_repair.py"

permissions:
  contents: write

env:
  TARGET_BRANCH: impl/spec-012-t174-agent-dock
  EXPECTED_TARGET_HEAD: 43ec415e7e5640da67ced07686095de418d70ed8

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repair executor
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Preserve repair patcher and checkout exact T174 target head
        shell: bash
        run: |
          set -euo pipefail
          cp .github/t174_tui_repair.py "$RUNNER_TEMP/t174_tui_repair.py"
          sed -i 's/if text.count(old) != 2:/if text.count(old) < 1:/' "$RUNNER_TEMP/t174_tui_repair.py"
          git fetch --no-tags origin "refs/heads/${TARGET_BRANCH}"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_TARGET_HEAD"
          git checkout --detach "$EXPECTED_TARGET_HEAD"

      - name: Apply minimum production TUI Agent Dock integration
        run: python "$RUNNER_TEMP/t174_tui_repair.py"

      - name: Repair compile-only T174 integration details
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/workbench.rs")
          text = path.read_text(encoding="utf-8")

          old_format = "topology_generation={} · READ_ONLY"
          new_format = "topology_generation={:?} · READ_ONLY"
          if text.count(old_format) != 1:
              raise SystemExit(f"expected one topology-generation format target, found {text.count(old_format)}")
          text = text.replace(old_format, new_format, 1)

          old_call = "                    projected_context.as_ref(),\n                    navigation.canonical_topology_presentation(),\n                )"
          new_call = "                    projected_context.as_ref(),\n                    navigation.canonical_topology_presentation(),\n                    agent_dock.as_ref(),\n                    &mut agent_dock_ui,\n                )"
          if text.count(old_call) != 1:
              raise SystemExit(f"expected one nested render-call target, found {text.count(old_call)}")
          text = text.replace(old_call, new_call, 1)

          pointer_deref = "let Some(dock) = dock.as_deref_mut() else {"
          occurrences = [index for index in range(len(text)) if text.startswith(pointer_deref, index)]
          if not occurrences:
              raise SystemExit("expected at least one mutable dock borrow target")
          last = occurrences[-1]
          text = text[:last] + "let Some(dock) = dock else {" + text[last + len(pointer_deref):]

          path.write_text(text, encoding="utf-8")
          PY

      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all

      - name: Focused T174 tests
        run: cargo test --locked --bin winds t174_ -- --test-threads=1 --nocapture

      - name: Clippy
        run: cargo clippy --locked --bin winds --tests -- -D warnings

      - name: Commit product-only repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | tr '\n' ' ')" = "src/workbench.rs "
          git config user.name "Winds qualification bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/workbench.rs
          git commit -m "feat: integrate T174 Agent Dock into production TUI"
          git push origin "HEAD:${TARGET_BRANCH}"
