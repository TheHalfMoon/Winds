name: T083 exact rustfmt relay

on:
  push:
    branches:
      - impl/006-t083-candidate-evidence
    paths:
      - .github/workflows/t083-rustfmt-relay.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact relay head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Apply exact formatter
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          changed="$(git diff --name-only)"
          test "$changed" = "src/store.rs"
      - name: Commit exact repaired head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin impl/006-t083-candidate-evidence
          test "$(git rev-parse origin/impl/006-t083-candidate-evidence)" = "$GITHUB_SHA"
          git rm .github/workflows/t083-rustfmt-relay.yml
          git add src/store.rs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(006): apply canonical rustfmt to T083 store binding'
          git push origin HEAD:impl/006-t083-candidate-evidence
