name: T174 builder

on:
  push:
    branches: [impl/spec-012-t174-agent-dock]
    paths:
      - ".github/workflows/t174-builder.yml"

permissions:
  contents: write

env:
  TARGET_BRANCH: impl/spec-012-t174-agent-dock

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout T174 branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}
      - name: Install exact Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install exact npm
        run: |
          npm install --global npm@10.9.8
          test "$(npm --version)" = "10.9.8"
      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Repair known T174 builder patch defects
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/t174_patch.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'use crate::multiplexer::protocol::{': 'use crate::persistent_runtime::protocol::{',
              'Result<Self, String>': 'std::result::Result<Self, String>',
              'Result<(), String>': 'std::result::Result<(), String>',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected T174 repair target: {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')

          test_path = Path('src/t174_agent_dock_tests.rs')
          test_text = test_path.read_text(encoding='utf-8')
          old = 'let recent = dock.list("", CanonicalAgentDockSort::Recent, true);'
          new = 'let recent = dock.list("", CanonicalAgentDockSort::Recent, false);'
          if test_text.count(old) != 1:
              raise SystemExit('missing unique T174 ungrouped recent-sort qualification target')
          test_path.write_text(test_text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply T174 bridge and TUI projection patch
        run: python .github/t174_patch.py
      - name: Repair generated T174 Clippy conditional
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/workbench_ui.rs')
          text = path.read_text(encoding='utf-8')
          marker = 'let group_order = group_by_workspace'
          if text.count(marker) != 1:
              raise SystemExit(f'expected one generated T174 group-order marker, found {text.count(marker)}')
          start = text.index(marker)
          end = text.index(';', start) + 1
          old = text[start:end]
          if '.then' not in old or 'Ordering::Equal' not in old:
              raise SystemExit(f'unexpected generated group-order span: {old!r}')
          replacement = '''let group_order = if group_by_workspace {
                left.multiplexer_workspace_id
                    .cmp(&right.multiplexer_workspace_id)
            } else {
                std::cmp::Ordering::Equal
            };'''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY
      - name: Repair T174 Desktop snapshot consumers and visible exact binding
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path_name}: expected one repair target {old!r}, found {text.count(old)}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          types_path = Path('desktop/src/leftDock/types.ts')
          types_text = types_path.read_text(encoding='utf-8')
          bridge_snapshot = '''export interface BridgeSnapshot {
            readonly projects: readonly BridgeProject[];
            readonly agentDock: BridgeAgentDockSnapshot;
          }'''
          if 'UNAVAILABLE_AGENT_DOCK_SNAPSHOT' not in types_text:
              if types_text.count(bridge_snapshot) != 1:
                  raise SystemExit('desktop/src/leftDock/types.ts: generated BridgeSnapshot target not unique')
              constant = '''export const UNAVAILABLE_AGENT_DOCK_SNAPSHOT: BridgeAgentDockSnapshot = {
            authority: "OWNER_AUTHORITATIVE_AGENT_OBSERVATIONS",
            availability: "UNAVAILABLE",
            observations: [],
            detectionOnly: true,
            unavailableReason: "SNAPSHOT_NOT_LOADED",
          };

          '''
              types_path.write_text(types_text.replace(bridge_snapshot, constant + bridge_snapshot, 1), encoding='utf-8')

          replace_once(
              'desktop/src/leftDock/LeftDock.tsx',
              'import type { BridgeProject, BridgeSessionSummary, BridgeSnapshot, LeftDockBridge } from "./types";',
              'import { UNAVAILABLE_AGENT_DOCK_SNAPSHOT } from "./types";\nimport type { BridgeProject, BridgeSessionSummary, BridgeSnapshot, LeftDockBridge } from "./types";',
          )
          replace_once(
              'desktop/src/leftDock/LeftDock.tsx',
              '''const emptySnapshot: BridgeSnapshot = {
            projects: [],
            agentDock: {
              authority: "OWNER_AUTHORITATIVE_AGENT_OBSERVATIONS",
              availability: "UNAVAILABLE",
              observations: [],
              detectionOnly: true,
              unavailableReason: "SNAPSHOT_NOT_LOADED",
            },
          };''',
              'const emptySnapshot: BridgeSnapshot = { projects: [], agentDock: UNAVAILABLE_AGENT_DOCK_SNAPSHOT };',
          )
          replace_once(
              'desktop/src/commandPalette/CommandPalette.tsx',
              'import type { BridgeSnapshot } from "../leftDock/types";',
              'import { UNAVAILABLE_AGENT_DOCK_SNAPSHOT, type BridgeSnapshot } from "../leftDock/types";',
          )
          replace_once(
              'desktop/src/commandPalette/CommandPalette.tsx',
              'const emptySnapshot: BridgeSnapshot = { projects: [] };',
              'const emptySnapshot: BridgeSnapshot = { projects: [], agentDock: UNAVAILABLE_AGENT_DOCK_SNAPSHOT };',
          )
          replace_once(
              'desktop/src/leftDock/ChatToolWindow.tsx',
              'import type { BridgeProject, BridgeSnapshot } from "./types";',
              'import { UNAVAILABLE_AGENT_DOCK_SNAPSHOT, type BridgeProject, type BridgeSnapshot } from "./types";',
          )
          replace_once(
              'desktop/src/leftDock/ChatToolWindow.tsx',
              'const emptySnapshot: BridgeSnapshot = { projects: [] };',
              'const emptySnapshot: BridgeSnapshot = { projects: [], agentDock: UNAVAILABLE_AGENT_DOCK_SNAPSHOT };',
          )
          replace_once(
              'desktop/src/agentDock/AgentDock.tsx',
              'pane {compactId(observation.paneId)} · obs {compactId(observation.observationId)}',
              'ws {compactId(observation.multiplexerWorkspaceId)} · pane {compactId(observation.paneId)} · obs {compactId(observation.observationId)}',
          )
          PY
      - name: Format Rust
        run: cargo fmt --all
      - name: Qualify focused T174 Rust tests
        run: cargo test --locked --bin winds t174_ -- --test-threads=1 --nocapture
      - name: Rust clippy
        run: cargo clippy --locked --bin winds --tests -- -D warnings
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci --ignore-scripts
      - name: Desktop format, typecheck, tests, and build
        working-directory: desktop
        run: |
          npm run format:check
          npm run typecheck
          npm run lint
          npm test
          npm run frontend:build
      - name: Commit qualified implementation patch
        shell: bash
        run: |
          git diff --check
          git config user.name "Winds qualification bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/desktop.rs src/workbench_ui.rs src/t174_agent_dock_tests.rs desktop/src/leftDock/types.ts desktop/src/leftDock/fixture.ts desktop/src/leftDock/LeftDock.tsx desktop/src/leftDock/ChatToolWindow.tsx desktop/src/commandPalette/CommandPalette.tsx desktop/src/agentDock/AgentDock.tsx
          if git diff --cached --quiet; then
            echo "No implementation patch to commit"
            exit 1
          fi
          git commit -m "feat: implement T174 exact-identity agent presentation"
          git push origin "HEAD:${TARGET_BRANCH}"
