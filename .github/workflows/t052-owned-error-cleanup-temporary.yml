name: t052-owned-error-cleanup-temporary

on:
  push:
    branches: [feat/003-t052-wsl-launch]
    paths:
      - ".github/workflows/t052-owned-error-cleanup-temporary.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Make post-spawn helper failures clean up owned launcher
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/wsl_launch.rs')
          text = path.read_text(encoding='utf-8')

          old_import = '    use std::process::{ChildStderr, ChildStdout, Command, Stdio};\n'
          new_import = '    use std::process::{Child, ChildStderr, ChildStdout, Command, Stdio};\n'
          if text.count(old_import) != 1:
              raise SystemExit(f'process import count={text.count(old_import)}')
          text = text.replace(old_import, new_import, 1)

          marker = '''    fn truncation_suffix(stdout_truncated: bool, stderr_truncated: bool) -> &'static str {
              match (stdout_truncated, stderr_truncated) {
                  (true, true) => " [stdout truncated] [stderr truncated]",
                  (true, false) => " [stdout truncated]",
                  (false, true) => " [stderr truncated]",
                  (false, false) => "",
              }
          }

          let mut process = Command::new(launcher);
          '''
          replacement = '''    fn truncation_suffix(stdout_truncated: bool, stderr_truncated: bool) -> &'static str {
              match (stdout_truncated, stderr_truncated) {
                  (true, true) => " [stdout truncated] [stderr truncated]",
                  (true, false) => " [stdout truncated]",
                  (false, true) => " [stderr truncated]",
                  (false, false) => "",
              }
          }

          fn cleanup_owned_launcher(child: &mut Child) -> String {
              match child.try_wait() {
                  Ok(Some(_)) => "Windows WSL launcher had already exited".to_owned(),
                  Ok(None) | Err(_) => match child.kill() {
                      Ok(()) => match child.wait() {
                          Ok(_) => "Windows WSL launcher process terminated".to_owned(),
                          Err(error) => format!(
                              "Windows WSL launcher termination wait could not be proven: {error}"
                          ),
                      },
                      Err(kill_error) => match child.try_wait() {
                          Ok(Some(_)) => "Windows WSL launcher had already exited".to_owned(),
                          Ok(None) => format!(
                              "Windows WSL launcher termination could not be proven: {kill_error}"
                          ),
                          Err(wait_error) => format!(
                              "Windows WSL launcher termination could not be proven: {kill_error}; status check failed: {wait_error}"
                          ),
                      },
                  },
              }
          }

          fn fail_owned_launcher(
              child: &mut Child,
              reason: impl std::fmt::Display,
          ) -> Result<Vec<u8>> {
              let cleanup = cleanup_owned_launcher(child);
              Err(format!("{reason}; {cleanup}").into())
          }

          let mut process = Command::new(launcher);
          '''
          if text.count(marker) != 1:
              raise SystemExit(f'helper insertion marker count={text.count(marker)}')
          text = text.replace(marker, replacement, 1)

          old_pipes = '''    let mut stdout = child
              .stdout
              .take()
              .ok_or("failed to capture WSL command stdout")?;
          let mut stderr = child
              .stderr
              .take()
              .ok_or("failed to capture WSL command stderr")?;
          '''
          new_pipes = '''    let mut stdout = match child.stdout.take() {
              Some(stdout) => stdout,
              None => {
                  return fail_owned_launcher(&mut child, "failed to capture WSL command stdout");
              }
          };
          let mut stderr = match child.stderr.take() {
              Some(stderr) => stderr,
              None => {
                  return fail_owned_launcher(&mut child, "failed to capture WSL command stderr");
              }
          };
          '''
          if text.count(old_pipes) != 1:
              raise SystemExit(f'pipe capture block count={text.count(old_pipes)}')
          text = text.replace(old_pipes, new_pipes, 1)

          old_loop = '''        let progressed = drain_pair(
              &mut stdout,
              &mut stderr,
              &mut stdout_bytes,
              &mut stderr_bytes,
              &mut stdout_truncated,
              &mut stderr_truncated,
          )?;
          if let Some(status) = child.try_wait()? {
              while drain_pair(
                  &mut stdout,
                  &mut stderr,
                  &mut stdout_bytes,
                  &mut stderr_bytes,
                  &mut stdout_truncated,
                  &mut stderr_truncated,
              )? {}
              break status;
          }
          if started.elapsed() >= TIMEOUT {
              let cleanup = match child.kill() {
                  Ok(()) => match child.wait() {
                      Ok(_) => "Windows WSL launcher process terminated".to_owned(),
                      Err(error) => format!(
                          "Windows WSL launcher termination wait could not be proven: {error}"
                      ),
                  },
                  Err(kill_error) => match child.try_wait() {
                      Ok(Some(_)) => "Windows WSL launcher had already exited".to_owned(),
                      Ok(None) => format!(
                          "Windows WSL launcher termination could not be proven: {kill_error}"
                      ),
                      Err(wait_error) => format!(
                          "Windows WSL launcher termination could not be proven: {kill_error}; status check failed: {wait_error}"
                      ),
                  },
              };
              return Err(format!(
                  "selected WSL command exceeded the 30 second safety timeout; {cleanup}"
              )
              .into());
          }
          '''
          new_loop = '''        let progressed = match drain_pair(
              &mut stdout,
              &mut stderr,
              &mut stdout_bytes,
              &mut stderr_bytes,
              &mut stdout_truncated,
              &mut stderr_truncated,
          ) {
              Ok(progressed) => progressed,
              Err(error) => {
                  return fail_owned_launcher(
                      &mut child,
                      format!("failed reading selected WSL command output: {error}"),
                  );
              }
          };
          let observed_exit = match child.try_wait() {
              Ok(observed_exit) => observed_exit,
              Err(error) => {
                  return fail_owned_launcher(
                      &mut child,
                      format!("failed observing selected WSL command exit: {error}"),
                  );
              }
          };
          if let Some(status) = observed_exit {
              while drain_pair(
                  &mut stdout,
                  &mut stderr,
                  &mut stdout_bytes,
                  &mut stderr_bytes,
                  &mut stdout_truncated,
                  &mut stderr_truncated,
              )
              .map_err(|error| format!(
                  "failed draining selected WSL command output after observed exit: {error}"
              ))? {}
              break status;
          }
          if started.elapsed() >= TIMEOUT {
              return fail_owned_launcher(
                  &mut child,
                  "selected WSL command exceeded the 30 second safety timeout",
              );
          }
          '''
          if text.count(old_loop) != 1:
              raise SystemExit(f'run loop block count={text.count(old_loop)}')
          text = text.replace(old_loop, new_loop, 1)

          path.write_text(text, encoding='utf-8')

      - name: Validate on official Windows runner
        shell: pwsh
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --locked --all-targets --all-features
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --bin winds terminal::windows_tests -- --test-threads=1
          cargo test --locked --bin winds wsl_launch::tests -- --test-threads=1
          git diff --check
          $changed = @(git diff --name-only)
          if ($changed.Count -ne 1 -or $changed[0] -ne "src/wsl_launch.rs") {
            throw "unexpected changed paths: $($changed -join ', ')"
          }
      - name: Commit cleanup repair
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/wsl_launch.rs
          git diff --cached --check
          git commit -m "fix(winds): clean up WSL helper on owned errors"
          git push origin "HEAD:$env:GITHUB_REF_NAME"
