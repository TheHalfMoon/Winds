name: t051-windows-discovery-temporary

on:
  push:
    branches: [feat/003-t051-windows-conpty]

permissions:
  contents: read

jobs:
  discover:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Report exact Windows baseline compile blockers
        shell: pwsh
        run: |
          rustc -Vv
          cargo -V
          cargo check --locked --all-targets
