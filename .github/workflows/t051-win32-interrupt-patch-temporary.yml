name: t051-win32-interrupt-patch-temporary

on:
  push:
    branches: [feat/003-t051-windows-conpty]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - name: Encode Ctrl+C as ConPTY Win32 input events
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/terminal.rs')
          text = path.read_text(encoding='utf-8')
          old = '''    #[cfg(windows)]\n    fn interrupt_platform(&mut self) -> Result<()> {\n        let writer = self\n            .writer\n            .as_mut()\n            .ok_or("terminal session input is already closed")?;\n        writer.write_all(&[0x03])?;\n        writer.flush()?;\n        Ok(())\n    }'''
          new = '''    #[cfg(windows)]\n    fn interrupt_platform(&mut self) -> Result<()> {\n        let writer = self\n            .writer\n            .as_mut()\n            .ok_or("terminal session input is already closed")?;\n\n        // ConPTY keeps Win32 Input Mode enabled. Microsoft Terminal serializes a\n        // KEY_EVENT_RECORD losslessly as: CSI Vk;Sc;Uc;Kd;Cs;Rc _. Represent\n        // Ctrl+C as a C key down/up pair with Unicode ETX and LEFT_CTRL_PRESSED.\n        // The scan code is intentionally zero: W32IM defines omitted/zero Sc as\n        // valid, avoiding keyboard-layout assumptions and any global console signal.\n        const CTRL_C_KEY_DOWN: &[u8] = b"\\x1b[67;0;3;1;8;1_";\n        const CTRL_C_KEY_UP: &[u8] = b"\\x1b[67;0;3;0;8;1_";\n        writer.write_all(CTRL_C_KEY_DOWN)?;\n        writer.write_all(CTRL_C_KEY_UP)?;\n        writer.flush()?;\n        Ok(())\n    }'''
          if text.count(old) != 1:
              raise SystemExit(f'Windows interrupt block count={text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit interrupt repair
        shell: bash
        run: |
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/terminal.rs
          git diff --cached --check
          git commit -m "fix(winds): encode native Windows interrupt as Win32 input"
          git push origin "HEAD:$GITHUB_REF_NAME"
