name: t087-lock-generation

on:
  push:
    branches: [impl/007-t087-workbench-deps]
  workflow_dispatch:

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.sha }}

jobs:
  generate-lock-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Verify checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Generate Cargo lockfile
        shell: bash
        run: cargo generate-lockfile
      - name: Emit deterministic T087 dependency evidence
        shell: bash
        run: |
          set -euo pipefail
          echo '===T087_CARGO_LOCK_SHA256_BEGIN==='
          sha256sum Cargo.lock
          echo '===T087_CARGO_LOCK_SHA256_END==='
          echo '===T087_CARGO_TREE_FEATURES_BEGIN==='
          cargo tree --locked -e features
          echo '===T087_CARGO_TREE_FEATURES_END==='
          cargo metadata --locked --format-version 1 > /tmp/t087-metadata.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/t087-metadata.json').read_text())
          resolve_ids = set()
          stack = [data['resolve']['root']]
          nodes = {node['id']: node for node in data['resolve']['nodes']}
          while stack:
              current = stack.pop()
              if current in resolve_ids:
                  continue
              resolve_ids.add(current)
              stack.extend(dep['pkg'] for dep in nodes[current]['deps'])

          packages = [pkg for pkg in data['packages'] if pkg['id'] in resolve_ids]
          packages.sort(key=lambda pkg: (pkg['name'], pkg['version'], pkg.get('source') or ''))

          print('===T087_METADATA_SUMMARY_BEGIN===')
          for pkg in packages:
              print('|'.join([
                  pkg['name'],
                  pkg['version'],
                  pkg.get('source') or 'LOCAL',
                  pkg.get('license') or 'UNKNOWN',
                  pkg.get('rust_version') or 'UNKNOWN',
              ]))
          print('===T087_METADATA_SUMMARY_END===')
          PY
          echo '===T087_CARGO_LOCK_BEGIN==='
          cat Cargo.lock
          echo '===T087_CARGO_LOCK_END==='
