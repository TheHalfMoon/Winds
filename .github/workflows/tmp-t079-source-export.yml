name: tmp-t079-source-export

on:
  push:
    branches:
      - tmp/t079-exact-source-export-4e4731d

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact temporary export head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Record source identity
        shell: bash
        run: git rev-parse HEAD > SOURCE_SHA.txt
      - name: Upload exact Rust source snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: t079-exact-source-${{ github.sha }}
          if-no-files-found: error
          include-hidden-files: false
          path: |
            SOURCE_SHA.txt
            Cargo.toml
            Cargo.lock
            src
            migrations
