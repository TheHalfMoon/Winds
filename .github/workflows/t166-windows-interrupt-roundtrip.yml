name: t166-windows-interrupt-roundtrip

on:
  push:
    branches:
      - probe/t166-windows-interrupt-roundtrip
    paths:
      - .github/workflows/t166-windows-interrupt-roundtrip.yml

permissions:
  contents: write

jobs:
  repair-and-qualify:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: a9269ced1ab38072d2af1b36a529d534936b4ecd
      TARGET_BRANCH: impl/spec-012-t166-protocol-v2
    steps:
      - name: Checkout exact T166 candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0

      - name: Guard live target head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD"

      - name: Apply typed unsupported-platform round-trip repair
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          owner = Path("src/persistent_runtime/owner.rs")
          text = owner.read_text(encoding="utf-8")
          old = '''        OwnerError::Runtime(message) => {
                      if message.contains("unknown") {
                          LocalControlErrorKind::UnknownRuntime
                      } else if message.contains("active controller") {
                          LocalControlErrorKind::ControllerConflict
                      } else if message.contains("slow-client") || message.contains("backpressure") {
                          LocalControlErrorKind::SlowClientBackpressure
                      } else {
                          LocalControlErrorKind::OutcomeUnknown
                      }
                  }
          '''
          new = '''        OwnerError::Runtime(message) => {
                      if message.contains("unknown") {
                          LocalControlErrorKind::UnknownRuntime
                      } else if message.contains("active controller") {
                          LocalControlErrorKind::ControllerConflict
                      } else if message.contains("interrupt is unsupported on native Windows") {
                          LocalControlErrorKind::UnsupportedPlatform
                      } else if message.contains("slow-client") || message.contains("backpressure") {
                          LocalControlErrorKind::SlowClientBackpressure
                      } else {
                          LocalControlErrorKind::OutcomeUnknown
                      }
                  }
          '''
          if text.count(old) != 1:
              raise SystemExit(f"owner mapping target count={text.count(old)}")
          owner.write_text(text.replace(old, new), encoding="utf-8")

          tests = Path("src/t166_multiplexer_protocol_v2_tests.rs")
          text = tests.read_text(encoding="utf-8")
          old_import = '''    use crate::persistent_runtime::client::{
                  ClientResponseProjection, ResolvedRuntimeTarget, RustLocalControlClient,
              };
          '''
          new_import = '''    use crate::persistent_runtime::client::{
                  ClientResponseProjection, LocalControlClientError, ResolvedRuntimeTarget,
                  RustLocalControlClient,
              };
          '''
          if text.count(old_import) != 1:
              raise SystemExit(f"client import target count={text.count(old_import)}")
          text = text.replace(old_import, new_import)

          old_interrupt = '''            // Spec 011 deliberately keeps native-Windows interrupt unsupported and
                      // fail-closed. T152 qualifies that platform contract directly, so this
                      // real-endpoint integration must not require a successful Windows interrupt.
                      #[cfg(not(windows))]
                      assert!(matches!(
                          client.interrupt(target).unwrap(),
                          ClientResponseProjection::ControlState {
                              authority: ClientAuthority::Controller,
                              ..
                          }
                      ));
          '''
          new_interrupt = '''            // Spec 011 deliberately keeps native-Windows interrupt unsupported and
                      // fail-closed. T166 must still prove that operation round-trips through the
                      // real v2 endpoint as a known platform result without poisoning the session.
                      #[cfg(windows)]
                      assert_eq!(
                          client.interrupt(target).unwrap_err(),
                          LocalControlClientError::Protocol(LocalControlErrorKind::UnsupportedPlatform)
                      );
                      #[cfg(not(windows))]
                      assert!(matches!(
                          client.interrupt(target).unwrap(),
                          ClientResponseProjection::ControlState {
                              authority: ClientAuthority::Controller,
                              ..
                          }
                      ));
          '''
          if text.count(old_interrupt) != 1:
              raise SystemExit(f"interrupt test target count={text.count(old_interrupt)}")
          tests.write_text(text.replace(old_interrupt, new_interrupt), encoding="utf-8")
          '@ | python -

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Format and run exact Windows contract tests
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --bin winds persistent_runtime::client::t166_multiplexer_protocol_v2_tests::real_endpoint_tests::t166_real_private_endpoint_preserves_spec011_and_v2_then_allows_next_client -- --exact --test-threads=1 --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --bin winds persistent_runtime::owner::t152_persistent_terminal_tests::t152_native_windows_interrupt_remains_explicitly_fail_closed -- --exact --test-threads=1 --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit repair only after exact tests pass
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD"
          git config user.name "Winds Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/persistent_runtime/owner.rs src/t166_multiplexer_protocol_v2_tests.rs
          test "$(git diff --cached --name-only | sort)" = $'src/persistent_runtime/owner.rs\nsrc/t166_multiplexer_protocol_v2_tests.rs'
          git commit -m "fix(t166): round-trip Windows interrupt as unsupported platform"
          git push origin HEAD:"$TARGET_BRANCH"
