      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Format and qualify repair locally
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked t171 -- --test-threads=1

      - name: Commit and fast-forward target branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Winds T171 Repair"
          git config user.email "actions@users.noreply.github.com"
          git add src/workbench_terminal_ux.rs src/workbench_screen.rs src/workbench_ui.rs src/t171_terminal_ux_tests.rs
          git commit -m "T171: bind bounded UX to exact pane identity"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_HEAD"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          echo "REPAIRED_HEAD=$(git rev-parse HEAD)"
          echo "REPAIRED_TREE=$(git rev-parse HEAD^{tree})"
