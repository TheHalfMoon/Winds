name: t051-ctrl-break-patch-temporary

on:
  push:
    branches: [feat/003-t051-windows-conpty]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - name: Use ownership-local ConPTY Ctrl+Break for Windows interrupt
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/terminal.rs')
          text = path.read_text(encoding='utf-8')
          old = '''        // ConPTY keeps Win32 Input Mode enabled. Microsoft Terminal serializes a\n        // KEY_EVENT_RECORD losslessly as: CSI Vk;Sc;Uc;Kd;Cs;Rc _. A Ctrl+key\n        // chord is four records: Ctrl down, key down, key up, Ctrl up. Encode\n        // Ctrl+C entirely through this session's ConPTY input pipe, avoiding the\n        // process-global semantics of GenerateConsoleCtrlEvent(CTRL_C_EVENT).\n        const CTRL_DOWN: &[u8] = b"\\x1b[17;29;0;1;8;1_";\n        const C_DOWN: &[u8] = b"\\x1b[67;46;3;1;8;1_";\n        const C_UP: &[u8] = b"\\x1b[67;46;3;0;8;1_";\n        const CTRL_UP: &[u8] = b"\\x1b[17;29;0;0;0;1_";\n        writer.write_all(CTRL_DOWN)?;\n        writer.write_all(C_DOWN)?;\n        writer.write_all(C_UP)?;\n        writer.write_all(CTRL_UP)?;\n'''
          new = '''        // ConPTY parses Win32 Input Mode sequences into KEY_EVENT_RECORD values.\n        // Ctrl+C is conditional on ENABLE_PROCESSED_INPUT in conhost, but the\n        // host handles VK_CANCEL (Ctrl+Break) as CTRL_BREAK_EVENT regardless of\n        // that mode. Use that ownership-local interrupt primitive rather than\n        // process-global GenerateConsoleCtrlEvent semantics. Scan/Unicode values\n        // are not consulted by conhost's VK_CANCEL branch.\n        const CTRL_BREAK_DOWN: &[u8] = b"\\x1b[3;0;0;1;8;1_";\n        const CTRL_BREAK_UP: &[u8] = b"\\x1b[3;0;0;0;8;1_";\n        writer.write_all(CTRL_BREAK_DOWN)?;\n        writer.write_all(CTRL_BREAK_UP)?;\n'''
          if text.count(old) != 1:
              raise SystemExit(f'current Windows interrupt block count={text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit interrupt repair
        shell: bash
        run: |
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/terminal.rs
          git diff --cached --check
          git commit -m "fix(winds): use ConPTY-local Ctrl+Break for Windows interrupt"
          git push origin "HEAD:$GITHUB_REF_NAME"
