name: T173 Alibaba OCR Exact Head 9340739

on:
  push:
    branches:
      - review/t173-ocr-9340739

permissions:
  contents: read

env:
  BASE_SHA: ca7b99afda7135fef0b9a3c54783784001286bf5
  HEAD_SHA: 93407399e588ffa62006725de1f2dedad244a305
  HEAD_BRANCH: impl/spec-012-t173-agent-observation
  OCR_VERSION: 1.12.9

jobs:
  ocr-review:
    name: Alibaba Open Code Review
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout review executor branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact candidate and base
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$BASE_SHA^{commit}"
          git fetch --no-tags origin "refs/heads/$HEAD_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"
          git cat-file -e "$HEAD_SHA^{commit}"
          test "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" = "$BASE_SHA"
          test "$(git rev-list --count "$BASE_SHA..$HEAD_SHA")" = "21"
          test "$(git rev-list --count "$HEAD_SHA..$BASE_SHA")" = "0"
          git diff --check "$BASE_SHA" "$HEAD_SHA"
          test "$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | wc -l)" = "7"
          test "$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort | tr '\n' ' ')" = "src/multiplexer/agent_projection.rs src/multiplexer/agent_state.rs src/multiplexer/mod.rs src/persistent_runtime/client.rs src/persistent_runtime/owner.rs src/persistent_runtime/owner_agent_observation.rs src/t173_agent_observation_tests.rs "
          test "$(git rev-parse HEAD)" != "$HEAD_SHA"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Install exact Alibaba Open Code Review
        shell: bash
        run: |
          set -euo pipefail
          npm install -g "@alibaba-group/open-code-review@$OCR_VERSION"
          ocr version | tee ocr-version.txt
          grep -F "$OCR_VERSION" ocr-version.txt

      - name: Review exact T173 range
        shell: bash
        run: |
          set -euo pipefail
          ocr delegate preview --format json --from "$BASE_SHA" --to "$HEAD_SHA" | tee ocr-preview.json

      - name: Resolve rules for every changed path
        shell: bash
        run: |
          set -euo pipefail
          ocr delegate rule --format json \
            src/multiplexer/agent_projection.rs \
            src/multiplexer/agent_state.rs \
            src/multiplexer/mod.rs \
            src/persistent_runtime/client.rs \
            src/persistent_runtime/owner.rs \
            src/persistent_runtime/owner_agent_observation.rs \
            src/t173_agent_observation_tests.rs | tee ocr-rules.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: t173-alibaba-ocr-9340739
          path: |
            ocr-version.txt
            ocr-preview.json
            ocr-rules.json
          if-no-files-found: warn
          retention-days: 14
