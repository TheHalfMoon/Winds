name: t053-obsolete-run-cleanup

on:
  push:
    branches: [ci/t053-obsolete-run-cleanup]
    paths:
      - ".github/workflows/t053-obsolete-run-cleanup.yml"

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel obsolete active T053 feature-branch runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json
          import urllib.parse
          import urllib.request
          import urllib.error
          import os

          repo = os.environ["GITHUB_REPOSITORY"]
          target_branch = "feat/003-t053-terminal-ledger"
          preserve = {31970328446, 31970328428, 31970328445}
          active = {"queued", "in_progress", "waiting", "pending", "requested"}
          token = os.environ["GH_TOKEN"]

          query = urllib.parse.urlencode({"branch": target_branch, "per_page": 100})
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/runs?{query}",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)

          targets = [
              run for run in payload.get("workflow_runs", [])
              if run.get("id") not in preserve and run.get("status") in active
          ]
          print(f"preserving final exact-head runs {sorted(preserve)}")
          print(f"cancelling {len(targets)} obsolete active run(s)")
          for run in targets:
              cancel = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/runs/{run['id']}/cancel",
                  method="POST",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(cancel, timeout=30) as response:
                      if response.status != 202:
                          raise SystemExit(
                              f"unexpected cancellation status {response.status} for run {run['id']}"
                          )
                  print(f"cancelled {run['id']} {run.get('name')} {run.get('head_sha')}")
              except urllib.error.HTTPError as error:
                  if error.code != 409:
                      raise
                  print(f"run {run['id']} completed before cancellation")
