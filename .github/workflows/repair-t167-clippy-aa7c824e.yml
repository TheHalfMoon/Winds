name: Repair T167 Clippy Blockers aa7c824e

on:
  push:
    branches:
      - repair/t167-clippy-aa7c824e

permissions:
  contents: write

env:
  EXPECTED_HEAD: aa7c824e711c8aba65524386389dd19c2c177d9a
  TARGET_BRANCH: impl/spec-012-t167-topology-projection

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout target branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Guard exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Apply bounded T167 repair
        shell: python
        run: |
          from pathlib import Path

          projection = Path("src/multiplexer/projection.rs")
          text = projection.read_text()
          text = text.replace(
              "use crate::multiplexer::domain::{MultiplexerWorkspaceId, TopologyGeneration};",
              "use crate::multiplexer::domain::{\n    MultiplexerErrorKind, MultiplexerWorkspaceId, TopologyGeneration,\n};",
          )
          marker = "pub(crate) enum TopologyProjectionFreshness {\n    Unsubscribed,\n    NeedsSnapshot,\n    Current,\n    NeedsResubscribe,\n}\n"
          replacement = marker + "\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub(crate) enum TopologyProjectionError {\n    Protocol(LocalControlErrorKind),\n    Multiplexer(MultiplexerErrorKind),\n}\n"
          assert marker in text
          text = text.replace(marker, replacement, 1)
          text = text.replace("Result<TopologyGeneration, LocalControlErrorKind>", "Result<TopologyGeneration, TopologyProjectionError>")
          text = text.replace("Result<(), LocalControlErrorKind>", "Result<(), TopologyProjectionError>")
          text = text.replace("Err(LocalControlErrorKind::UnsupportedOperation)", "Err(TopologyProjectionError::Protocol(\n                LocalControlErrorKind::UnsupportedOperation,\n            ))")
          text = text.replace("Err(LocalControlErrorKind::MalformedFrame)", "Err(TopologyProjectionError::Protocol(\n                LocalControlErrorKind::MalformedFrame,\n            ))")
          text = text.replace("Err(LocalControlErrorKind::StaleTopologyGeneration)", "Err(TopologyProjectionError::Multiplexer(\n                MultiplexerErrorKind::StaleTopologyGeneration,\n            ))")
          text = text.replace(".ok_or(LocalControlErrorKind::UnsupportedOperation)?", ".ok_or(TopologyProjectionError::Protocol(\n                LocalControlErrorKind::UnsupportedOperation,\n            ))?")
          text = text.replace(".ok_or(LocalControlErrorKind::MalformedFrame)?", ".ok_or(TopologyProjectionError::Protocol(\n                LocalControlErrorKind::MalformedFrame,\n            ))?")
          text = text.replace(".map_err(|_| LocalControlErrorKind::MalformedFrame)?", ".map_err(|_| {\n                    TopologyProjectionError::Protocol(LocalControlErrorKind::MalformedFrame)\n                })?")
          projection.write_text(text)

          client = Path("src/persistent_runtime/client.rs")
          text = client.read_text()
          text = text.replace(
              "use topology_projection::TopologyProjection;",
              "use topology_projection::{TopologyProjection, TopologyProjectionError};",
          )
          text = text.replace(
              "    ListMultiplexerWorkspacesV2, MAX_INBOUND_CONTROL_FRAME_BYTES, MessageKind, MultiplexerEventV2,\n",
              "    ListMultiplexerWorkspacesV2, MAX_INBOUND_CONTROL_FRAME_BYTES, MessageKind,\n",
          )
          event_variant = "    MultiplexerTopology {\n        event: MultiplexerEventV2,\n    },\n"
          assert event_variant in text
          text = text.replace(event_variant, "", 1)
          map_marker = "fn map_protocol_error(kind: LocalControlErrorKind) -> LocalControlClientError {\n    match kind {\n        LocalControlErrorKind::ProtocolMismatch => LocalControlClientError::ProtocolMismatch,\n        LocalControlErrorKind::StaleOwnerGeneration => {\n            LocalControlClientError::StaleOwnerGeneration\n        }\n        other => LocalControlClientError::Protocol(other),\n    }\n}\n"
          assert map_marker in text
          map_replacement = map_marker + "\nfn map_topology_projection_error(error: TopologyProjectionError) -> LocalControlClientError {\n    match error {\n        TopologyProjectionError::Protocol(kind) => map_protocol_error(kind),\n        TopologyProjectionError::Multiplexer(kind) => LocalControlClientError::Multiplexer(kind),\n    }\n}\n"
          text = text.replace(map_marker, map_replacement, 1)
          text = text.replace(".accept_subscription_ack(&subscription, &ack)\n                .map_err(map_protocol_error)", ".accept_subscription_ack(&subscription, &ack)\n                .map_err(map_topology_projection_error)")
          text = text.replace(".accept_snapshot(&snapshot)\n            .map_err(map_protocol_error)?", ".accept_snapshot(&snapshot)\n            .map_err(map_topology_projection_error)?")
          event_accept = ".accept_event(topology_event)\n                .map_err(map_protocol_error)?;"
          assert event_accept in text
          text = text.replace(event_accept, ".accept_event(topology_event)\n                .map_err(map_topology_projection_error)?;\n            return Ok(());", 1)
          project_arm = "        ProtocolPayload::MultiplexerEvent { event } => {\n            Ok(ClientEventProjection::MultiplexerTopology { event })\n        }\n"
          assert project_arm in text
          text = text.replace(project_arm, "", 1)
          client.write_text(text)

          tests = Path("src/t167_multiplexer_client_tests.rs")
          text = tests.read_text()
          text = text.replace(
              "use crate::multiplexer::domain::{MultiplexerWorkspaceId, TopologyGeneration};",
              "use crate::multiplexer::domain::{\n    MultiplexerErrorKind, MultiplexerWorkspaceId, TopologyGeneration,\n};",
          )
          text = text.replace(
              "LocalControlErrorKind::StaleTopologyGeneration",
              "TopologyProjectionError::Multiplexer(MultiplexerErrorKind::StaleTopologyGeneration)",
          )
          text = text.replace(
              "        LocalControlErrorKind::MalformedFrame\n    );",
              "        TopologyProjectionError::Protocol(LocalControlErrorKind::MalformedFrame)\n    );",
              1,
          )
          tests.write_text(text)

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Format and clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Commit and push repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- src/multiplexer/projection.rs src/persistent_runtime/client.rs src/t167_multiplexer_client_tests.rs
          test -z "$(git diff --name-only | grep -v -E '^(src/multiplexer/projection.rs|src/persistent_runtime/client.rs|src/t167_multiplexer_client_tests.rs)$' || true)"
          git config user.name "Abdulaziz M. Shehri"
          git config user.email "alshehriofficial@gmail.com"
          git add src/multiplexer/projection.rs src/persistent_runtime/client.rs src/t167_multiplexer_client_tests.rs
          git commit -m "fix: repair T167 projection error boundaries"
          git push origin HEAD:"$TARGET_BRANCH"
