name: t053-macos-repair2-temporary

on:
  push:
    branches: [feat/003-t053-terminal-ledger]
    paths:
      - ".github/workflows/t053-macos-repair2-temporary.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Apply reviewed repair with top-level import disambiguation
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/t053-macos-repair-temporary.yml').read_text(encoding='utf-8')
          step = '      - name: Apply bounded destructor cleanup repair\n        shell: python\n        run: |\n'
          next_step = '      - name: Validate repair on macOS\n'
          start = workflow.find(step)
          end = workflow.find(next_step, start + len(step))
          if start < 0 or end < 0:
              raise SystemExit(f'repair script bounds invalid: start={start}, end={end}')
          block = workflow[start + len(step):end]
          script_lines = []
          for line in block.splitlines():
              if line.startswith('          '):
                  script_lines.append(line[10:])
              elif line.strip():
                  raise SystemExit(f'unexpected repair indentation: {line!r}')
              else:
                  script_lines.append('')
          script = '\n'.join(script_lines) + '\n'

          old = '''text = replace_once(
              text,
              "use std::sync::atomic::{AtomicU64, Ordering};\\n",
              "use std::sync::atomic::{AtomicU64, Ordering};\\nuse std::time::{Duration, Instant};\\n",
              "terminal time import",
          )'''
          new = '''top_static = "static NEXT_SESSION_ID: AtomicU64 = AtomicU64::new(0);\\n"
          static_pos = text.find(top_static)
          if static_pos < 0:
              raise SystemExit("top-level NEXT_SESSION_ID marker missing")
          import_line = "use std::sync::atomic::{AtomicU64, Ordering};\\n"
          import_pos = text.rfind(import_line, 0, static_pos)
          if import_pos < 0:
              raise SystemExit("top-level terminal atomic import missing")
          insert_pos = import_pos + len(import_line)
          text = (
              text[:insert_pos]
              + "use std::time::{Duration, Instant};\\n"
              + text[insert_pos:]
          )'''
          if script.count(old) != 1:
              raise SystemExit(f'import patch-script block count={script.count(old)}')
          script = script.replace(old, new, 1)
          Path('/tmp/t053-macos-repair.py').write_text(script, encoding='utf-8')
          subprocess.run(['python', '/tmp/t053-macos-repair.py'], check=True)
      - name: Validate repair on macOS
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --locked --all-targets --all-features
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --bin winds terminal::tests::dropping_live_terminal_session_is_bounded -- --exact --nocapture --test-threads=1
          cargo test --locked --bin winds execution::tests -- --nocapture --test-threads=1
          cargo test --locked --all-targets --all-features
          git diff --check -- src/terminal.rs src/execution.rs
      - name: Commit validated repair source only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/terminal.rs src/execution.rs
          git diff --cached --check
          git commit -m "fix(winds): bound terminal destructor cleanup"
          git push origin "HEAD:$GITHUB_REF_NAME"
