name: windows-terminal

on:
  pull_request:
    paths:
      - "src/check.rs"
      - "src/git.rs"
      - "src/shell_profiles.rs"
      - "src/terminal.rs"
      - "src/terminal_windows_tests.rs"
      - "src/workspace.rs"
      - ".github/workflows/windows-terminal.yml"
  push:
    branches: [main]
    paths:
      - "src/check.rs"
      - "src/git.rs"
      - "src/shell_profiles.rs"
      - "src/terminal.rs"
      - "src/terminal_windows_tests.rs"
      - "src/workspace.rs"
      - ".github/workflows/windows-terminal.yml"

permissions:
  contents: read

jobs:
  native-windows-terminal:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Compile touched surface
        run: cargo check --locked --all-targets --all-features
      - name: Clippy touched surface
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Native Windows ConPTY lifecycle tests
        run: cargo test --locked --bin winds terminal::windows_tests -- --test-threads=1
