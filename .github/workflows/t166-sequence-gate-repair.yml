name: t166-sequence-gate-repair

on:
  push:
    branches:
      - impl/spec-012-t166-protocol-v2

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout target branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: impl/spec-012-t166-protocol-v2
          fetch-depth: 0

      - name: Repair request sequence gating and endpoint fixture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          owner_path = Path('src/persistent_runtime/owner.rs')
          owner = owner_path.read_text(encoding='utf-8')
          start = owner.index('    fn dispatch_authenticated_request(')
          end = owner.index('\n    fn ', start + 1)
          segment = owner[start:end]
          gate = 'session.request_guard.accept(request)?;'

          if segment.count(gate) != 6:
              raise SystemExit(f'expected 6 request gates in dispatch_authenticated_request, found {segment.count(gate)}')

          repaired = segment.replace('            session.request_guard.accept(request)?;\n', '')
          if repaired.count(gate) != 1:
              raise SystemExit(f'expected exactly one request gate after repair, found {repaired.count(gate)}')

          owner = owner[:start] + repaired + owner[end:]
          owner_path.write_text(owner, encoding='utf-8')

          test_path = Path('src/t166_multiplexer_protocol_v2_tests.rs')
          tests = test_path.read_text(encoding='utf-8')
          old = '''        assert!(\n            owner\n                .terminal_control_state(&connection("unrelated"), runtime_id, 104, 3,)\n                .is_err()\n        );\n'''
          new = '''        let unrelated_state = owner\n            .terminal_control_state(&connection("unrelated"), runtime_id, 104, 3)\n            .unwrap();\n        assert_eq!(unrelated_state.authority, ClientAuthority::Observer);\n        assert!(unrelated_state.controller_client_id.is_none());\n'''
          if tests.count(old) != 1:
              raise SystemExit(f'expected exactly one stale unrelated-control assertion, found {tests.count(old)}')
          tests = tests.replace(old, new, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Format and verify focused regression
        shell: bash
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --locked t166_real_private_endpoint_preserves_spec011_and_v2_then_allows_next_client -- --nocapture

      - name: Commit forward-only repair
        shell: bash
        run: |
          git rm .github/workflows/t166-sequence-gate-repair.yml
          git config user.name 'Winds Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/persistent_runtime/owner.rs src/t166_multiplexer_protocol_v2_tests.rs
          git diff --cached --check
          git commit -m 'fix(t166): repair request gating and endpoint fixture'
          git push origin HEAD:impl/spec-012-t166-protocol-v2
