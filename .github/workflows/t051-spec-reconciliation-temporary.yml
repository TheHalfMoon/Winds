name: t051-spec-reconciliation-temporary

on:
  push:
    branches: [feat/003-t051-windows-conpty]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - name: Reconcile evidence-backed Windows interrupt contract
        shell: python
        run: |
          from pathlib import Path

          spec = Path('specs/003-workspace-execution-spine/spec.md')
          text = spec.read_text(encoding='utf-8')
          old = '- **FR-012**: Winds MUST support terminal session create, input, output streaming, resize, interrupt, terminate, and close operations, each bound to an exact session identity.'
          new = '- **FR-012**: Winds MUST support terminal session create, input, output streaming, resize, terminate, and close operations, each bound to an exact session identity. Linux/macOS terminal sessions MUST support an ownership-scoped interrupt. Native Windows terminal sessions MUST support interrupt only when the accepted ConPTY backend can prove an ownership-scoped interrupt primitive; if that primitive cannot be proven, `interrupt` MUST fail explicitly without corrupting the live session, MUST NOT report false success, and MUST NOT fall back to process-global console signaling.'
          if text.count(old) != 1:
              raise SystemExit(f'FR-012 count={text.count(old)}')
          text = text.replace(old, new, 1)
          old = '- **SC-003**: Supported Linux, macOS, and Windows terminal fixtures can create a PTY-backed shell, exchange input/output, resize, interrupt a child command, observe exit, and close without orphaning the directly owned terminal child during normal lifecycle control.'
          new = '- **SC-003**: Supported Linux/macOS terminal fixtures can create a PTY-backed shell, exchange input/output, resize, interrupt a child command, observe exit, and close without orphaning the directly owned terminal child during normal lifecycle control. Native Windows fixtures MUST prove the same create/input/output/resize/exit/close and directly-owned-child terminate/reap lifecycle through ConPTY; `interrupt` MUST either be proven ownership-scoped or fail explicitly while leaving the live session usable, as required by FR-012.'
          if text.count(old) != 1:
              raise SystemExit(f'SC-003 count={text.count(old)}')
          spec.write_text(text.replace(old, new, 1), encoding='utf-8')

          research = Path('specs/003-workspace-execution-spine/research.md')
          text = research.read_text(encoding='utf-8')
          heading = '## T051 Native Windows Interrupt Reconciliation'
          if heading not in text:
              text = text.rstrip() + '''\n\n## T051 Native Windows Interrupt Reconciliation\n\nOfficial `windows-latest` ConPTY fixtures were used to test ownership-local interrupt candidates against a real foreground `ping -t` command while retaining the same live `cmd.exe` session. Raw ETX input, Win32-input-mode Ctrl+C encodings, a complete Ctrl+C key chord, and a ConPTY-local Ctrl+Break encoding did not produce the required observable foreground interrupt. The accepted `portable-pty 0.9.0` surface exposes retained-child kill/wait ownership but does not expose creation of a Windows console process group for a targeted control event.\n\nMicrosoft documents that `GenerateConsoleCtrlEvent(CTRL_C_EVENT, ...)` cannot be limited to a specific process group, while targeted `CTRL_BREAK_EVENT` requires a process group created with `CREATE_NEW_PROCESS_GROUP` and processes that share the caller's console. Winds therefore rejects process-global signaling as an unsafe substitute. T051 records native-Windows `interrupt` as explicitly unavailable unless an ownership-scoped primitive is later proven; `terminate` remains the proven retained-child termination primitive. The limitation is surfaced rather than reported as success, and the Windows fixture proves the ConPTY session remains usable after the refusal.\n'''
          research.write_text(text, encoding='utf-8')
      - name: Commit reconciliation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add specs/003-workspace-execution-spine/spec.md specs/003-workspace-execution-spine/research.md
          git diff --cached --check
          git commit -m "docs(winds): reconcile T051 Windows interrupt contract"
          git push origin "HEAD:$GITHUB_REF_NAME"
