name: T168 Workbench Integration Repair V2

on:
  push:
    branches:
      - impl/spec-012-t168-tui-topology

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: impl/spec-012-t168-tui-topology
          fetch-depth: 0
          persist-credentials: true

      - name: Verify source is unchanged since reviewed candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git merge-base origin/main HEAD)" = "$(git rev-parse origin/main)"
          git diff --name-only 7d88217354ec022fbbe0192215397fc5212aeccf..HEAD | tee /tmp/since-reviewed.txt
          test -s /tmp/since-reviewed.txt
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/t168-workbench-integration-repair.yml|.github/workflows/t168-workbench-integration-repair-v2.yml) ;;
              *) echo "unexpected path since reviewed source head: $path" >&2; exit 1 ;;
            esac
          done < /tmp/since-reviewed.txt
          test -z "$(git diff --name-only 7d88217354ec022fbbe0192215397fc5212aeccf..HEAD -- src)"

      - name: Reuse the reviewed source patch from V1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          workflow = Path('.github/workflows/t168-workbench-integration-repair.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          script = dedent(workflow[start:end])
          Path('/tmp/t168-workbench-patch.py').write_text(script)
          PY
          python3 /tmp/t168-workbench-patch.py

      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Scope and format
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          git diff --name-only -- src | sort | tee /tmp/changed-src.txt
          while IFS= read -r path; do
            case "$path" in
              src/multiplexer/projection.rs|src/workbench.rs|src/workbench_ui.rs) ;;
              "") ;;
              *) echo "unexpected source path: $path" >&2; exit 1 ;;
            esac
          done < /tmp/changed-src.txt

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: T168 focused tests
        run: cargo test --locked t168_

      - name: Preserve T092 navigation behavior
        run: cargo test --locked t092_

      - name: Preserve T098 workbench accessibility behavior
        run: cargo test --locked t098_

      - name: Commit repair only after all gates pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/multiplexer/projection.rs src/workbench.rs src/workbench_ui.rs
          git commit -m "fix: wire T168 projection into workbench navigation"
          git push origin HEAD:impl/spec-012-t168-tui-topology
