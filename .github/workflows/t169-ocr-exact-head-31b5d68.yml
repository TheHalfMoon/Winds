name: T169 Alibaba OCR Exact Head 31b5d68

on:
  push:
    branches:
      - review/t169-ocr-31b5d68

permissions:
  contents: read

env:
  BASE_SHA: 8b5394b0af06aaf24c0b5179877119910b2da9f7
  HEAD_SHA: 31b5d68aa8a7fd0cf27769efc3301ee24eb9e00e
  OCR_VERSION: 1.12.9

jobs:
  ocr-review:
    name: Alibaba Open Code Review
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout review executor branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact candidate and base
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$BASE_SHA^{commit}"
          git fetch --no-tags origin refs/heads/impl/spec-012-t169-desktop-topology
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"
          git cat-file -e "$HEAD_SHA^{commit}"
          test "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" = "$BASE_SHA"
          git diff --check "$BASE_SHA" "$HEAD_SHA"
          test "$(git rev-parse HEAD)" != "$HEAD_SHA"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Install exact Alibaba Open Code Review
        shell: bash
        run: |
          set -euo pipefail
          npm install -g "@alibaba-group/open-code-review@$OCR_VERSION"
          ocr version | tee ocr-version.txt
          grep -F "$OCR_VERSION" ocr-version.txt

      - name: Review exact T169 range
        shell: bash
        run: |
          set -euo pipefail
          ocr delegate preview --format json --from "$BASE_SHA" --to "$HEAD_SHA" | tee ocr-preview.json

      - name: Resolve rules for every changed path
        shell: bash
        run: |
          set -euo pipefail
          ocr delegate rule --format json \
            desktop/src-tauri/src/main.rs \
            desktop/src/App.tsx \
            desktop/src/multiplexer/TopologySurface.tsx \
            desktop/src/multiplexer/bridge.ts \
            desktop/src/multiplexer/topology.css \
            desktop/src/multiplexer/types.ts \
            desktop/tests/multiplexer-topology.test.mjs \
            src/desktop_topology.rs \
            src/lib.rs \
            src/t169_desktop_topology_tests.rs | tee ocr-rules.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: t169-alibaba-ocr-31b5d68
          path: |
            ocr-version.txt
            ocr-preview.json
            ocr-rules.json
          if-no-files-found: warn
          retention-days: 14
