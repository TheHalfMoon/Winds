name: t050-lockgen-temporary

on:
  push:
    branches: [feat/003-t050-unix-pty-lifecycle]

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Generate exact lockfile
        shell: bash
        run: |
          rm -f Cargo.lock
          cargo generate-lockfile
          echo '===== T050_CARGO_LOCK_BEGIN ====='
          cat Cargo.lock
          echo '===== T050_CARGO_LOCK_END ====='
          echo '===== T050_CARGO_TREE_BEGIN ====='
          cargo tree --locked --edges normal,build
          echo '===== T050_CARGO_TREE_END ====='
