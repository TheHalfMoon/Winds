name: t053-drop-repair4-temporary

on:
  push:
    branches: [feat/003-t053-terminal-ledger]
    paths:
      - ".github/workflows/t053-drop-repair4-temporary.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Apply previously reviewed repair plus compile fixes
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/t053-drop-repair3-temporary.yml').read_text(encoding='utf-8')
          step = '      - name: Apply repair with function-index matchers\n        shell: python\n        run: |\n'
          next_step = '      - name: Validate repaired ownership on Ubuntu\n'
          start = workflow.find(step)
          end = workflow.find(next_step, start + len(step))
          if start < 0 or end < 0:
              raise SystemExit(f'validated repair bounds invalid: start={start}, end={end}')
          block = workflow[start + len(step):end]
          script_lines = []
          for line in block.splitlines():
              if line.startswith('          '):
                  script_lines.append(line[10:])
              elif line.strip():
                  raise SystemExit(f'unexpected repair indentation: {line!r}')
              else:
                  script_lines.append('')
          Path('/tmp/t053-reviewed-drop-repair.py').write_text(
              '\n'.join(script_lines) + '\n',
              encoding='utf-8',
          )
          subprocess.run(['python', '/tmp/t053-reviewed-drop-repair.py'], check=True)

          store = Path('src/store.rs')
          text = store.read_text(encoding='utf-8')
          old_import = '    use super::{NewExecution, NewTerminalSession, NewWorkspace, Store};\n'
          new_import = '    use super::{\n        NewExecution, NewTerminalSession, NewWorkspace, Store, TerminalFinalization,\n    };\n'
          if text.count(old_import) != 1:
              raise SystemExit(f'persistence test super import count={text.count(old_import)}')
          store.write_text(text.replace(old_import, new_import, 1), encoding='utf-8')

          execution = Path('src/execution.rs')
          text = execution.read_text(encoding='utf-8')
          borrow_marker = '''        assert!(result.is_err());

          let final_record = store.load_execution("execution-failed").unwrap();
          '''
          borrow_replacement = '''        assert!(result.is_err());
          drop(result);

          let final_record = store.load_execution("execution-failed").unwrap();
          '''
          if text.count(borrow_marker) != 1:
              raise SystemExit(f'failed-start borrow marker count={text.count(borrow_marker)}')
          execution.write_text(
              text.replace(borrow_marker, borrow_replacement, 1),
              encoding='utf-8',
          )
      - name: Validate final repair on Ubuntu
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --locked --all-targets --all-features
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --bin winds store::persistence_tests -- --test-threads=1
          cargo test --locked --bin winds execution::tests -- --test-threads=1
          cargo test --locked --all-targets --all-features
          git diff --check -- src/store.rs src/execution.rs
      - name: Commit validated source repair only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/store.rs src/execution.rs
          git diff --cached --check
          git commit -m "fix(winds): keep terminal drop ledger-aware"
          git push origin "HEAD:$GITHUB_REF_NAME"
