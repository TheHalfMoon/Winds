name: release-candidate

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/release-candidate.yml
      - .github/workflows/windows-terminal.yml
      - scripts/ci/**
      - scripts/release/**
      - third-party/licenses/**
      - rust-toolchain.toml
      - Cargo.toml
      - Cargo.lock
      - src/**
      - migrations/**
      - tests/**
      - LICENSE-MIT
      - LICENSE-APACHE
      - README.md
      - CHANGELOG.md
      - docs/provenance/donors.md
      - docs/release/license-audit.md
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact Winds commit SHA to evaluate
        required: true
        type: string

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}

jobs:
  quality:
    name: quality (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Verify checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

  verification-regression:
    name: t064-verification-regression (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Checkout exact candidate head with Spec 003 baseline history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Verify exact candidate and pre-Spec-003 suite inventory
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          BASELINE_SHA="8e92c5612a9ddc32996ed5e08475e3c9baa5e161"
          git cat-file -e "${BASELINE_SHA}^{commit}"
          actual="$(git ls-tree -r --name-only "$BASELINE_SHA" -- tests | LC_ALL=C sort)"
          expected="$(cat <<'EOF'
          tests/fault_injection.rs
          tests/pre_release_soak.rs
          tests/prohibited_git_operations.rs
          tests/walking_skeleton.rs
          EOF
          )"
          if [ "$actual" != "$expected" ]; then
            printf 'unexpected pre-Spec-003 test inventory\nexpected:\n%s\nactual:\n%s\n' "$expected" "$actual" >&2
            exit 1
          fi
          for path in \
            tests/fault_injection.rs \
            tests/pre_release_soak.rs \
            tests/prohibited_git_operations.rs
          do
            baseline_blob="$(git rev-parse "${BASELINE_SHA}:${path}")"
            current_blob="$(git rev-parse "HEAD:${path}")"
            if [ "$baseline_blob" != "$current_blob" ]; then
              echo "pre-existing verification target drifted: $path" >&2
              exit 1
            fi
          done
          git cat-file -e "${BASELINE_SHA}:tests/walking_skeleton.rs"
          echo "T064_BASELINE_SUITE_PROVEN=$BASELINE_SHA"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1

      - name: Prove exact baseline walking-skeleton verify/promote/recover authority
        shell: bash
        run: |
          set -euo pipefail
          BASELINE_SHA="8e92c5612a9ddc32996ed5e08475e3c9baa5e161"
          git show "${BASELINE_SHA}:tests/walking_skeleton.rs" > tests/walking_skeleton.rs
          python3 scripts/ci/run_exact_cargo_test.py \
            verifies_blocks_and_promotes_without_touching_primary_checkout \
            -- cargo test --locked --test walking_skeleton \
            verifies_blocks_and_promotes_without_touching_primary_checkout \
            -- --exact --test-threads=1 --nocapture
          git restore --source=HEAD --worktree -- tests/walking_skeleton.rs
          git diff --exit-code -- tests/walking_skeleton.rs
          echo "T064_PINNED_WALKING_SKELETON_PROVEN=$BASELINE_SHA"

      - name: Prove partial-worktree recovery is non-destructive
        run: >-
          python3 scripts/ci/run_exact_cargo_test.py
          partial_worktree_creation_remains_manual_recovery_required
          -- cargo test --locked --test fault_injection
          partial_worktree_creation_remains_manual_recovery_required
          -- --exact --test-threads=1 --nocapture

      - name: Prove failed READY persistence remains recoverable
        run: >-
          python3 scripts/ci/run_exact_cargo_test.py
          failed_workspace_ready_db_write_retains_provisioning_state
          -- cargo test --locked --test fault_injection
          failed_workspace_ready_db_write_retains_provisioning_state
          -- --exact --test-threads=1 --nocapture

      - name: Prove interrupted promotion transition is retryable without ref drift
        run: >-
          python3 scripts/ci/run_exact_cargo_test.py
          interrupted_promotion_db_transition_is_retryable_without_ref_drift
          -- cargo test --locked --test fault_injection
          interrupted_promotion_db_transition_is_retryable_without_ref_drift
          -- --exact --test-threads=1 --nocapture

      - name: Prove prohibited downstream Git operations remain absent
        run: >-
          python3 scripts/ci/run_exact_cargo_test.py
          winds_never_invokes_prohibited_downstream_git_operations
          -- cargo test --locked --test prohibited_git_operations
          winds_never_invokes_prohibited_downstream_git_operations
          -- --exact --test-threads=1 --nocapture

      - name: Prove binary Git trace parser keeps exact argv boundaries
        run: >-
          python3 scripts/ci/run_exact_cargo_test.py
          binary_trace_parser_preserves_embedded_delimiters_and_empty_args
          -- cargo test --locked --test prohibited_git_operations
          binary_trace_parser_preserves_embedded_delimiters_and_empty_args
          -- --exact --test-threads=1 --nocapture

      - name: Prove SC-001 100-cycle verify/promote/recover reconciliation
        run: >-
          python3 scripts/ci/run_exact_cargo_test.py
          sc_001_runs_100_clean_create_verify_promote_reconcile_cycles
          -- cargo test --locked --test pre_release_soak
          sc_001_runs_100_clean_create_verify_promote_reconcile_cycles
          -- --ignored --exact --test-threads=1 --nocapture

  verification-regression-windows:
    name: t064-native-windows-authority-refusal
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate head with T061 history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Verify exact candidate and pinned T061 authority source
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -cne $env:CANDIDATE_SHA) {
            throw "checkout identity mismatch: actual=$actual expected=$env:CANDIDATE_SHA"
          }
          $sourceSha = "ad4625ecd7f9a933613890cca74129857d0b4166"
          git cat-file -e "${sourceSha}^{commit}"
          if ($LASTEXITCODE -ne 0) {
            throw "pinned T061 source commit is unavailable: $sourceSha"
          }
          git cat-file -e "${sourceSha}:tests/walking_skeleton.rs"
          if ($LASTEXITCODE -ne 0) {
            throw "pinned T061 walking-skeleton source is unavailable"
          }

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1

      - name: Prove pinned T061 native-Windows fail-closed authority
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="ad4625ecd7f9a933613890cca74129857d0b4166"
          git show "${SOURCE_SHA}:tests/walking_skeleton.rs" > tests/walking_skeleton.rs
          python scripts/ci/run_exact_cargo_test.py \
            native_windows_refuses_authoritative_required_checks_without_mutation \
            -- cargo test --locked --test walking_skeleton \
            native_windows_refuses_authoritative_required_checks_without_mutation \
            -- --exact --test-threads=1 --nocapture
          git restore --source=HEAD --worktree -- tests/walking_skeleton.rs
          git diff --exit-code -- tests/walking_skeleton.rs
          echo "T064_PINNED_WINDOWS_AUTHORITY_PROVEN=$SOURCE_SHA"

  soak:
    name: sc-001-soak
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Verify checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1

      - name: Run SC-001 100-cycle soak
        run: cargo test --locked --test pre_release_soak -- --ignored --nocapture

  terminal-soak:
    name: t063-terminal-soak (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: python3
          - os: macos-15
            python: python3
          - os: windows-2025
            python: python
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Verify checkout identity (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Verify checkout identity (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -cne $env:CANDIDATE_SHA) {
            throw "checkout identity mismatch: actual=$actual expected=$env:CANDIDATE_SHA"
          }

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1

      - name: Run exact T063 100-cycle terminal lifecycle soak
        run: >-
          ${{ matrix.python }} scripts/ci/run_exact_cargo_test.py
          git::t063_soak_tests::controlled_terminal_lifecycle_soak_100_cycles
          -- cargo test --locked --bin winds
          git::t063_soak_tests::controlled_terminal_lifecycle_soak_100_cycles
          -- --ignored --exact --test-threads=1 --nocapture

      - name: Run exact T063 active-close and child-resize guard
        run: >-
          ${{ matrix.python }} scripts/ci/run_exact_cargo_test.py
          git::t063_soak_tests::active_close_and_windows_child_resize_guard
          -- cargo test --locked --bin winds
          git::t063_soak_tests::active_close_and_windows_child_resize_guard
          -- --ignored --exact --test-threads=1 --nocapture

  build:
    name: build (${{ matrix.target }})
    needs:
      - quality
      - verification-regression
      - verification-regression-windows
      - soak
      - terminal-soak
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            expected_arch: x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            expected_arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Verify checkout and runner architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(uname -m)" = "${{ matrix.expected_arch }}"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1

      - name: Install exact Rust target
        run: rustup target add "${{ matrix.target }}"

      - name: Resolve release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --no-deps --format-version 1 > "$RUNNER_TEMP/winds-package.json"
          VERSION="$(python3 - "$RUNNER_TEMP/winds-package.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              metadata = json.load(handle)
          packages = metadata["packages"]
          if len(packages) != 1 or packages[0]["name"] != "winds-control":
              raise SystemExit("unexpected workspace package metadata")
          print(packages[0]["version"])
          PY
          )"
          test "$VERSION" = "0.1.0"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        run: cargo build --locked --release --target "${{ matrix.target }}"

      - name: Assemble release-candidate bundle
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.metadata.outputs.version }}"
          TARGET="${{ matrix.target }}"
          BUNDLE="winds-v${VERSION}-${TARGET}"
          ROOT="dist/${BUNDLE}"
          mkdir -p "$ROOT"
          cp "target/${TARGET}/release/winds" "$ROOT/winds"
          chmod 0755 "$ROOT/winds"
          cp README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "$ROOT/"

          cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/cargo-metadata.json"
          python3 scripts/release/collect_licenses.py \
            "$RUNNER_TEMP/cargo-metadata.json" \
            "$ROOT/THIRD-PARTY-LICENSES"

          {
            echo "Winds version: ${VERSION}"
            echo "Git commit: ${CANDIDATE_SHA}"
            echo "Rust target: ${TARGET}"
            rustc --version
            git --version
          } > "$ROOT/BUILD-INFO.txt"

          tar -C dist -czf "dist/${BUNDLE}.tar.gz" "$BUNDLE"
          rm -rf "$ROOT"

          python3 - "dist/${BUNDLE}.tar.gz" "dist/${BUNDLE}.tar.gz.sha256" <<'PY'
          import hashlib
          import sys
          from pathlib import Path

          archive = Path(sys.argv[1])
          checksum = Path(sys.argv[2])
          digest = hashlib.sha256()
          with archive.open("rb") as handle:
              for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                  digest.update(chunk)
          value = digest.hexdigest()
          expected_manifest = f"{value}  {archive.name}\n"
          checksum.write_text(expected_manifest, encoding="utf-8")

          manifest = checksum.read_text(encoding="utf-8")
          if manifest != expected_manifest:
              raise SystemExit("SHA-256 manifest write/read verification failed")
          manifest_digest, manifest_name = manifest.rstrip("\n").split("  ", 1)
          if manifest_name != archive.name:
              raise SystemExit("SHA-256 manifest archive name mismatch")

          verify = hashlib.sha256()
          with archive.open("rb") as handle:
              for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                  verify.update(chunk)
          if verify.hexdigest() != manifest_digest:
              raise SystemExit("SHA-256 manifest verification failed")
          print(f"SHA256_VERIFIED={archive.name}")
          PY

          test -s "dist/${BUNDLE}.tar.gz"
          test -s "dist/${BUNDLE}.tar.gz.sha256"

      - name: Upload release-candidate artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: winds-v${{ steps.metadata.outputs.version }}-${{ matrix.target }}
          path: |
            dist/winds-v${{ steps.metadata.outputs.version }}-${{ matrix.target }}.tar.gz
            dist/winds-v${{ steps.metadata.outputs.version }}-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14