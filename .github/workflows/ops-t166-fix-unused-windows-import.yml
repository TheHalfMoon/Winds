name: ops-t166-fix-unused-windows-import

on:
  push:
    branches:
      - ops/t166-fix-unused-windows-import

permissions:
  contents: write

jobs:
  patch-exact-head:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout T166 exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: impl/spec-012-t166-protocol-v2
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Verify expected parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "b2ec9706d68463b417aab8b25fe1cd021b233353"

      - name: Gate Windows-only test import
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/t166_multiplexer_protocol_v2_tests.rs")
          text = path.read_text()
          token = "LocalControlClientError, "
          if text.count(token) != 1:
              raise SystemExit("expected LocalControlClientError import token exactly once")
          text = text.replace(token, "", 1)
          anchor = "    use crate::persistent_runtime::domain::{ClientAuthority, RuntimeAlias};"
          if text.count(anchor) != 1:
              raise SystemExit("expected persistent-runtime domain import anchor exactly once")
          insertion = "    #[cfg(windows)]\n    use crate::persistent_runtime::client::LocalControlClientError;\n" + anchor
          path.write_text(text.replace(anchor, insertion, 1))
          PY

      - name: Format and verify bounded diff
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --component rustfmt --profile minimal --no-self-update
          cargo +1.97.1 fmt --all
          git diff --check
          git diff --name-only | grep -Fx 'src/t166_multiplexer_protocol_v2_tests.rs'
          test "$(git diff --name-only | wc -l | tr -d ' ')" = "1"

      - name: Commit and push forward-only repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Winds Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/t166_multiplexer_protocol_v2_tests.rs
          git commit -m "fix(t166): gate Windows-only client error import"
          git push origin HEAD:refs/heads/impl/spec-012-t166-protocol-v2
