name: t052-patch-helper-temporary

on:
  push:
    branches: [feat/003-t052-wsl-launch]
    paths:
      - ".github/workflows/t052-patch-helper-temporary.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - name: Wire and harden T052
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement, found {text.count(old)}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          git_rs = Path('src/git.rs')
          replace_once(
              git_rs,
              '#[path = "wsl.rs"]\npub(crate) mod wsl;\n',
              '#[path = "wsl.rs"]\npub(crate) mod wsl;\n#[cfg(any(windows, test))]\n#[allow(\n    dead_code,\n    reason = "Spec 003 T052 backend API; persistence/CLI callers land in T053/T057"\n)]\n#[path = "wsl_launch.rs"]\npub(crate) mod wsl_launch;\n',
          )

          wsl_rs = Path('src/wsl.rs')
          replace_once(wsl_rs, 'fn system_wsl_executable() -> Result<PathBuf> {', 'pub(super) fn system_wsl_executable() -> Result<PathBuf> {')
          replace_once(wsl_rs, 'fn decode_wsl_text(bytes: &[u8]) -> Result<String> {', 'pub(super) fn decode_wsl_text(bytes: &[u8]) -> Result<String> {')

          terminal = Path('src/terminal.rs')
          text = terminal.read_text(encoding='utf-8')
          start_marker = '    pub fn start(profile: &ShellProfile, cwd: &Path, size: TerminalSize) -> Result<Self> {'
          end_marker = '    pub fn session_id(&self) -> TerminalSessionId {'
          start = text.find(start_marker)
          end = text.find(end_marker)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('src/terminal.rs: failed to locate TerminalSession::start block')
          new_block = '''    pub fn start(profile: &ShellProfile, cwd: &Path, size: TerminalSize) -> Result<Self> {
              validate_shell_profile_for_launch(profile)?;
              Self::start_command(
                  &profile.profile_id,
                  Path::new(&profile.executable),
                  &profile.arguments,
                  cwd,
                  size,
              )
          }

          #[cfg(windows)]
          pub(super) fn start_exact_launch(
              profile_id: &str,
              executable: &Path,
              arguments: &[String],
              cwd: &Path,
              size: TerminalSize,
          ) -> Result<Self> {
              if profile_id.is_empty() {
                  return Err("terminal launch profile identity cannot be empty".into());
              }
              if !executable.is_absolute() {
                  return Err("terminal launch executable must be an absolute path".into());
              }
              let metadata = std::fs::metadata(executable).map_err(|error| {
                  format!(
                      "terminal launch executable cannot be inspected ({}): {error}",
                      executable.display()
                  )
              })?;
              if !metadata.is_file() {
                  return Err(format!(
                      "terminal launch executable is not a file: {}",
                      executable.display()
                  )
                  .into());
              }
              Self::start_command(profile_id, executable, arguments, cwd, size)
          }

          fn start_command(
              profile_id: &str,
              executable: &Path,
              arguments: &[String],
              cwd: &Path,
              size: TerminalSize,
          ) -> Result<Self> {
              let start_cwd = canonical_start_cwd(cwd)?;
              let pty_size = size.to_pty_size()?;
              let session_id = next_session_id()?;

              let pty_system = native_pty_system();
              let pair = pty_system.openpty(pty_size)?;
              let output_reader = pair.master.try_clone_reader()?;
              let writer = pair.master.take_writer()?;

              let mut command = CommandBuilder::new(executable.as_os_str());
              command.args(arguments);
              command.cwd(start_cwd.as_os_str());
              let child = pair.slave.spawn_command(command)?;
              drop(pair.slave);

              Ok(Self {
                  session_id,
                  profile_id: profile_id.to_owned(),
                  start_cwd,
                  master: Some(pair.master),
                  output_reader: Some(output_reader),
                  writer: Some(writer),
                  child: Some(child),
                  final_exit: None,
              })
          }

          '''
          terminal.write_text(text[:start] + new_block + text[end:], encoding='utf-8')

          launch = Path('src/wsl_launch.rs')
          replace_once(
              launch,
              'use super::wsl::{WslDistribution, discover_wsl_distributions};\nuse super::Repo;\n',
              'use super::wsl::WslDistribution;\n#[cfg(windows)]\nuse super::wsl::discover_wsl_distributions;\n#[cfg(windows)]\nuse super::{Repo, run_git_text, strip_git_line_ending};\n',
          )
          replace_once(
              launch,
              'use std::path::{Path, PathBuf};\n',
              'use std::path::Path;\n#[cfg(windows)]\nuse std::path::PathBuf;\n',
          )
          replace_once(
              launch,
              '        linux_git_common_dir: String,\n',
              '        linux_git_common_dir: String,\n        git_head_oid: String,\n',
          )
          replace_once(
              launch,
              '    linux_git_common_dir: String,\n}\n',
              '    linux_git_common_dir: String,\n    git_head_oid: String,\n}\n',
          )
          replace_once(
              launch,
              '            linux_git_common_dir: attestation.linux_git_common_dir,\n',
              '            linux_git_common_dir: attestation.linux_git_common_dir,\n            git_head_oid: attestation.git_head_oid,\n',
          )
          replace_once(
              launch,
              '        linux_git_common_dir,\n        ..\n    } = &plan.cwd_resolution\n',
              '        linux_git_common_dir,\n        git_head_oid,\n        ..\n    } = &plan.cwd_resolution\n',
          )
          replace_once(
              launch,
              '                if attestation.linux_workspace_root == *linux_workspace_root\n                    && attestation.linux_git_common_dir == *linux_git_common_dir => {}\n',
              '                if attestation.linux_workspace_root == *linux_workspace_root\n                    && attestation.linux_git_common_dir == *linux_git_common_dir\n                    && attestation.git_head_oid == *git_head_oid => {}\n',
          )
          replace_once(
              launch,
              '    let linux_git_common_dir = run_linux_path_command(\n        launcher,\n        distribution,\n        Some(linux_cwd),\n        "/usr/bin/git",\n        &["rev-parse", "--path-format=absolute", "--git-common-dir"],\n        "WSL Git common directory",\n    )?;\n\n',
              '    let linux_git_common_dir = run_linux_path_command(\n        launcher,\n        distribution,\n        Some(linux_cwd),\n        "/usr/bin/git",\n        &["rev-parse", "--path-format=absolute", "--git-common-dir"],\n        "WSL Git common directory",\n    )?;\n    let linux_head_oid = run_linux_text_command(\n        launcher,\n        distribution,\n        Some(linux_cwd),\n        "/usr/bin/git",\n        &["rev-parse", "--verify", "HEAD^{commit}"],\n        "WSL Git HEAD",\n    )?;\n    let windows_head = run_git_text(repo.root(), ["rev-parse", "--verify", "HEAD^{commit}"])?;\n    let windows_head_oid = strip_git_line_ending(&windows_head);\n    if windows_head_oid.is_empty() {\n        return Err("Windows Git returned an empty HEAD object id".into());\n    }\n\n',
          )
          replace_once(
              launch,
              '    require_same_canonical_windows_path(\n        &common_windows,\n        &repo.common_dir,\n        "WSL Git common directory",\n    )?;\n\n    Ok(WslWorkspaceAttestation {\n        linux_workspace_root,\n        linux_git_common_dir,\n    })\n',
              '    require_same_canonical_windows_path(\n        &common_windows,\n        &repo.common_dir,\n        "WSL Git common directory",\n    )?;\n    if linux_head_oid != windows_head_oid {\n        return Err(format!(\n            "WSL Git HEAD does not match Windows Git HEAD: WSL {linux_head_oid}, Windows {windows_head_oid}"\n        )\n        .into());\n    }\n\n    Ok(WslWorkspaceAttestation {\n        linux_workspace_root,\n        linux_git_common_dir,\n        git_head_oid: linux_head_oid,\n    })\n',
          )
          marker = '''#[cfg(windows)]
          fn run_linux_path_command(
          '''
          insert = '''#[cfg(windows)]
          fn run_linux_text_command(
              launcher: &Path,
              distribution: &WslDistribution,
              cwd: Option<&str>,
              command: &str,
              args: &[&str],
              label: &str,
          ) -> Result<String> {
              use std::ffi::OsString;

              let args: Vec<OsString> = args.iter().map(OsString::from).collect();
              let output = run_wsl_exec(launcher, &distribution.name, cwd, command, &args)?;
              parse_single_text(&output, label)
          }

          #[cfg(windows)]
          fn run_linux_path_command(
          '''
          replace_once(launch, marker, insert)
          replace_once(
              launch,
              '    fn Wsl_profile_identity_binds_domain_launcher_and_shell() {',
              '    fn wsl_profile_identity_binds_domain_launcher_and_shell() {',
          )

      - name: Validate source diff
        shell: bash
        run: |
          cargo fmt --all
          git diff --check
          git status --short
          git diff -- src/git.rs src/wsl.rs src/terminal.rs src/wsl_launch.rs
      - name: Commit source wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/git.rs src/wsl.rs src/terminal.rs src/wsl_launch.rs
          git diff --cached --check
          git commit -m "feat(winds): wire safe WSL launch attestation"
          git push origin "HEAD:$GITHUB_REF_NAME"
