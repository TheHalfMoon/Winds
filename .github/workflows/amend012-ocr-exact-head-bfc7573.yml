name: Amendment 012 Alibaba OCR Exact Head bfc7573

on:
  push:
    branches:
      - review/amend012-ocr-bfc7573

permissions:
  contents: read

env:
  BASE_SHA: 974ab64859e2468a558f9497f3d9bd10d7956e63
  HEAD_SHA: bfc75732134cad061acdab5177bf75d1e02e9eae
  OCR_VERSION: 1.12.9

jobs:
  ocr-review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact amendment candidate
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$BASE_SHA^{commit}"
          git fetch --no-tags origin refs/heads/governance/007-amendment-012-t097-image-cohort-refresh
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"
          test "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" = "$BASE_SHA"
          git diff --check "$BASE_SHA" "$HEAD_SHA"
          test "$(git rev-parse HEAD)" != "$HEAD_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Install exact Alibaba Open Code Review
        run: |
          npm install -g "@alibaba-group/open-code-review@$OCR_VERSION"
          ocr version | tee ocr-version.txt
          grep -F "$OCR_VERSION" ocr-version.txt
      - name: Review exact amendment range
        run: ocr delegate preview --format json --from "$BASE_SHA" --to "$HEAD_SHA" | tee ocr-preview.json
      - name: Resolve rule
        run: ocr delegate rule --format json specs/007-native-agentic-terminal-ux-foundation/tasks-amendment-012-t097-reference-image-cohort-refresh.md | tee ocr-rules.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: amendment012-alibaba-ocr-bfc7573
          path: |
            ocr-version.txt
            ocr-preview.json
            ocr-rules.json
          if-no-files-found: warn
          retention-days: 14
