name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  T079_BASE_SHA: 4e4731d459075cb0fbf78e428de2662c3e03f8c3
  T079_TRANSFER_BRANCH: tmp/t079-qualified-blob-4e4731d

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
      - name: Verify checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Apply temporary T079 exec-denial qualification patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip
          from pathlib import Path
          parts = sorted(Path('.github/t079-exec-denial-patch-v2').glob('part-*'))
          if [p.name for p in parts] != ['part-00', 'part-01']:
              raise SystemExit('unexpected compressed T079 qualification patch parts')
          encoded = ''.join(p.read_text(encoding='utf-8') for p in parts)
          compressed = base64.b64decode(encoded, validate=True)
          Path('/tmp/t079-exec-denial.patch').write_bytes(gzip.decompress(compressed))
          PY
          test "$(sha256sum /tmp/t079-exec-denial.patch | cut -d' ' -f1)" = "05a8fdf694e214b78d35dd33fd5f3ad778f91829289be2f40f242a8fbb134bac"
          git apply --check /tmp/t079-exec-denial.patch
          git apply /tmp/t079-exec-denial.patch
          test "$(git diff --name-only | tr '\n' ' ')" = "src/t079_codex_connected_tests.rs "
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/t079_codex_connected_tests.rs')
          text = path.read_text(encoding='utf-8')
          old_a = "let mut byte = [b'L'];"
          old_b = "if byte != [b'L']"
          if text.count(old_a) != 1 or text.count(old_b) != 1:
              raise SystemExit('unexpected T079 clippy-fix anchors')
          text = text.replace(old_a, 'let mut byte = *b"L";')
          text = text.replace(old_b, 'if byte != *b"L"')
          path.write_text(text, encoding='utf-8')
          PY
          cargo fmt --all
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets --all-features
      - name: Focused T079 exec-denial regressions
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --locked t079_linux_seccomp_filter_denies_ -- --nocapture
      - name: Upload formatted T079 repair candidate
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: t079-exec-denial-qualified-${{ env.CANDIDATE_SHA }}
          path: src/t079_codex_connected_tests.rs
      - name: Create exact-parent one-file transfer commit
        if: matrix.os == 'ubuntu-latest'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cp src/t079_codex_connected_tests.rs /tmp/t079-qualified.rs
          git checkout --detach "$T079_BASE_SHA"
          cp /tmp/t079-qualified.rs src/t079_codex_connected_tests.rs
          test "$(git diff --name-only | tr '\n' ' ')" = "src/t079_codex_connected_tests.rs "
          cargo fmt --all -- --check
          git config user.name "Winds Qualification Bot"
          git config user.email "winds-qualification@users.noreply.github.com"
          git add src/t079_codex_connected_tests.rs
          git commit -m "fix(006): deny T079 post-launch executable replacement"
          test "$(git rev-parse HEAD^)" = "$T079_BASE_SHA"
          test "$(git diff --name-only HEAD^ HEAD | tr '\n' ' ')" = "src/t079_codex_connected_tests.rs "
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refs/heads/${T079_TRANSFER_BRANCH}" --force-with-lease="refs/heads/${T079_TRANSFER_BRANCH}:"
