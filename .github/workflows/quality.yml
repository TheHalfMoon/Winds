name: quality

on:
  pull_request:

permissions:
  contents: write

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
  TOOLING_BRANCH: tooling/t079-rustfmt-3bbb9c18

jobs:
  rustfmt-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact tooling head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Verify checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Format exact T079 source
        run: cargo fmt --all
      - name: Prove formatting scope
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git diff --name-only)"
          test "$actual" = "src/t079_codex_connected_tests.rs"
      - name: Commit formatted source to tooling branch
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${TOOLING_BRANCH}" | cut -f1)"
          test "$remote_head" = "$CANDIDATE_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/t079_codex_connected_tests.rs
          git commit -m "style(tooling): capture rustfmt T079 source"
          git push origin "HEAD:refs/heads/${TOOLING_BRANCH}"
