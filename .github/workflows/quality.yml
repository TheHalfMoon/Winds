name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Produce rustfmt output
        run: cargo fmt --all
      - name: Upload formatted sources
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-sources
          path: |
            src
            tests
          if-no-files-found: error
      - name: Formatting is clean
        run: git diff --exit-code -- src tests
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-targets --all-features
