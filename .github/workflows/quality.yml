name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  t068-final-review-repair:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 63
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repair carrier
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Verify checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Apply bounded final-review repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workspace_path = Path('src/workspace_clone.rs')
          workspace = workspace_path.read_text()
          if 'pub staging_cleanup_warning: Option<String>,' in workspace:
              print('repair already present')
              raise SystemExit(0)

          field_anchor = '    pub remote_identity: String,\n'
          assert workspace.count(field_anchor) == 1
          workspace = workspace.replace(
              field_anchor,
              field_anchor + '    pub staging_cleanup_warning: Option<String>,\n',
              1,
          )

          start_marker = '    if let Err(error) = remove_empty_owned_clone_staging(&staging) {'
          end_marker = '    let workspace = inspect_existing_workspace(&planned_destination, canonical_state_root)?;'
          start = workspace.index(start_marker)
          end = workspace.index(end_marker, start)
          replacement = (
              '    // Publication and filesystem identity are already proven. Failure to remove\n'
              '    // the now-empty private staging shell must not discard that proven publication\n'
              '    // or prevent workspace registration. Preserve cleanup uncertainty in the\n'
              '    // returned record so callers can surface it without fabricating failure.\n'
              '    let staging_cleanup_warning = remove_empty_owned_clone_staging(&staging)\n'
              '        .err()\n'
              '        .map(|error| format!("empty private clone staging cleanup was not proven: {error}"));\n\n'
          )
          workspace = workspace[:start] + replacement + workspace[end:]

          ok_start = workspace.index('    Ok(ClonedWorkspace {', end)
          remote_line = '        remote_identity,\n'
          remote_at = workspace.index(remote_line, ok_start)
          workspace = (
              workspace[: remote_at + len(remote_line)]
              + '        staging_cleanup_warning,\n'
              + workspace[remote_at + len(remote_line) :]
          )

          fn_anchor = 'fn remove_empty_owned_clone_staging(staging: &OwnedCloneStaging) -> Result<()> {\n'
          assert workspace.count(fn_anchor) == 1
          fn_insert = (
              '    match fs::symlink_metadata(&staging.path) {\n'
              '        Err(error) if error.kind() == std::io::ErrorKind::NotFound => return Ok(()),\n'
              '        Err(error) => {\n'
              '            return Err(format!(\n'
              '                "empty private clone staging cannot be inspected before non-recursive removal: {error}"\n'
              '            )\n'
              '            .into());\n'
              '        }\n'
              '        Ok(_) => {}\n'
              '    }\n'
          )
          workspace = workspace.replace(fn_anchor, fn_anchor + fn_insert, 1)

          test_anchor = '            cloned.remote_identity,\n'
          test_at = workspace.index(test_anchor)
          test_end = workspace.index('        );', test_at) + len('        );')
          workspace = (
              workspace[:test_end]
              + '\n        assert_eq!(cloned.staging_cleanup_warning, None);'
              + workspace[test_end:]
          )
          workspace_path.write_text(workspace)

          cli_path = Path('tests/t057_cli.rs')
          cli = cli_path.read_text()
          cli_anchor = '    assert_eq!(cloned_json["remote_identity"], test_path(&canonical_source));\n'
          assert cli.count(cli_anchor) == 1
          cli = cli.replace(
              cli_anchor,
              cli_anchor + '    assert!(cloned_json["staging_cleanup_warning"].is_null());\n',
              1,
          )
          cli_path.write_text(cli)

          wsl_path = Path('src/wsl_launch.rs')
          wsl = wsl_path.read_text()
          preflight_anchor = 'done\n\n/usr/bin/setsid /bin/sh -c'
          assert wsl.count(preflight_anchor) >= 1
          preflight = (
              'done\n'
              'if ! /bin/sleep 0.01 2>/dev/null; then\n'
              '    printf \'__WINDS_WSL_SCOPE_UNSUPPORTED_%s__:%s\\n\' "$token" \'/bin/sleep:fractional-seconds\' >&2\n'
              '    exit 125\n'
              'fi\n\n'
              '/usr/bin/setsid /bin/sh -c'
          )
          wsl = wsl.replace(preflight_anchor, preflight, 1)

          sleep_anchor = '    /bin/sleep 0.01\n'
          assert wsl.count(sleep_anchor) == 1
          sleep_replacement = (
              '    if ! /bin/sleep 0.01; then\n'
              '        printf \'__WINDS_WSL_SCOPE_UNPROVEN_%s__:sleep-failed\\n\' "$token" >&2\n'
              '        exit 125\n'
              '    fi\n'
          )
          wsl = wsl.replace(sleep_anchor, sleep_replacement, 1)

          deadline_anchor = '    match child.wait_for_scope_quiescence(command_deadline, OWNED_LABEL) {'
          assert wsl.count(deadline_anchor) == 1
          wsl = wsl.replace(
              deadline_anchor,
              '    // The launcher has exited and output has been drained. Scope quiescence is\n'
              '    // cleanup work and must consume only the reserved cleanup budget.\n'
              '    match child.wait_for_scope_quiescence(cleanup_deadline, OWNED_LABEL) {',
              1,
          )
          wsl_path.write_text(wsl)

          addendum_path = Path('specs/003-workspace-execution-spine/t068-independent-review-reconciliation-addendum.md')
          addendum = addendum_path.read_text()
          paragraph_start = addendum.index('On Unix, Winds opens the history root and selected retained session as no-follow directory handles')
          paragraph_end = addendum.index('\n\nOn Windows,', paragraph_start)
          paragraph = (
              'On Unix, Winds opens the history root and selected retained session as no-follow directory handles, verifies their filesystem identities, validates each direct regular-file entry relative to the already-open session directory, unlinks only direct names through `unlinkat`, revalidates the session entry from the already-open root directory, and finally removes the now-empty session directory non-recursively with `unlinkat(..., AT_REMOVEDIR)`. The security claim is deliberately scoped to containment inside the already-bound session-directory object and to the supported Winds writer path. POSIX `unlinkat` remains name-based: Winds does **not** claim protection when an external same-principal process concurrently replaces an individual direct child name inside that private session directory between validation and unlink. Such hostile same-principal filesystem mutation is outside the Spec 003 isolation claim. Winds still guarantees that pruning performs no recursive traversal and cannot redirect deletion into another directory tree through that child-name race.'
          )
          addendum = addendum[:paragraph_start] + paragraph + addendum[paragraph_end:]
          addendum_path.write_text(addendum)
          PY

          cargo fmt --all
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features
      - name: Commit tested repair only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/workspace_clone.rs src/wsl_launch.rs tests/t057_cli.rs specs/003-workspace-execution-spine/t068-independent-review-reconciliation-addendum.md
          git diff --cached --exit-code -- .github/workflows/quality.yml
          git commit -m 'fix(003): reconcile final exact-head review findings'
          git push origin 'HEAD:fix/003-t068-independent-review-findings'

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Verify checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets --all-features
