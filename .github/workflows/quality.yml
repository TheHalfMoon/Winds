name: quality

on:
  pull_request:

permissions:
  contents: write

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  t068-closeout-contradiction-repair:
    if: github.event.pull_request.number == 63 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repair carrier
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Verify checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Repair contradictory T068 addendum preamble only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          path = Path('specs/003-workspace-execution-spine/t068-independent-review-reconciliation-addendum.md')
          expected_blob = 'b174986229824c457a8c0e6c18a2939b286bb629'
          actual_blob = subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip()
          assert actual_blob == expected_blob, (actual_blob, expected_blob)

          text = path.read_text()
          old = 'This addendum records material dispositions discovered after the initial T068 reconciliation record was created. It does not check T068, start T069, authorize merge of PR #62 or PR #63, or change the Spec 003 runtime scope.'
          new = 'This addendum records material dispositions discovered after the initial T068 reconciliation record was created. It records the T068 closeout evidence only; it does not start T069, authorize merge of PR #62 or PR #63, or change the Spec 003 runtime scope.'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          assert text.count('It does not check T068') == 0
          assert 'Status: **T068 CLOSEOUT EVIDENCE RECORDED — PR #63 REMAINS UNMERGED; T069 NOT STARTED**' in text
          path.write_text(text)
          PY
          git diff --check
          test "$(git diff --name-only)" = 'specs/003-workspace-execution-spine/t068-independent-review-reconciliation-addendum.md'
      - name: Commit documentation-only contradiction repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- specs/003-workspace-execution-spine/t068-independent-review-reconciliation-addendum.md
          test "$(git diff --cached --name-only)" = 'specs/003-workspace-execution-spine/t068-independent-review-reconciliation-addendum.md'
          git diff --cached --check
          git commit -m 'docs(003): align T068 closeout preamble'
          git push origin 'HEAD:fix/003-t068-independent-review-findings'
