name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  t068-history-identity-lint-repair:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repair carrier
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Verify checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Apply portability-only stat identity repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/command/history/history_prune.rs')
          text = p.read_text(encoding='utf-8')
          old_identity = 'let identity = (stat.st_dev as u64, stat.st_ino as u64);'
          old_current = 'let current = (stat.st_dev as u64, stat.st_ino as u64);'
          if text.count(old_identity) != 1 or text.count(old_current) != 1:
              raise SystemExit('expected exact Linux Clippy cast sites not found')
          helper_anchor = '#[cfg(unix)]\nfn remove_session_object_bound('
          helper = '''#[cfg(all(unix, target_os = "linux"))]\nfn unix_stat_identity(stat: &libc::stat) -> HistoryPathIdentity {\n    (stat.st_dev, stat.st_ino)\n}\n\n#[cfg(all(unix, target_os = "macos"))]\nfn unix_stat_identity(stat: &libc::stat) -> HistoryPathIdentity {\n    (stat.st_dev as u64, stat.st_ino)\n}\n\n#[cfg(all(unix, not(any(target_os = "linux", target_os = "macos"))))]\nfn unix_stat_identity(stat: &libc::stat) -> HistoryPathIdentity {\n    (stat.st_dev as u64, stat.st_ino as u64)\n}\n\n'''
          if helper_anchor not in text or 'fn unix_stat_identity(' in text:
              raise SystemExit('stat identity helper anchor missing or helper already present')
          text = text.replace(helper_anchor, helper + helper_anchor, 1)
          text = text.replace(old_identity, 'let identity = unix_stat_identity(&stat);', 1)
          text = text.replace(old_current, 'let current = unix_stat_identity(&stat);', 1)
          p.write_text(text, encoding='utf-8')
          PY
          cargo fmt --all
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked command::history::tests
      - name: Commit only repaired source
        shell: bash
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/command/history/history_prune.rs
          test "$(git diff --cached --name-only)" = "src/command/history/history_prune.rs"
          git commit -m "fix(003): normalize Unix history filesystem identity"
          git push origin "HEAD:${BRANCH}"

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Verify checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets --all-features
