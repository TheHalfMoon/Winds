name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  t068-wsl-post-exit-drain-repair:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 63
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repair carrier
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Verify checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Apply bounded WSL post-exit drain repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          path = Path('src/wsl_launch.rs')
          text = path.read_text()
          repaired_marker = 'post-exit output draining exceeded the reserved cleanup deadline'
          if repaired_marker in text:
              print('repair already present; no source mutation required')
              raise SystemExit(0)

          actual_blob = subprocess.check_output(
              ['git', 'hash-object', 'src/wsl_launch.rs'], text=True
          ).strip()
          expected_blob = '081732211fb3e900c518136a8b3d4ef66e6a6236'
          assert actual_blob == expected_blob, (actual_blob, expected_blob)

          status_anchor = '    let status = loop {'
          status_at = text.index(status_anchor)
          post_exit_marker = '\n\n    loop {\n        match drain_pair('
          loop_at = text.index(post_exit_marker, status_at) + 2
          loop_end_marker = '\n\n    // The launcher has exited and output has been drained.'
          loop_end = text.index(loop_end_marker, loop_at)
          old_loop = text[loop_at:loop_end]
          assert old_loop.startswith('    loop {\n')
          assert 'output draining failed and WSL-side cleanup proof cannot be trusted' in old_loop

          new_loop = '''    // Post-exit pipe draining is cleanup work, but it must not consume the
              // entire reserved cleanup window. Give draining at most half of the
              // remaining cleanup budget so process-scope termination still has time
              // to run if a descendant keeps an inherited pipe continuously writable.
              let post_exit_drain_deadline = {
                  let now = Instant::now();
                  now + cleanup_deadline.saturating_duration_since(now) / 2
              };
              loop {
                  if Instant::now() >= post_exit_drain_deadline {
                      let cleanup = child.terminate_and_prove(cleanup_deadline, OWNED_LABEL);
                      return Err(format!(
                          "selected WSL command launcher exited, but post-exit output draining exceeded the reserved cleanup deadline; WSL-side cleanup proof cannot be trusted; bounded Windows launcher cleanup {}",
                          cleanup
                              .map(|()| "was proven".to_owned())
                              .unwrap_or_else(|error| format!("was not proven: {error}"))
                      )
                      .into());
                  }
                  match drain_pair(
                      &mut stdout,
                      &mut stderr,
                      &mut stdout_bytes,
                      &mut stderr_bytes,
                      &mut stderr_control_tail,
                      &mut stdout_truncated,
                      &mut stderr_truncated,
                  ) {
                      Ok(true) => continue,
                      Ok(false) => break,
                      Err(error) => {
                          let cleanup = child.terminate_and_prove(cleanup_deadline, OWNED_LABEL);
                          return Err(format!(
                              "selected WSL command launcher exited, but output draining failed and WSL-side cleanup proof cannot be trusted: {error}; bounded Windows launcher cleanup {}",
                              cleanup
                                  .map(|()| "was proven".to_owned())
                                  .unwrap_or_else(|cleanup_error| format!("was not proven: {cleanup_error}"))
                          )
                          .into());
                      }
                  }
              }'''
          text = text[:loop_at] + new_loop + text[loop_end:]

          function_anchor = '#[cfg(all(windows, test))]\npub(crate) fn prove_wsl_exec_scope_cleanup_for_test'
          function_at = text.index(function_anchor)
          insert_marker = '\n    Ok(())\n}\n\n#[cfg(windows)]\nfn require_same_canonical_windows_path'
          insert_at = text.index(insert_marker, function_at)
          regression = '''

              // Regression for the post-exit drain bound. This test-only arbitrary
              // command deliberately escapes the tracked Linux process group and keeps
              // stdout continuously writable after the supervised target exits. The
              // production call graph does not expose arbitrary commands through this
              // helper; the fixture exists only to prove host-side draining is bounded.
              let post_exit_writer_script = r#"/usr/bin/setsid /bin/sh -c '/bin/sleep 7 </dev/null >/dev/null 2>&1 & timer=$!; while /bin/kill -0 \"$timer\" 2>/dev/null; do printf x; done; wait \"$timer\" 2>/dev/null || :' & exit 0"#;
              let drain_started = std::time::Instant::now();
              let drain_error = run_wsl_exec_with_limits(
                  &launcher,
                  distribution,
                  None,
                  "/bin/sh",
                  &[OsString::from("-c"), OsString::from(post_exit_writer_script)],
                  1,
                  Duration::from_secs(5),
              )
              .unwrap_err()
              .to_string();
              let drain_elapsed = drain_started.elapsed();
              if !drain_error.contains(
                  "post-exit output draining exceeded the reserved cleanup deadline",
              ) || !drain_error.contains("WSL-side cleanup proof cannot be trusted")
                  || drain_elapsed > Duration::from_secs(6)
              {
                  return Err(format!(
                      "WSL post-exit drain regression was not bounded as expected: elapsed={drain_elapsed:?}, error={drain_error}"
                  )
                  .into());
              }'''
          text = text[:insert_at] + regression + text[insert_at:]
          path.write_text(text)
          PY

          cargo fmt --all
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features
      - name: Commit tested repair only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/wsl_launch.rs; then
            echo 'source repair already present; no push required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/wsl_launch.rs
          test "$(git diff --cached --name-only)" = 'src/wsl_launch.rs'
          git diff --cached --exit-code -- .github/workflows/quality.yml
          git commit -m 'fix(003): bound WSL post-exit output drain'
          git push origin 'HEAD:fix/003-t068-independent-review-findings'

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Verify checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets --all-features
