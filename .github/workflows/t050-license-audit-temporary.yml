name: t050-license-audit-temporary

on:
  push:
    branches: [feat/003-t050-unix-pty-lifecycle]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Report exact T050 locked package metadata
        shell: bash
        run: |
          cargo metadata --locked --format-version 1 > /tmp/metadata.json
          python - <<'PY'
          import json
          wanted = {
              ('anyhow','1.0.104'), ('bitflags','1.3.2'), ('cfg_aliases','0.1.1'),
              ('downcast-rs','1.2.1'), ('filedescriptor','0.8.3'), ('lazy_static','1.5.0'),
              ('log','0.4.33'), ('nix','0.28.0'), ('portable-pty','0.9.0'),
              ('serial2','0.2.38'), ('shared_library','0.1.9'), ('shell-words','1.1.1'),
              ('thiserror','1.0.69'), ('thiserror-impl','1.0.69'), ('winapi','0.3.9'),
              ('winapi-i686-pc-windows-gnu','0.4.0'), ('winapi-x86_64-pc-windows-gnu','0.4.0'),
              ('windows-link','0.2.1'), ('windows-sys','0.61.2'), ('winreg','0.10.1'),
          }
          data = json.load(open('/tmp/metadata.json'))
          found = set()
          for p in sorted(data['packages'], key=lambda p: (p['name'], p['version'])):
              key = (p['name'], p['version'])
              if key in wanted:
                  found.add(key)
                  print(f"T050_LICENSE|{p['name']}|{p['version']}|{p.get('license')}|{p.get('repository')}|{p.get('source')}")
          missing = wanted - found
          if missing:
              raise SystemExit(f"missing expected packages: {sorted(missing)}")
          PY
