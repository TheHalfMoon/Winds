name: desktop-quality

on:
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-quality.yml"
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-quality.yml"

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  macos-desktop:
    runs-on: macos-15
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Verify checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Attest macOS runner domain
        shell: bash
        run: |
          sw_vers
          arch="$(uname -m)"
          case "$arch" in
            arm64|x86_64) ;;
            *) echo "unsupported macOS architecture: $arch" >&2; exit 1 ;;
          esac
          echo "T128_MACOS_ARCH=$arch"
      - name: Install exact Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install and verify exact npm
        run: |
          npm install --global npm@10.9.8
          test "$(npm --version)" = "10.9.8"
      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Install renderer dependencies
        working-directory: desktop
        run: npm ci --ignore-scripts
      - name: Frontend format
        working-directory: desktop
        run: npm run format:check
      - name: Frontend typecheck and lint
        working-directory: desktop
        run: npm run typecheck && npm run lint
      - name: Frontend tests and build
        working-directory: desktop
        run: npm test && npm run frontend:build
      - name: Desktop Rust format
        run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml -- --check
      - name: Desktop Rust clippy
        run: >-
          cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --locked
          --all-targets --all-features -- -D warnings
      - name: Build inert Tauri desktop host
        working-directory: desktop
        run: npm run desktop:build
