name: t053-macos-diagnostic-temporary

on:
  push:
    branches: [feat/003-t053-terminal-ledger]
    paths:
      - ".github/workflows/t053-macos-diagnostic-temporary.yml"

permissions:
  contents: read

jobs:
  execution-test:
    strategy:
      fail-fast: false
      matrix:
        test:
          - execution::tests::native_terminal_records_running_then_natural_exit
          - execution::tests::controlled_terminate_records_interrupted
          - execution::tests::dropping_live_terminal_closes_owned_child_and_finalizes_ledger
          - execution::tests::launch_failure_records_failed_to_start_without_duration
    runs-on: macos-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Run isolated T053 execution test
        run: cargo test --locked --bin winds "${{ matrix.test }}" -- --exact --nocapture --test-threads=1
  store-tests:
    runs-on: macos-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Run T053 store tests
        run: cargo test --locked --bin winds store::persistence_tests -- --nocapture --test-threads=1
