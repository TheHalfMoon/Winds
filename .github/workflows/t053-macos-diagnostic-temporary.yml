name: t053-macos-diagnostic-temporary

on:
  push:
    branches: [feat/003-t053-terminal-ledger]
    paths:
      - ".github/workflows/t053-macos-diagnostic-temporary.yml"

permissions:
  contents: read

jobs:
  execution-test:
    strategy:
      fail-fast: false
      matrix:
        test:
          - execution::tests::native_terminal_records_running_then_natural_exit
          - execution::tests::dropping_live_terminal_closes_owned_child_and_finalizes_ledger
    runs-on: macos-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Inject local trace markers only
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/execution.rs")
          text = path.read_text(encoding="utf-8")

          wait_marker = "        let exit = self.session.wait()?;\n        self.pending_final = Some(TerminalFinalization::Exited {\n"
          wait_replacement = "        eprintln!(\"TRACE:T053_WAIT:before_session_wait\");\n        let exit = self.session.wait()?;\n        eprintln!(\"TRACE:T053_WAIT:after_session_wait\");\n        self.pending_final = Some(TerminalFinalization::Exited {\n"
          if text.count(wait_marker) != 1:
              raise SystemExit(f"wait marker count={text.count(wait_marker)}")
          text = text.replace(wait_marker, wait_replacement, 1)

          drop_try = "        let already_exited = matches!(self.session.try_wait(), Ok(Some(_)));\n"
          drop_try_replacement = "        eprintln!(\"TRACE:T053_DROP:before_try_wait\");\n        let already_exited = matches!(self.session.try_wait(), Ok(Some(_)));\n        eprintln!(\"TRACE:T053_DROP:after_try_wait:{already_exited}\");\n"
          if text.count(drop_try) != 1:
              raise SystemExit(f"drop try marker count={text.count(drop_try)}")
          text = text.replace(drop_try, drop_try_replacement, 1)

          drop_close = "        let cleanup_proven = self.session.close().is_ok();\n"
          drop_close_replacement = "        eprintln!(\"TRACE:T053_DROP:before_session_close\");\n        let cleanup_proven = self.session.close().is_ok();\n        eprintln!(\"TRACE:T053_DROP:after_session_close:{cleanup_proven}\");\n"
          if text.count(drop_close) != 1:
              raise SystemExit(f"drop close marker count={text.count(drop_close)}")
          text = text.replace(drop_close, drop_close_replacement, 1)

          natural_send = "        execution.send_input(b\"exit 0\\n\").unwrap();\n        let exit = execution.wait().unwrap();\n"
          natural_send_replacement = "        eprintln!(\"TRACE:T053_TEST:natural_before_send\");\n        execution.send_input(b\"exit 0\\n\").unwrap();\n        eprintln!(\"TRACE:T053_TEST:natural_after_send\");\n        let exit = execution.wait().unwrap();\n        eprintln!(\"TRACE:T053_TEST:natural_after_wait\");\n"
          if text.count(natural_send) != 1:
              raise SystemExit(f"natural marker count={text.count(natural_send)}")
          text = text.replace(natural_send, natural_send_replacement, 1)

          drop_test_start = "        let execution = TerminalExecution::start_native(\n            &mut store,\n            \"execution-drop\",\n"
          drop_test_start_replacement = "        eprintln!(\"TRACE:T053_TEST:drop_before_start\");\n        let execution = TerminalExecution::start_native(\n            &mut store,\n            \"execution-drop\",\n"
          if text.count(drop_test_start) != 1:
              raise SystemExit(f"drop start marker count={text.count(drop_test_start)}")
          text = text.replace(drop_test_start, drop_test_start_replacement, 1)

          drop_test = "        drop(execution);\n        let final_record = store.load_execution(\"execution-drop\").unwrap();\n"
          drop_test_replacement = "        eprintln!(\"TRACE:T053_TEST:drop_after_start_before_drop\");\n        drop(execution);\n        eprintln!(\"TRACE:T053_TEST:drop_after_drop\");\n        let final_record = store.load_execution(\"execution-drop\").unwrap();\n"
          if text.count(drop_test) != 1:
              raise SystemExit(f"drop test marker count={text.count(drop_test)}")
          text = text.replace(drop_test, drop_test_replacement, 1)

          path.write_text(text, encoding="utf-8")
      - name: Run traced isolated T053 execution test
        run: cargo test --locked --bin winds "${{ matrix.test }}" -- --exact --nocapture --test-threads=1
