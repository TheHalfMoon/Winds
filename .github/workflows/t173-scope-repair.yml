name: t173-scope-repair

on:
  push:
    branches:
      - impl/spec-012-t173-agent-observation
    paths:
      - .github/workflows/t173-scope-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: impl/spec-012-t173-agent-observation
          fetch-depth: 0

      - name: Restore scope comments and format
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/persistent_runtime/owner.rs")
          text = path.read_text()
          replacements = [
              (
                  "                    TopologyOperationV2::BindPaneRuntime {\n",
                  "                    // Only the owner knows whether a runtime namespace is an accepted,\n"
                  "                    // live one. A pane may never be bound to a namespace this owner\n"
                  "                    // does not hold, so the liveness proof happens before the domain\n"
                  "                    // ever records the reference.\n"
                  "                    TopologyOperationV2::BindPaneRuntime {\n",
              ),
              (
                  "        if let ProtocolPayload::ApplyTopologyOperation {\n",
                  "        // `pane.clear` converges observers with a typed clear marker that carries\n"
                  "        // the owner-assigned pane-local presentation epoch. It is presentation only:\n"
                  "        // no lifecycle, verification, or evidence state changes with it.\n"
                  "        if let ProtocolPayload::ApplyTopologyOperation {\n",
              ),
              (
                  "        if unsafe { libc::flock(file.as_raw_fd(), libc::LOCK_EX | libc::LOCK_NB) } != 0 {\n",
                  "        // SAFETY: file owns a valid descriptor for the private regular lock file. The kernel\n"
                  "        // releases this advisory lock automatically when the File is dropped.\n"
                  "        if unsafe { libc::flock(file.as_raw_fd(), libc::LOCK_EX | libc::LOCK_NB) } != 0 {\n",
              ),
              (
                  "                if !self.0.is_null() {\n                    let _ = unsafe { windows_sys::Win32::Foundation::LocalFree(self.0) };\n",
                  "                if !self.0.is_null() {\n"
                  "                    // SAFETY: the descriptor was allocated by the SDDL conversion API via LocalAlloc.\n"
                  "                    let _ = unsafe { windows_sys::Win32::Foundation::LocalFree(self.0) };\n",
              ),
              (
                  "        let mut raw_descriptor: PSECURITY_DESCRIPTOR = null_mut();\n        if unsafe {\n",
                  "        let mut raw_descriptor: PSECURITY_DESCRIPTOR = null_mut();\n"
                  "        // SAFETY: sddl_wide is NUL-terminated and raw_descriptor is a valid writable output pointer.\n"
                  "        if unsafe {\n",
              ),
              (
                  "        wide.push(0);\n        let handle = unsafe {\n",
                  "        wide.push(0);\n"
                  "        // SAFETY: wide is NUL-terminated, security points to a live descriptor, share mode zero\n"
                  "        // gives the singleton kernel ownership property, and template handle is null.\n"
                  "        let handle = unsafe {\n",
              ),
              (
                  "        if handle == INVALID_HANDLE_VALUE || handle.is_null() {\n            let code = unsafe { GetLastError() };\n",
                  "        if handle == INVALID_HANDLE_VALUE || handle.is_null() {\n"
                  "            // SAFETY: GetLastError has no preconditions.\n"
                  "            let code = unsafe { GetLastError() };\n",
              ),
              (
                  "        if validate_pipe_owner_and_dacl(handle, &user_sid).is_err() {\n            let _ = unsafe { CloseHandle(handle) };\n",
                  "        if validate_pipe_owner_and_dacl(handle, &user_sid).is_err() {\n"
                  "            // SAFETY: handle is owned by this scope and has not been transferred.\n"
                  "            let _ = unsafe { CloseHandle(handle) };\n",
              ),
              (
                  "        {\n            let _ = unsafe { windows_sys::Win32::Foundation::CloseHandle(self.handle) };\n",
                  "        {\n"
                  "            // SAFETY: this guard owns the singleton file handle and closes it exactly once.\n"
                  "            let _ = unsafe { windows_sys::Win32::Foundation::CloseHandle(self.handle) };\n",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one repair anchor, found {count}: {old!r}")
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          cargo fmt --all
          rm .github/workflows/t173-scope-repair.yml
          git diff --check

      - name: Commit repaired tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/persistent_runtime/owner.rs .github/workflows/t173-scope-repair.yml
          git diff --cached --check
          git commit -m "chore(spec-012): restore T173 owner scope comments"
          git push origin HEAD:impl/spec-012-t173-agent-observation
