name: T174 final owner-generation repair executor

on:
  push:
    branches:
      - repair/t174-final-owner-recheck-4305904

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repair executor
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Preserve patcher and checkout exact T174 candidate
        shell: bash
        run: |
          set -euo pipefail
          cp .github/t174_final_owner_recheck.py "$RUNNER_TEMP/t174_final_owner_recheck.py"
          git fetch --no-tags origin refs/heads/impl/spec-012-t174-agent-dock
          test "$(git rev-parse FETCH_HEAD)" = "4305904223df8510ff146a784c44c880804d3b6f"
          git checkout --detach FETCH_HEAD

      - name: Apply final owner-generation recheck
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/t174_final_owner_recheck.py"
          git diff --check
          test "$(git diff --name-only)" = "src/workbench.rs"

      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Format
        shell: bash
        run: cargo fmt --all -- --check

      - name: Focused T174 tests
        shell: bash
        run: cargo test --locked --bin winds t174 -- --test-threads=1

      - name: Clippy
        shell: bash
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Commit product-only repair
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = "src/workbench.rs"
          git config user.name "Winds qualification bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/workbench.rs
          git commit -m "fix: reject T174 focus across owner rollover"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:impl/spec-012-t174-agent-dock
