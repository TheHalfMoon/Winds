name: T174 final owner-generation repair executor

on:
  push:
    branches:
      - repair/t174-final-owner-recheck-4305904

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact T174 candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: impl/spec-012-t174-agent-dock
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact repair base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "4305904223df8510ff146a784c44c880804d3b6f"

      - name: Apply final owner-generation recheck
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/workbench.rs')
          text = path.read_text()
          old = '''    let mut dock = ui::CanonicalAgentDockPresentation::from_observations(trailing_observations)?;
    dock.focus(observation_id, &topology)
        .ok_or_else(|| "focus target is stale, absent, ambiguous, or substituted".to_owned())?;
    Ok((dock, topology))
'''
          new = '''    let mut dock = ui::CanonicalAgentDockPresentation::from_observations(trailing_observations)?;
    dock.focus(observation_id, &topology)
        .ok_or_else(|| "focus target is stale, absent, ambiguous, or substituted".to_owned())?;

    let final_owner_generation_id = store
        .latest_persistent_runtime_owner_generation()
        .map_err(|error| format!("final owner generation record unavailable: {error}"))?
        .ok_or_else(|| "owner generation unavailable after focus validation".to_owned())?;
    if final_owner_generation_id != owner_generation_id {
        return Err("focus owner generation changed during validation".to_owned());
    }
    Ok((dock, topology))
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one guarded focus-return block, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          test "$(git diff --name-only)" = "src/workbench.rs"

      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Format
        shell: bash
        run: cargo fmt --all -- --check

      - name: Focused T174 tests
        shell: bash
        run: cargo test --locked --bin winds t174 -- --test-threads=1

      - name: Clippy
        shell: bash
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Commit product-only repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = "src/workbench.rs"
          git config user.name "Winds qualification bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/workbench.rs
          git commit -m "fix: reject T174 focus across owner rollover"
          git push origin HEAD:impl/spec-012-t174-agent-dock
