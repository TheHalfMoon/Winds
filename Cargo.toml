[package]
name = "winds-control"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/TheHalfMoon/Winds"
readme = "README.md"
description = "Independent verification runtime for agent-generated software."

[[bin]]
name = "winds"
path = "src/main.rs"

[dependencies]
crossterm = { version = "=0.29.0", default-features = false, features = ["bracketed-paste", "events", "windows", "derive-more"] }
libc = "=0.2.189"
portable-pty = "=0.9.0"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
