[package]
name = "winds-control"
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[[bin]]
name = "winds"
path = "src/main.rs"

[dependencies]
libc = "=0.2.189"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
